<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111b"><title>HAL Garage · Administración Club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#07111b;--panel:#0e1d2a;--line:#263b4e;--text:#f4f8fb;--muted:#91a4b7;--blue:#1595ff;--green:#49cf42;--red:#ff6262;--gold:#f0b52b;--orange:#ffb52e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:50px}header{position:sticky;top:0;z-index:5;background:#091722;border-bottom:1px solid var(--line);padding:14px 15px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900}.logo b{color:#2ba9ff}.muted{color:var(--muted);font-size:12px}main{padding:15px}.back{display:inline-block;margin-bottom:12px;color:#8dccff;text-decoration:none;font-size:12px;font-weight:800}.title{font-size:25px;font-weight:900;margin:2px 0}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:15px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:7px;margin-bottom:8px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0d1b28;color:#b9c8d5;border-radius:10px;padding:9px 11px;font-weight:800;font-size:12px;cursor:pointer}.tab.on{background:#117ff0;border-color:#117ff0;color:#fff}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}label{display:block;font-size:12px;color:var(--muted);margin-top:7px}input,textarea,select{width:100%;background:#07131f;border:1px solid #2a4359;color:#fff;border-radius:9px;padding:10px;margin:5px 0 8px;font:inherit}textarea{min-height:70px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#152b3d}.btn.red{background:#b8323f}.btn.green{background:#237b32}.btn.gold{background:#8d6b11}.row{display:flex;gap:7px;flex-wrap:wrap}.list{display:grid;gap:9px}.item{background:#0b1925;border:1px solid #21384b;border-radius:12px;padding:12px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#15334b;color:#8dccff}.badge.off{background:#39262a;color:#ff9b9b}.badge.green{background:#183820;color:#8de88a}.badge.gold{background:#3b3217;color:#f4d477}.empty{text-align:center;color:var(--muted);padding:25px}.msg{margin:8px 0;padding:9px;border-radius:9px;background:#122738;font-size:13px}.msg.err{background:#3b2025;color:#ffb0b0}.hidden{display:none!important}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#0b1925;border:1px solid #21384b;border-radius:12px;padding:13px}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:var(--muted)}.check{display:flex;gap:8px;align-items:center;color:#dce7ef;font-size:12px;margin:7px 0}.check input{width:auto;margin:0}.danger{border-color:#63343b}.small{font-size:11px;color:var(--muted)}
@media(max-width:650px){.grid2,.statgrid{grid-template-columns:1fr 1fr}}@media(max-width:440px){.grid2,.statgrid{grid-template-columns:1fr}.itemtop{display:block}.actions{margin-top:9px}}
</style></head>
<body><div class="app"><header><div class="logo">HAL <b>Garage</b> · Club</div><div class="muted" id="authState">Verificando...</div></header><main>
<a class="back" href="./admin.html">← Centro del Club</a>
<div class="title" id="title">Administración</div><div class="sub" id="sub">Gestiona el programa de fidelización desde aquí.</div>
<div id="message" class="hidden"></div><div class="tabs" id="tabs"></div><div id="content"><div class="empty">Cargando...</div></div>
</main></div>
<script>
const SUPABASE_URL='https://maqnglazkhwtzskfddgc.supabase.co';
const SUPABASE_KEY='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';
const STAFF_SESSION_KEY='HAL_STAFF_SUPABASE_SESSION';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:true,persistSession:false,detectSessionInUrl:false}});
const params=new URLSearchParams(location.search);let moduleName=params.get('module')||'rewards';let currentUser=null;let cache={};
const MODULES={rewards:['🎁','Premios y descuentos','Administra premios por puntos y productos del catálogo.'],categories:['👑','Categorías','Configura las categorías del Club y deja sus reglas editables.'],points:['⭐','Puntos','Consulta movimientos y realiza ajustes manuales autorizados.'],redemptions:['🎟️','Canjes','Controla solicitudes, estados y entregas de premios.'],customers:['👥','Clientes del Club','Consulta miembros, puntos, categoría y vehículos asociados.'],benefits:['📢','Beneficios','Administra beneficios visibles para los miembros.'],notifications:['🔔','Notificaciones','Crea avisos y promociones para el Club.'],stats:['📊','Estadísticas','Resumen de actividad del programa.'],config:['⚙️','Configuración','Ajustes generales y reglas de categorías.']};
function $(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function msg(t,err=false){const e=$('message');e.textContent=t;e.className='msg'+(err?' err':'');setTimeout(()=>e.classList.add('hidden'),5000)}function fmt(s){if(!s)return '-';return new Intl.DateTimeFormat('es-PE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s))}
async function restoreStaffSession(){try{const raw=localStorage.getItem(STAFF_SESSION_KEY);if(!raw)return false;const s=JSON.parse(raw);if(!s?.access_token||!s?.refresh_token)return false;const {data,error}=await db.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});if(error||!data?.session)throw error||new Error('Sesión inválida');localStorage.setItem(STAFF_SESSION_KEY,JSON.stringify({access_token:data.session.access_token,refresh_token:data.session.refresh_token}));return true}catch(e){localStorage.removeItem(STAFF_SESSION_KEY);return false}}
async function auth(){await restoreStaffSession();const {data,error}=await db.auth.getUser();if(error||!data.user){$('authState').textContent='Sin sesión';return null}$('authState').textContent=data.user.email||'Usuario';return data.user}
function setup(){const m=MODULES[moduleName]||MODULES.rewards;if(!MODULES[moduleName])moduleName='rewards';$('title').textContent=m[0]+' '+m[1];$('sub').textContent=m[2];$('tabs').innerHTML=Object.entries(MODULES).map(([k,v])=>`<button class="tab ${k===moduleName?'on':''}" onclick="go('${k}')">${v[0]} ${v[1]}</button>`).join('')}
function go(k){location.href='./admin-modulos.html?module='+encodeURIComponent(k)}
async function q(table,select='*',order='created_at',ascending=false){const r=await db.from(table).select(select).order(order,{ascending});if(r.error)throw r.error;return r.data||[]}
function need(){if(!currentUser){$('content').innerHTML='<div class="empty">🔐 No hay una sesión de Supabase para el personal.<br><span class="small">Primero debemos conectar el acceso interno de HAL Garage con Supabase Auth. No se ha debilitado la seguridad para evitar exponer el programa.</span></div>';return false}return true}

async function renderRewards(){
 let rewards=[],products=[];try{[rewards,products]=await Promise.all([q('club_rewards'),q('club_catalog_products')])}catch(e){return fail(e)}
 cache={rewards,products};$('content').innerHTML=`<section class="card"><h3>🎁 Premio del Club</h3><input type="hidden" id="rid"><label>Título</label><input id="rtitle" placeholder="Lavado Completo Gratis"><label>Descripción</label><textarea id="rdesc" placeholder="Canjea este premio con tus puntos"></textarea><div class="grid2"><div><label>Tipo</label><select id="rtype"><option value="points">Canje por puntos</option><option value="discount">Descuento</option><option value="service">Servicio</option><option value="other">Otro</option></select></div><div><label>Stock (vacío = ilimitado)</label><input id="rstock" type="number" min="0"></div></div><div class="grid2"><div><label>Inicio</label><input id="rstart" type="datetime-local"></div><div><label>Vencimiento</label><input id="rexp" type="datetime-local"></div></div><label class="check"><input id="ractive" type="checkbox" checked> Premio activo</label><div class="row"><button class="btn" onclick="saveReward()">Guardar premio</button><button class="btn alt" onclick="resetReward()">Limpiar</button></div></section><section class="card"><h3>Premios registrados</h3><div class="list">${rewards.length?rewards.map(rewardCard).join(''):'<div class="empty">No hay premios registrados.</div>'}</div></section>
<section class="card"><h3>🧴 Producto del catálogo</h3><input type="hidden" id="pid"><label>Nombre</label><input id="pname" placeholder="Producto / beneficio canjeable"><label>Descripción</label><textarea id="pdesc"></textarea><div class="grid2"><div><label>Puntos necesarios</label><input id="pcost" type="number" min="0"></div><div><label>Stock (vacío = ilimitado)</label><input id="pstock" type="number" min="0"></div></div><label>Imagen (ruta/URL)</label><input id="pimage" placeholder="https://..."><label class="check"><input id="pactive" type="checkbox" checked> Producto activo</label><div class="row"><button class="btn" onclick="saveProduct()">Guardar producto</button><button class="btn alt" onclick="resetProduct()">Limpiar</button></div></section><section class="card"><h3>Productos registrados</h3><div class="list">${products.length?products.map(productCard).join(''):'<div class="empty">No hay productos registrados.</div>'}</div></section>`}
function rewardCard(x){return `<div class="item"><div class="itemtop"><div><b>${esc(x.title)}</b> <span class="badge ${x.active?'green':'off'}">${x.active?'ACTIVO':'INACTIVO'}</span><div class="meta">${esc(x.description||'')}<br>Tipo: ${esc(x.reward_type)} · Stock: ${x.stock==null?'Ilimitado':x.stock}<br>📅 ${fmt(x.starts_at)} → ${fmt(x.expires_at)}</div></div><div class="actions"><button class="btn alt" onclick="editReward('${x.id}')">Editar</button><button class="btn ${x.active?'red':'green'}" onclick="toggleReward('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button></div></div></div>`}
function productCard(x){return `<div class="item"><div class="itemtop"><div><b>${esc(x.name)}</b> <span class="badge ${x.active?'green':'off'}">${x.active?'ACTIVO':'INACTIVO'}</span><div class="meta">${esc(x.description||'')}<br>⭐ Costo: <b>${x.points_cost}</b> puntos · Stock: ${x.stock==null?'Ilimitado':x.stock}</div></div><div class="actions"><button class="btn alt" onclick="editProduct('${x.id}')">Editar</button><button class="btn ${x.active?'red':'green'}" onclick="toggleProduct('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button></div></div></div>`}
function editReward(id){const x=cache.rewards.find(a=>a.id===id);if(!x)return;$('rid').value=x.id;$('rtitle').value=x.title||'';$('rdesc').value=x.description||'';$('rtype').value=x.reward_type||'points';$('rstock').value=x.stock??'';$('rstart').value=x.starts_at?x.starts_at.slice(0,16):'';$('rexp').value=x.expires_at?x.expires_at.slice(0,16):'';$('ractive').checked=!!x.active;scrollTo(0,0)}
function resetReward(){['rid','rtitle','rdesc','rstock','rstart','rexp'].forEach(id=>$(id).value='');$('rtype').value='points';$('ractive').checked=true}
async function saveReward(){const id=$('rid').value,p={title:$('rtitle').value.trim(),description:$('rdesc').value.trim(),reward_type:$('rtype').value,stock:$('rstock').value===''?null:Number($('rstock').value),starts_at:$('rstart').value||null,expires_at:$('rexp').value||null,active:$('ractive').checked};if(!p.title)return msg('Ingresa un título.',true);const r=id?await db.from('club_rewards').update(p).eq('id',id):await db.from('club_rewards').insert(p);if(r.error)return msg(r.error.message,true);msg(id?'Premio actualizado.':'Premio creado.');renderRewards()}
async function toggleReward(id,active){const r=await db.from('club_rewards').update({active}).eq('id',id);if(r.error)return msg(r.error.message,true);renderRewards()}
function editProduct(id){const x=cache.products.find(a=>a.id===id);if(!x)return;$('pid').value=x.id;$('pname').value=x.name||'';$('pdesc').value=x.description||'';$('pcost').value=x.points_cost??0;$('pstock').value=x.stock??'';$('pimage').value=x.image_path||'';$('pactive').checked=!!x.active;scrollTo(0,0)}
function resetProduct(){['pid','pname','pdesc','pstock','pimage'].forEach(id=>$(id).value='');$('pcost').value='0';$('pactive').checked=true}
async function saveProduct(){const id=$('pid').value,p={name:$('pname').value.trim(),description:$('pdesc').value.trim(),points_cost:Math.max(0,Number($('pcost').value||0)),stock:$('pstock').value===''?null:Number($('pstock').value),image_path:$('pimage').value.trim()||null,active:$('pactive').checked,updated_at:new Date().toISOString()};if(!p.name)return msg('Ingresa un nombre.',true);const r=id?await db.from('club_catalog_products').update(p).eq('id',id):await db.from('club_catalog_products').insert(p);if(r.error)return msg(r.error.message,true);msg(id?'Producto actualizado.':'Producto creado.');renderRewards()}
async function toggleProduct(id,active){const r=await db.from('club_catalog_products').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return msg(r.error.message,true);renderRewards()}

async function renderCategories(){let rows;try{rows=await q('club_categories','*','sort_order',true)}catch(e){return fail(e)}cache.rows=rows;$('content').innerHTML=`<section class="card"><h3>👑 Categoría</h3><input type="hidden" id="cid"><label>Código interno</label><input id="ccode" placeholder="BRONCE"><label>Nombre visible</label><input id="cname" placeholder="BRONCE"><label>Descripción</label><textarea id="cdesc"></textarea><div class="grid2"><div><label>Tipo de regla</label><select id="ctype"><option value="manual">Manual</option><option value="points">Por puntos</option><option value="visits">Por visitas</option><option value="spend">Por consumo</option><option value="custom">Personalizada</option></select></div><div><label>Orden</label><input id="corder" type="number" value="0"></div></div><label>Regla (JSON, editable)</label><textarea id="crule" placeholder='{"min":0,"max":0}'>{}</textarea><label class="check"><input id="cactive" type="checkbox" checked> Categoría activa</label><div class="row"><button class="btn" onclick="saveCategory()">Guardar categoría</button><button class="btn alt" onclick="resetCategory()">Limpiar</button></div><div class="small">No se han inventado umbrales. La regla queda editable para definir las condiciones reales de HAL Garage.</div></section><section class="card"><h3>Categorías registradas</h3><div class="list">${rows.length?rows.map(categoryCard).join(''):'<div class="empty">No hay categorías configuradas.</div>'}</div></section>`}
function categoryCard(x){return `<div class="item"><div class="itemtop"><div><b>${esc(x.name)}</b> <span class="badge">${esc(x.code)}</span> <span class="badge ${x.active?'green':'off'}">${x.active?'ACTIVA':'INACTIVA'}</span><div class="meta">${esc(x.description||'')}<br>Regla: ${esc(x.rule_type)} · Configuración: ${esc(JSON.stringify(x.rule_config||{}))}</div></div><div class="actions"><button class="btn alt" onclick="editCategory('${x.id}')">Editar</button><button class="btn ${x.active?'red':'green'}" onclick="toggleCategory('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button></div></div></div>`}
function editCategory(id){const x=cache.rows.find(a=>a.id===id);if(!x)return;$('cid').value=x.id;$('ccode').value=x.code||'';$('cname').value=x.name||'';$('cdesc').value=x.description||'';$('ctype').value=x.rule_type||'manual';$('corder').value=x.sort_order??0;$('crule').value=JSON.stringify(x.rule_config||{},null,2);$('cactive').checked=!!x.active;scrollTo(0,0)}
function resetCategory(){['cid','ccode','cname','cdesc'].forEach(id=>$(id).value='');$('ctype').value='manual';$('corder').value='0';$('crule').value='{}';$('cactive').checked=true}
async function saveCategory(){let rule={};try{rule=JSON.parse($('crule').value||'{}')}catch(e){return msg('La regla debe ser un JSON válido.',true)}const id=$('cid').value,p={code:$('ccode').value.trim().toUpperCase(),name:$('cname').value.trim(),description:$('cdesc').value.trim(),rule_type:$('ctype').value,rule_config:rule,sort_order:Number($('corder').value||0),active:$('cactive').checked,updated_at:new Date().toISOString()};if(!p.code||!p.name)return msg('Completa código y nombre.',true);const r=id?await db.from('club_categories').update(p).eq('id',id):await db.from('club_categories').insert(p);if(r.error)return msg(r.error.message,true);msg(id?'Categoría actualizada.':'Categoría creada.');renderCategories()}
async function toggleCategory(id,active){const r=await db.from('club_categories').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return msg(r.error.message,true);renderCategories()}

async function renderPoints(){let tx;try{tx=await q('club_point_transactions','*','created_at',false)}catch(e){return fail(e)}let members=[];try{members=await q('club_members','id,customer_id,category,points_balance,active','created_at',false)}catch(e){return fail(e)}cache.members=members;$('content').innerHTML=`<section class="card"><h3>⭐ Ajuste manual de puntos</h3><label>Miembro</label><select id="pmember"><option value="">Selecciona un miembro</option>${members.map(m=>`<option value="${m.id}">${esc(m.category)} · ${m.points_balance} puntos · ${esc(m.id.slice(0,8))}</option>`).join('')}</select><div class="grid2"><div><label>Puntos a ajustar (+ / -)</label><input id="padjust" type="number" step="1"></div><div><label>Motivo</label><input id="pwhy" placeholder="Bonificación / corrección"></div></div><button class="btn" onclick="adjustPoints()">Aplicar ajuste</button><div class="small">Los ajustes quedan registrados como ADJUST. No se muestra ni se guarda aquí ningún monto de dinero gastado.</div></section><section class="card"><h3>Movimientos recientes</h3><div class="list">${tx.length?tx.slice(0,150).map(t=>`<div class="item"><b>${t.points>0?'+':''}${t.points} puntos</b> <span class="badge">${esc(t.transaction_type)}</span><div class="meta">${esc(t.description||'Sin descripción')}<br>${fmt(t.created_at)} · Miembro ${esc(String(t.member_id).slice(0,8))}</div></div>`).join(''):'<div class="empty">No hay movimientos.</div>'}</div></section>`}
async function adjustPoints(){const id=$('pmember').value,p=Number($('padjust').value),why=$('pwhy').value.trim();if(!id||!p)return msg('Selecciona un miembro y un ajuste distinto de 0.',true);const r=await db.rpc('club_adjust_points',{p_member_id:id,p_points:p,p_description:why||null});if(r.error)return msg(r.error.message,true);msg('Ajuste aplicado correctamente.');renderPoints()}

async function renderRedemptions(){let rows;try{rows=await q('club_redemptions','*','created_at',false)}catch(e){return fail(e)}let rewards=[],products=[];try{[rewards,products]=await Promise.all([q('club_rewards'),q('club_catalog_products')])}catch(e){}const names={};rewards.forEach(x=>names[x.id]='🎁 '+x.title);products.forEach(x=>names[x.id]='🧴 '+x.name);cache.red=rows;$('content').innerHTML=`<section class="card"><h3>🎟️ Canjes</h3><div class="list">${rows.length?rows.map(x=>`<div class="item"><div class="itemtop"><div><b>${esc(names[x.reward_id]||names[x.product_id]||'Premio')}</b> <span class="badge">${esc(x.status)}</span><div class="meta">Código de retiro: <b>${esc(x.pickup_code)}</b><br>⭐ Puntos utilizados: <b>${x.points_spent}</b><br>${fmt(x.created_at)}${x.picked_up_at?'<br>Entregado: '+fmt(x.picked_up_at):''}<br>Miembro: ${esc(x.member_id.slice(0,8))}</div></div><div class="actions"><select id="status-${x.id}" onchange="changeRedemption('${x.id}',this.value)"><option value="pending" ${x.status==='pending'?'selected':''}>Pendiente</option><option value="approved" ${x.status==='approved'?'selected':''}>Aprobado</option><option value="ready" ${x.status==='ready'?'selected':''}>Listo</option><option value="picked_up" ${x.status==='picked_up'?'selected':''}>Entregado</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>Cancelado</option></select></div></div></div>`).join(''):'<div class="empty">No hay canjes.</div>'}</div><div class="small">🔐 El historial muestra puntos usados y estado, nunca el monto de dinero gastado.</div></section>`}
async function changeRedemption(id,status){const r=await db.from('club_redemptions').update({status,picked_up_at:status==='picked_up'?new Date().toISOString():null}).eq('id',id);if(r.error)return msg(r.error.message,true);msg('Canje actualizado.');renderRedemptions()}

async function renderCustomers(){let c,m,v;try{[c,m,v]=await Promise.all([q('club_customers','id,full_name,phone,dni,birth_date,active,created_at','created_at',false),q('club_members','id,customer_id,category,points_balance,active','created_at',false),q('club_vehicles','id,customer_id,plate,brand,model,color,active','created_at',false)])}catch(e){return fail(e)}const byC={};m.forEach(x=>byC[x.customer_id]=x);const veh={};v.forEach(x=>(veh[x.customer_id]??=[]).push(x));$('content').innerHTML=`<section class="card"><h3>👥 Clientes del Club (${c.length})</h3><div class="list">${c.length?c.map(x=>{const mm=byC[x.id],vv=veh[x.id]||[];return `<div class="item"><div class="itemtop"><div><b>${esc(x.full_name)}</b> <span class="badge ${x.active?'green':'off'}">${x.active?'ACTIVO':'INACTIVO'}</span><div class="meta">📱 ${esc(x.phone)} · DNI: ${esc(x.dni||'-')}<br>👑 Categoría: <b>${esc(mm?.category||'Sin categoría')}</b> · ⭐ Puntos: <b>${mm?.points_balance??0}</b><br>🚗 ${vv.length?vv.map(z=>esc(z.plate)+(z.brand?' · '+esc(z.brand):'')).join(', '):'Sin vehículos registrados'}</div></div></div></div>`}).join(''):'<div class="empty">No hay clientes.</div>'}</div></section>`}

async function renderBenefits(){let rows;try{rows=await q('club_benefits','*','created_at',false)}catch(e){return fail(e)}cache.benefits=rows;$('content').innerHTML=`<section class="card"><h3>📢 Beneficio</h3><input type="hidden" id="bid"><label>Categoría</label><input id="bcat" placeholder="ORO"><label>Título</label><input id="btitle" placeholder="10% de descuento"><label>Descripción</label><textarea id="bdesc"></textarea><label>Imagen (ruta/URL)</label><input id="bimage"><div class="grid2"><div><label>Inicio</label><input id="bstart" type="datetime-local"></div><div><label>Vencimiento</label><input id="bexp" type="datetime-local"></div></div><label class="check"><input id="bactive" type="checkbox" checked> Beneficio activo</label><button class="btn" onclick="saveBenefit()">Guardar beneficio</button></section><section class="card"><h3>Beneficios registrados</h3><div class="list">${rows.length?rows.map(x=>`<div class="item"><div class="itemtop"><div><b>${esc(x.title)}</b> <span class="badge">${esc(x.category)}</span> <span class="badge ${x.active?'green':'off'}">${x.active?'ACTIVO':'INACTIVO'}</span><div class="meta">${esc(x.description||'')}<br>${fmt(x.starts_at)} → ${fmt(x.expires_at)}</div></div><div class="actions"><button class="btn alt" onclick="editBenefit('${x.id}')">Editar</button><button class="btn ${x.active?'red':'green'}" onclick="toggleBenefit('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button></div></div></div>`).join(''):'<div class="empty">No hay beneficios.</div>'}</div></section>`}
function editBenefit(id){const x=cache.benefits.find(a=>a.id===id);if(!x)return;$('bid').value=x.id;$('bcat').value=x.category||'';$('btitle').value=x.title||'';$('bdesc').value=x.description||'';$('bimage').value=x.image_path||'';$('bstart').value=x.starts_at?x.starts_at.slice(0,16):'';$('bexp').value=x.expires_at?x.expires_at.slice(0,16):'';$('bactive').checked=!!x.active;scrollTo(0,0)}
async function saveBenefit(){const id=$('bid').value,p={category:$('bcat').value.trim().toUpperCase(),title:$('btitle').value.trim(),description:$('bdesc').value.trim(),image_path:$('bimage').value.trim()||null,starts_at:$('bstart').value||null,expires_at:$('bexp').value||null,active:$('bactive').checked};if(!p.category||!p.title)return msg('Completa categoría y título.',true);const r=id?await db.from('club_benefits').update(p).eq('id',id):await db.from('club_benefits').insert(p);if(r.error)return msg(r.error.message,true);msg('Beneficio guardado.');renderBenefits()}
async function toggleBenefit(id,active){const r=await db.from('club_benefits').update({active}).eq('id',id);if(r.error)return msg(r.error.message,true);renderBenefits()}

async function renderNotifications(){let rows;try{rows=await q('club_notifications','*','created_at',false)}catch(e){return fail(e)}$('content').innerHTML=`<section class="card"><h3>🔔 Nueva notificación</h3><label>Tipo</label><select id="ntype"><option value="promotion">Promoción</option><option value="general">General</option><option value="reward">Premio</option><option value="points">Puntos</option></select><label>Categoría (vacío = todos)</label><input id="ncat" placeholder="ORO"><label>Título</label><input id="ntitle"><label>Mensaje</label><textarea id="nbody"></textarea><label>Programar (opcional)</label><input id="nscheduled" type="datetime-local"><button class="btn" onclick="saveNotification()">Guardar notificación</button></section><section class="card"><h3>Historial</h3><div class="list">${rows.length?rows.map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="badge">${esc(x.notification_type)}</span><div class="meta">${esc(x.body)}<br>Audiencia: ${esc(x.audience_category||'Todos')} · Programada: ${fmt(x.scheduled_at)} · Creada: ${fmt(x.created_at)}</div></div>`).join(''):'<div class="empty">No hay notificaciones.</div>'}</div></section>`}
async function saveNotification(){const p={notification_type:$('ntype').value,audience_category:$('ncat').value.trim().toUpperCase()||null,title:$('ntitle').value.trim(),body:$('nbody').value.trim(),scheduled_at:$('nscheduled').value||null};if(!p.title||!p.body)return msg('Completa título y mensaje.',true);const r=await db.from('club_notifications').insert(p);if(r.error)return msg(r.error.message,true);msg('Notificación guardada.');renderNotifications()}

async function renderStats(){try{const [c,m,r,t,b,n,p]=await Promise.all([q('club_customers','id,active'),q('club_members','id,active'),q('club_redemptions','id,status'),q('club_point_transactions','id,points,transaction_type'),q('club_benefits','id,active'),q('club_notifications','id'),q('club_catalog_products','id,active')]);const activeMembers=m.filter(x=>x.active).length,activeCustomers=c.filter(x=>x.active).length,earned=t.filter(x=>x.transaction_type==='EARN').reduce((a,x)=>a+Math.max(0,x.points),0),redeemed=t.filter(x=>x.transaction_type!=='EARN').reduce((a,x)=>a+Math.abs(x.points),0);$('content').innerHTML=`<div class="statgrid"><div class="stat"><b>${activeCustomers}</b><span>Clientes activos</span></div><div class="stat"><b>${activeMembers}</b><span>Miembros activos</span></div><div class="stat"><b>${earned}</b><span>Puntos otorgados</span></div><div class="stat"><b>${r.length}</b><span>Canjes registrados</span></div></div><section class="card"><h3>Resumen</h3><div class="meta">🎁 Premios/catálogos activos: ${p.filter(x=>x.active).length}<br>📢 Beneficios activos: ${b.filter(x=>x.active).length}<br>🔔 Notificaciones: ${n.length}<br>⭐ Puntos en movimientos no-EARN: ${redeemed}</div></section><div class="small">Las estadísticas del Club no muestran importes monetarios de clientes.</div>`}catch(e){fail(e)}}

async function renderConfig(){let cats=[],settings=[];try{[cats,settings]=await Promise.all([q('club_categories','*','sort_order',true),q('club_program_settings','*','key',true)])}catch(e){return fail(e)}$('content').innerHTML=`<section class="card"><h3>⚙️ Ajustes del programa</h3><p class="small">Los valores se guardan como configuración del Club. No pongas aquí contraseñas ni claves privadas.</p><label>Clave</label><input id="skey" placeholder="program_name"><label>Valor JSON</label><textarea id="svalue" placeholder='"Club HAL Garage"'></textarea><button class="btn" onclick="saveSetting()">Guardar ajuste</button></section><section class="card"><h3>Configuraciones guardadas</h3><div class="list">${settings.length?settings.map(x=>`<div class="item"><b>${esc(x.key)}</b><div class="meta">${esc(JSON.stringify(x.value))}<br>Actualizado: ${fmt(x.updated_at)}</div></div>`).join(''):'<div class="empty">No hay ajustes guardados.</div>'}</div></section><section class="card"><h3>👑 Categorías</h3><div class="meta">${cats.length?cats.map(x=>`${esc(x.sort_order)}. <b>${esc(x.name)}</b> · ${esc(x.rule_type)} · ${x.active?'Activa':'Inactiva'}`).join('<br>'):'Aún no hay categorías.'}</div><a class="btn" style="display:inline-block;margin-top:10px;text-decoration:none" href="./admin-modulos.html?module=categories">Editar categorías</a></section>`}
async function saveSetting(){const key=$('skey').value.trim();if(!key)return msg('Ingresa una clave.',true);let value;try{value=JSON.parse($('svalue').value||'null')}catch(e){return msg('El valor debe ser JSON válido.',true)}const r=await db.from('club_program_settings').upsert({key,value,updated_at:new Date().toISOString(),updated_by:currentUser.id});if(r.error)return msg(r.error.message,true);msg('Ajuste guardado.');renderConfig()}

async function fail(e){$('content').innerHTML=`<div class="empty">No se pudo cargar el módulo.<br><span class="small">${esc(e?.message||e)}</span></div>`}
async function render(){setup();currentUser=await auth();if(!need())return;try{if(moduleName==='rewards')await renderRewards();else if(moduleName==='categories')await renderCategories();else if(moduleName==='points')await renderPoints();else if(moduleName==='redemptions')await renderRedemptions();else if(moduleName==='customers')await renderCustomers();else if(moduleName==='benefits')await renderBenefits();else if(moduleName==='notifications')await renderNotifications();else if(moduleName==='stats')await renderStats();else await renderConfig()}catch(e){fail(e)}}
render();
</script></body></html>
