<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b67b2"><link rel="manifest" href="./manifest.json"><title>Club HAL Garage</title><style>:root{--blue:#0b67b2;--blue2:#1388df;--ink:#172433;--muted:#718096;--bg:#f4f7fa;--line:#e3eaf1;--gold:#d79b16;--shadow:0 10px 28px #17243314}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:88px}header{position:sticky;top:0;z-index:10;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 17px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:var(--blue)}.login{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:11px;padding:9px 11px;font-size:12px;font-weight:850}main{padding:18px 15px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700}.title{font-size:27px;font-weight:900;margin:2px 0 15px}.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}.hero .cat{font-size:13px;font-weight:800;opacity:.9}.points{font-size:38px;font-weight:950;margin:2px 0}.vehicle{margin-top:15px;background:#ffffff26;border-radius:13px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 5px 18px #1724330a}.card h3{margin:0 0 7px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.section{margin-top:22px}.section h2{font-size:19px;margin:0 0 10px}.reward,.product,.benefit,.notification{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#e9f4ff;color:var(--blue)}.pill.gold{background:#fff4d8;color:#956a00}.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;padding:11px 14px;width:100%;margin-top:10px}.btn.secondary{background:#eef5fa;color:var(--blue)}.big-number{text-align:center;font-size:45px;font-weight:950;color:var(--blue);margin:8px 0}.muted{color:var(--muted)}.center{text-align:center}.icon{font-size:27px}.price{font-weight:900;color:var(--blue)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:#778696;font-size:9px;font-weight:700}.nav button b{display:block;font-size:21px;line-height:23px}.nav button.active{color:var(--blue)}.modal{position:fixed;inset:0;background:#0814208c;display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;display:none;z-index:60;max-width:90%;text-align:center}</style></head><body><div class="app"><header><div class="brand">HAL <span>GARAGE</span><div style="font-size:10px;color:#718096;font-weight:700">CLUB</div></div><button class="login" onclick="location.href='./login.html'">🔐 Ingresar</button></header><main id="app"></main><nav class="nav"><button data-page="inicio" onclick="go('inicio')"><b>⌂</b>Inicio</button><button data-page="puntos" onclick="go('puntos')"><b>⭐</b>Mis puntos</button><button data-page="recompensas" onclick="go('recompensas')"><b>🎁</b>Recompensas</button><button data-page="canjes" onclick="go('canjes')"><b>🎟️</b>Canjes</button><button data-page="beneficios" onclick="go('beneficios')"><b>👑</b>Beneficios</button></nav></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div><script>
const U='https://maqnglazkhwtzskfddgc.supabase.co',K='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';let member={name:'',category:'BRONCE',points:0,plate:'—'};let rewards=[{icon:'🎁',title:'Recompensa especial',desc:'Cuando HAL Garage te asigne una cortesía, aparecerá aquí.',expires:'Disponible según asignación'}];const products=[['🧴','Silicona HAL Garage',120,true],['🌿','Ambientador premium',150,true],['🚗','Pisos para carro',700,true],['📓','Libreta HAL Garage',180,true],['🖊️','Lapicero HAL Garage',80,true],['🧢','Gorra HAL Garage',350,true],['👕','Polo HAL Garage',500,true],['🛞','Llantas',2500,true],['🛢️','Cambio de aceite',900,true]];const benefits={BRONCE:['Acumulación de puntos en tus servicios','Promociones especiales del Club'],PLATA:['Acumulación de puntos en tus servicios','Promociones especiales','Cortesías seleccionadas'],ORO:['Acumulación de puntos','Beneficios exclusivos ORO','Recompensas especiales','Promociones privadas'],VIP:['Todos los beneficios ORO','Recompensas VIP','Atención preferente','Promociones y experiencias exclusivas']};
async function get(path){const t=localStorage.getItem('club_access_token');if(!t)return null;const r=await fetch(U+path,{headers:{apikey:K,Authorization:'Bearer '+t}});if(!r.ok)throw Error('Sesión no disponible');return r.json()}async function loadProfile(){const cid=localStorage.getItem('club_customer_id');if(!cid)return;try{const c=(await get('/rest/v1/club_customers?select=id,full_name,active&id=eq.'+encodeURIComponent(cid)))?.[0];if(!c?.active){logout();return}const m=(await get('/rest/v1/club_members?select=category,points_balance&customer_id=eq.'+encodeURIComponent(cid)))?.[0];const v=await get('/rest/v1/club_vehicles?select=plate&customer_id=eq.'+encodeURIComponent(cid)+'&active=eq.true&order=created_at.asc&limit=1');if(c&&m){member={name:c.full_name?.split(' ')[0]||'Cliente',category:m.category||'BRONCE',points:Number(m.points_balance||0),plate:v?.[0]?.plate||'—'}}}catch(e){console.warn(e)}}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const f={inicio:home,puntos:points,recompensas,canjes,beneficios}[page]||home;f(document.getElementById('app'))}function home(a){a.innerHTML=`<div class="eyebrow">CLUB HAL GARAGE</div><div class="title">¡Hola, ${member.name}! 👋</div><section class="hero"><div class="cat">🥇 CATEGORÍA ${member.category}</div><div class="points">${member.points} <span style="font-size:16px">PUNTOS</span></div><div style="font-size:12px;opacity:.9">Sigue acumulando y disfruta tus beneficios.</div><div class="vehicle"><b>🚗 Tu vehículo</b><br><span style="font-size:20px;font-weight:900;letter-spacing:1px">${member.plate}</span></div></section><div class="grid"><div class="card center"><div class="icon">🎁</div><h3>Recompensas</h3><p>Tus cortesías aparecerán aquí.</p></div><div class="card center"><div class="icon">👑</div><h3>Tu categoría</h3><p>Beneficios especiales ${member.category}.</p></div></div><div class="section"><h2>✨ Para ti</h2><div class="notification"><b>🔥 Miércoles de puntos dobles</b><p class="muted">Este miércoles, tus servicios generan el doble de puntos.</p></div></div>`}function points(a){a.innerHTML=`<div class="eyebrow">MIS PUNTOS</div><div class="title">Tu saldo ⭐</div><div class="card center"><div class="big-number">${member.points}</div><b>PUNTOS ACUMULADOS</b><p class="muted">¡Felicitaciones, ${member.name}! 🎉</p><p class="muted">Sigue acumulando puntos y disfruta de beneficios exclusivos del Club HAL Garage.</p></div>`}function recompensas(a){a.innerHTML=`<div class="eyebrow">RECOMPENSAS</div><div class="title">Regalos para ti 🎁</div><p class="muted">Estas recompensas son otorgadas directamente por HAL Garage. No se descuentan de tus puntos.</p>${rewards.map((r,i)=>`<div class="reward"><div class="row"><div><div style="font-size:27px">${r.icon}</div><b>${r.title}</b></div><span class="pill">DISPONIBLE</span></div><p class="muted">${r.desc}</p><small class="muted">${r.expires}</small></div>`).join('')}`}function canjes(a){a.innerHTML=`<div class="eyebrow">CANJES</div><div class="title">Catálogo 🎟️</div><p class="muted">Canjea tus puntos por productos disponibles.</p>${products.map((p,i)=>`<div class="product"><div class="row"><div><div style="font-size:25px">${p[0]}</div><b>${p[1]}</b></div><span class="price">${p[2]} pts</span></div><p class="muted">${p[3]?'Disponible':'Agotado'}</p><button class="btn ${p[3]?'':'secondary'}" ${p[3]?'':'disabled'} onclick="redeem(${i})">Canjear</button></div>`).join('')}`}function beneficios(a){a.innerHTML=`<div class="eyebrow">BENEFICIOS</div><div class="title">Tus beneficios 👑</div><div class="card"><div class="row"><b>Categoría ${member.category}</b><span class="pill gold">ACTUAL</span></div><p class="muted" style="margin-top:8px">Estos son los beneficios correspondientes a tu categoría actual.</p></div><div class="section">${(benefits[member.category]||benefits.BRONCE).map(x=>`<div class="benefit"><span style="font-size:20px">✓</span> <b>${x}</b></div>`).join('')}</div>`}function redeem(i){const p=products[i];if(member.points<p[2]){toast('Aún no tienes suficientes puntos para este canje.');return}openModal(`<h2>¿Quieres canjear este producto?</h2><div class="card"><b>${p[0]} ${p[1]}</b><p class="muted">Costo: ${p[2]} puntos</p><p>Tu saldo: <b>${member.points} puntos</b></p><p>Después del canje: <b>${member.points-p[2]} puntos</b></p></div><button class="btn" onclick="confirmRedeem(${i})">Confirmar canje</button><button class="btn secondary" onclick="closeModal()">Cancelar</button>`)}function confirmRedeem(i){closeModal();toast('El canje quedará registrado cuando conectemos el catálogo real.')}function openModal(h){sheet.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',2800)}function logout(){localStorage.removeItem('club_access_token');localStorage.removeItem('club_refresh_token');localStorage.removeItem('club_customer_id');location.href='./login.html'}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});(async()=>{await loadProfile();go('inicio')})();
</script></body></html>
