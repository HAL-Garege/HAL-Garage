<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b67b2"><link rel="manifest" href="./manifest.json"><title>Club HAL Garage</title><style>:root{--blue:#0b67b2;--blue2:#1388df;--ink:#172433;--muted:#718096;--bg:#f4f7fa;--line:#e3eaf1;--gold:#d79b16;--shadow:0 10px 28px #17243314}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:88px}header{position:sticky;top:0;z-index:10;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 17px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:var(--blue)}.login{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:11px;padding:9px 11px;font-size:12px;font-weight:850}.login.logout{background:#edf4f9}main{padding:18px 15px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700}.title{font-size:27px;font-weight:900;margin:2px 0 15px}.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}.hero .cat{font-size:13px;font-weight:800;opacity:.9}.points{font-size:38px;font-weight:950;margin:2px 0}.vehicle{margin-top:15px;background:#ffffff26;border-radius:13px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 5px 18px #1724330a}.card h3{margin:0 0 7px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.section{margin-top:22px}.section h2{font-size:19px;margin:0 0 10px}.reward,.product,.benefit,.notification{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#e9f4ff;color:var(--blue)}.pill.gold{background:#fff4d8;color:#956a00}.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;padding:11px 14px;width:100%;margin-top:10px}.btn.secondary{background:#eef5fa;color:var(--blue)}.btn:disabled{opacity:.55}.big-number{text-align:center;font-size:45px;font-weight:950;color:var(--blue);margin:8px 0}.muted{color:var(--muted)}.center{text-align:center}.icon{font-size:27px}.price{font-weight:900;color:var(--blue)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:#778696;font-size:9px;font-weight:700}.nav button b{display:block;font-size:21px;line-height:23px}.nav button.active{color:var(--blue)}.modal{position:fixed;inset:0;background:#0814208c;display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;display:none;z-index:60;max-width:90%;text-align:center}.loading{text-align:center;padding:45px 10px;color:var(--muted)}</style></head><body><div class="app"><header><div class="brand">HAL <span>GARAGE</span><div style="font-size:10px;color:#718096;font-weight:700">CLUB</div></div><button class="login logout" onclick="logout()">Salir</button></header><main id="app"><div class="loading">Cargando tu Club…</div></main><nav class="nav"><button data-page="inicio" onclick="go('inicio')"><b>⌂</b>Inicio</button><button data-page="puntos" onclick="go('puntos')"><b>⭐</b>Mis puntos</button><button data-page="recompensas" onclick="go('recompensas')"><b>🎁</b>Recompensas</button><button data-page="canjes" onclick="go('canjes')"><b>🎟️</b>Canjes</button><button data-page="beneficios" onclick="go('beneficios')"><b>👑</b>Beneficios</button></nav></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div><script>
const U='https://maqnglazkhwtzskfddgc.supabase.co',K='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';let member={id:'',name:'Cliente',category:'BRONCE',points:0,vehicles:[],rewards:[],products:[],benefits:[],redemptions:[],notifications:[]};const app=document.getElementById('app'),modal=document.getElementById('modal'),sheet=document.getElementById('sheet');
function token(){return localStorage.getItem('club_access_token')||''}function authId(){try{return JSON.parse(atob(token().split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||''}catch{return ''}}async function api(path,opt={}){const t=token();if(!t)throw Error('Sesión no disponible');const r=await fetch(U+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+t,Accept:'application/json',...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.message||b.error||'No se pudo cargar la información');return b}
async function load(){if(!token()){location.href='./login.html';return}try{const cid=localStorage.getItem('club_customer_id');const c=(await api('/rest/v1/club_customers?select=id,full_name,active&id=eq.'+encodeURIComponent(cid)))?.[0];if(!c?.active)throw Error('Cuenta no disponible');const m=(await api('/rest/v1/club_members?select=id,category,points_balance&customer_id=eq.'+encodeURIComponent(cid)))?.[0];if(!m)throw Error('Membresía no disponible');const [v,r,p,b,n,rd]=await Promise.all([api('/rest/v1/club_vehicles?select=id,plate,brand,model,color&customer_id=eq.'+encodeURIComponent(cid)+'&active=eq.true&order=created_at.asc'),api('/rest/v1/club_member_rewards?select=id,status,assigned_at,expires_at,redeemed_at,reward:club_rewards(title,description,image_path,reward_type)&member_id=eq.'+encodeURIComponent(m.id)+'&order=assigned_at.desc'),api('/rest/v1/club_catalog_products?select=id,name,description,image_path,points_cost,stock,active&active=eq.true&order=created_at.asc'),api('/rest/v1/club_benefits?select=id,category,title,description,image_path,active,starts_at,expires_at&category=eq.'+encodeURIComponent(m.category)+'&active=eq.true&order=created_at.asc'),api('/rest/v1/club_notifications?select=id,title,body,notification_type,scheduled_at,sent_at,read_at,created_at&order=created_at.desc&limit=20'),api('/rest/v1/club_redemptions?select=id,product_id,points_spent,status,pickup_code,created_at,picked_up_at,product:club_catalog_products(name,description,image_path)&member_id=eq.'+encodeURIComponent(m.id)+'&order=created_at.desc')]);member={id:m.id,name:c.full_name?.split(' ')[0]||'Cliente',category:m.category||'BRONCE',points:Number(m.points_balance||0),vehicles:v||[],rewards:r||[],products:p||[],benefits:b||[],notifications:n||[],redemptions:rd||[]};go('inicio')}catch(e){console.error(e);app.innerHTML='<div class="card center"><h2>No pudimos cargar tu Club</h2><p class="muted">'+e.message+'</p><button class="btn" onclick="location.reload()">Intentar nuevamente</button><button class="btn secondary" onclick="logout()">Cerrar sesión</button></div>'}}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const f={inicio:home,puntos:points,recompensas,canjes,beneficios}[page]||home;f(app)}
function home(a){const plate=member.vehicles[0]?.plate||'—';a.innerHTML='<div class="eyebrow">CLUB HAL GARAGE</div><div class="title">¡Hola, '+esc(member.name)+'! 👋</div><section class="hero"><div class="cat">🥇 CATEGORÍA '+esc(member.category)+'</div><div class="points">'+member.points+' <span style="font-size:16px">PUNTOS</span></div><div style="font-size:12px;opacity:.9">Sigue acumulando y disfruta tus beneficios.</div><div class="vehicle"><b>🚗 Tu vehículo</b><br><span style="font-size:20px;font-weight:900;letter-spacing:1px">'+esc(plate)+'</span></div></section><div class="grid"><div class="card center"><div class="icon">🎁</div><h3>Recompensas</h3><p>'+member.rewards.filter(x=>x.status!=='REDEEMED').length+' recompensa(s) disponible(s).</p></div><div class="card center"><div class="icon">👑</div><h3>Tu categoría</h3><p>Beneficios especiales '+esc(member.category)+'.</p></div></div><div class="section"><h2>🔔 Novedades</h2>'+notificationHtml(3)+'</div>'}
function points(a){a.innerHTML='<div class="eyebrow">MIS PUNTOS</div><div class="title">Tu saldo ⭐</div><div class="card center"><div class="big-number">'+member.points+'</div><b>PUNTOS ACUMULADOS</b><p class="muted">¡Felicitaciones, '+esc(member.name)+'! 🎉</p><p class="muted">Sigue acumulando puntos y disfruta de beneficios exclusivos del Club HAL Garage.</p></div>'}
function recompensas(a){const rs=member.rewards.filter(r=>r.status!=='REDEEMED');a.innerHTML='<div class="eyebrow">RECOMPENSAS</div><div class="title">Regalos para ti 🎁</div><p class="muted">HAL Garage puede otorgarte estas recompensas directamente. No se descuentan de tus puntos.</p>'+(rs.length?rs.map(r=>'<div class="reward"><div class="row"><div><div style="font-size:27px">🎁</div><b>'+esc(r.reward?.title||'Recompensa especial')+'</b></div><span class="pill">DISPONIBLE</span></div><p class="muted">'+esc(r.reward?.description||'Cortesía especial para ti.')+'</p><small class="muted">'+(r.expires_at?'Vence: '+new Date(r.expires_at).toLocaleDateString('es-PE'):'Sin vencimiento indicado')+'</small></div>').join(''):'<div class="card center"><div class="icon">🎁</div><h3>Aún no tienes recompensas</h3><p class="muted">Cuando HAL Garage te asigne una cortesía, aparecerá aquí.</p></div>')}
function canjes(a){a.innerHTML='<div class="eyebrow">CANJES</div><div class="title">Catálogo 🎟️</div><p class="muted">Canjea tus puntos por productos disponibles.</p>'+(member.products.length?member.products.map(p=>'<div class="product"><div class="row"><div><div style="font-size:25px">🛍️</div><b>'+esc(p.name)+'</b></div><span class="price">'+p.points_cost+' pts</span></div><p class="muted">'+esc(p.description||'Producto HAL Garage')+'</p><p class="muted">'+(p.stock>0?'Disponible · '+p.stock+' unidad(es)':'Agotado')+'</p><button class="btn" '+(p.stock>0&&member.points>=p.points_cost?'':'disabled')+' onclick="redeem(\''+p.id+'\')">'+(p.stock>0?(member.points>=p.points_cost?'Canjear':'Necesitas más puntos'):'Agotado')+'</button></div>').join(''):'<div class="card center"><p class="muted">No hay productos disponibles en este momento.</p></div>')+'<div class="section"><h2>🎟️ Mis canjes</h2>'+redemptionHtml()+'</div>'}
function beneficios(a){const bs=member.benefits;a.innerHTML='<div class="eyebrow">BENEFICIOS</div><div class="title">Tus beneficios 👑</div><div class="card"><div class="row"><b>Categoría '+esc(member.category)+'</b><span class="pill gold">ACTUAL</span></div><p class="muted" style="margin-top:8px">Estos son los beneficios correspondientes a tu categoría actual.</p></div><div class="section">'+(bs.length?bs.map(x=>'<div class="benefit"><span style="font-size:20px">✓</span> <b>'+esc(x.title)+'</b><p class="muted">'+esc(x.description||'')+'</p></div>').join(''):'<div class="card center"><p class="muted">No hay beneficios publicados para tu categoría actualmente.</p></div>')+'</div><div class="section"><h2>🔔 Notificaciones</h2>'+notificationHtml(20)+'</div>'}
function notificationHtml(n){const xs=member.notifications.slice(0,n);return xs.length?xs.map(x=>'<div class="notification"><b>'+esc(x.title)+'</b><p class="muted">'+esc(x.body)+'</p><small class="muted">'+new Date(x.created_at).toLocaleDateString('es-PE')+'</small></div>').join(''):'<div class="card"><p class="muted">No tienes novedades por ahora.</p></div>'}
function redemptionHtml(){if(!member.redemptions.length)return '<div class="card"><p class="muted">Todavía no has realizado canjes.</p></div>';return member.redemptions.slice(0,10).map(r=>'<div class="reward"><div class="row"><b>'+esc(r.product?.name||'Producto')+'</b><span class="pill">'+statusLabel(r.status)+'</span></div><p class="muted">Código: <b>'+esc(r.pickup_code)+'</b></p><p class="muted">'+r.points_spent+' puntos · '+new Date(r.created_at).toLocaleDateString('es-PE')+'</p></div>').join('')}
function statusLabel(s){return ({PENDING_PICKUP:'PENDIENTE DE RECOJO',READY:'LISTO PARA RECOGER',DELIVERED:'ENTREGADO',CANCELLED:'CANCELADO'})[s]||s}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function redeem(id){const p=member.products.find(x=>x.id===id);if(!p)return;if(member.points<p.points_cost){toast('Aún no tienes suficientes puntos.');return}openModal('<h2>¿Quieres canjear este producto?</h2><div class="card"><b>🛍️ '+esc(p.name)+'</b><p class="muted">Costo: '+p.points_cost+' puntos</p><p>Tu saldo: <b>'+member.points+' puntos</b></p><p>Después del canje: <b>'+(member.points-p.points_cost)+' puntos</b></p></div><button class="btn" onclick="confirmRedeem(\''+id+'\')">Confirmar canje</button><button class="btn secondary" onclick="closeModal()">Cancelar</button>')}
async function confirmRedeem(id){const btn=sheet.querySelector('.btn');btn.disabled=true;btn.textContent='Procesando…';try{const r=await api('/rest/v1/rpc/club_redeem_product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_auth_user_id:authId(),p_product_id:id})});closeModal();toast('✅ Canje realizado. Código: '+r.pickup_code);await load()}catch(e){btn.disabled=false;btn.textContent='Confirmar canje';toast(e.message)}}
function openModal(h){sheet.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',3500)}function logout(){localStorage.removeItem('club_access_token');localStorage.removeItem('club_refresh_token');localStorage.removeItem('club_customer_id');location.href='./login.html'}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});load();
</script></body></html>
