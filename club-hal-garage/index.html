function token(){return localStorage.getItem('club_access_token')||''}function authId(){try{return JSON.parse(atob(token().split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||''}catch{return ''}}async function api(path,opt={}){const t=token();if(!t)throw Error('Sesión no disponible');const r=await fetch(U+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+t,Accept:'application/json',...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.message||b.error||'No se pudo cargar la información');return b}
async function load(){if(!token()){location.href='./login.html';return}try{const cid=localStorage.getItem('club_customer_id');const c=(await api('/rest/v1/club_customers?select=id,full_name,birth_date,active&id=eq.'+encodeURIComponent(cid)))?.[0];if(!c?.active)throw Error('Cuenta no disponible');const m=(await api('/rest/v1/club_members?select=id,category,points_balance&customer_id=eq.'+encodeURIComponent(cid)))?.[0];if(!m)throw Error('Membresía no disponible');const [v,r,p,b,n,rd,bu,tx,rc]=await Promise.all([api('/rest/v1/club_vehicles?select=id,plate,brand,model,color&customer_id=eq.'+encodeURIComponent(cid)+'&active=eq.true&order=created_at.asc'),api('/rest/v1/club_member_rewards?select=id,status,assigned_at,expires_at,redeemed_at,reward:club_rewards(title,description,image_path,reward_type)&member_id=eq.'+encodeURIComponent(m.id)+'&order=assigned_at.desc'),api('/rest/v1/club_catalog_products?select=id,name,description,image_path,points_cost,stock,active&active=eq.true&order=created_at.asc'),api('/rest/v1/club_benefits?select=id,category,title,description,image_path,active,starts_at,expires_at,usage_control&active=eq.true&order=created_at.asc'),api('/rest/v1/club_notifications?select=id,title,body,notification_type,scheduled_at,sent_at,read_at,created_at&active=eq.true&order=created_at.desc&limit=20'),api('/rest/v1/club_redemptions?select=id,product_id,points_spent,status,pickup_code,created_at,picked_up_at,product:club_catalog_products(name,description,image_path)&member_id=eq.'+encodeURIComponent(m.id)+'&order=created_at.desc'),api('/rest/v1/club_member_benefit_usage?select=benefit_id,usage_year,used_at&member_id=eq.'+encodeURIComponent(m.id)),api('/rest/v1/club_point_transactions?select=points,transaction_type&member_id=eq.'+encodeURIComponent(m.id)+'&transaction_type=in.(EARN,BONUS,REFERIDO)&points=gt.0'),api('/rest/v1/raspa_coupons?select=id,coupon_code,service_name,service_description,discount_percent,status,created_at,expires_at,redeemed_at&member_id=eq.'+encodeURIComponent(m.id)+'&order=created_at.desc')]);const lifetimePoints=(tx||[]).reduce((sum,t)=>sum+Number(t.points||0),0);member={id:m.id,name:c.full_name?.split(' ')[0]||'Cliente',birthDate:c.birth_date||null,category:m.category||'BRONCE',points:Number(m.points_balance||0),lifetimePoints,vehicles:v||[],rewards:r||[],products:p||[],benefits:b||[],notifications:n||[],redemptions:rd||[],benefitUsage:bu||[],coupons:rc||[]};go('inicio')}catch(e){console.error(e);app.innerHTML='<div class="card center"><h2>No pudimos cargar tu Club</h2><p class="muted">'+e.message+'</p><button class="btn" onclick="location.reload()">Intentar nuevamente</button><button class="btn secondary" onclick="logout()">Cerrar sesión</button></div>'}}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const f={inicio:home,puntos:points,recompensas,canjes,beneficios,sorteos,raspa}[page]||home;f(app)}
function tierProgressHtml(){const order=['BRONCE','PLATA','ORO','VIP'],thresholds={PLATA:201,ORO:401,VIP:601},idx=order.indexOf(String(member.category||'BRONCE').toUpperCase()),earned=Number(member.lifetimePoints||0);if(idx<0||idx===3)return '';const targets=order.slice(idx+1);return '<div class="section"><h2>🚀 Tus próximas metas</h2><p class="muted">Cada categoría se alcanza acumulando puntos. Tus puntos canjeados no reducen tu avance.</p>'+targets.map(cat=>{const left=Math.max(0,thresholds[cat]-earned),items=(member.benefits||[]).filter(b=>b.category===cat&&!/bienvenida|cumpleaños|referidos/i.test(b.title||''));return '<div class="benefit" style="border-left:4px solid '+(cat==='PLATA'?'#9aa8b5':cat==='ORO'?'#d79b16':'#7c68d8')+'"><div class="row"><b>👑 Próxima meta: '+cat+'</b><span class="pill">'+left+' pts</span></div><p style="margin:8px 0;color:var(--blue);font-weight:850">'+(left===0?'¡Meta alcanzada!':'¡Vamos, tú puedes! Te faltan '+left+' puntos para llegar a '+cat+'.')+'</p><b style="font-size:12px">Al llegar obtendrás:</b><ul style="margin:7px 0 0;padding-left:19px;font-size:12px;line-height:1.6">'+(items.length?items.map(b=>'<li><b>'+esc(b.title)+'</b>'+(b.description?' — '+esc(b.description):'')+'</li>').join(''):'<li>Beneficios por anunciar.</li>')+'</ul></div>'}).join('')+'</div>'}
function home(a){const plate=member.vehicles[0]?.plate||'—';a.innerHTML='<div class="eyebrow">CLUB HAL GARAGE</div><div class="title">¡Hola, '+esc(member.name)+'! 👋</div><section class="hero"><div class="cat">🥇 CATEGORÍA '+esc(member.category)+'</div><div class="points">'+member.points+' <span style="font-size:16px">PUNTOS</span></div><div style="font-size:12px;opacity:.9">Sigue acumulando y disfruta tus beneficios.</div><div class="vehicle"><b>🚗 Tu vehículo</b><br><span style="font-size:20px;font-weight:900;letter-spacing:1px">'+esc(plate)+'</span></div></section><div class="grid"><div class="card center"><div class="icon">🎁</div><h3>Recompensas</h3><p>'+member.rewards.filter(x=>x.status!=='REDEEMED').length+' recompensa(s) disponible(s).</p></div><div class="card center"><div class="icon">👑</div><h3>Tu categoría</h3><p>Beneficios especiales '+esc(member.category)+'.</p></div></div><div class="section"><div class="card"><div class="row"><h3>🎟️ Raspa y Gana HAL Garage</h3><span class="pill gold">PROMOCIÓN</span></div><p class="muted">Consulta tus descuentos y cupones obtenidos en la web.</p><button class="btn" onclick="go('raspa')">Ver mis cupones ('+member.coupons.length+')</button></div></div><div class="section"><h2>🔔 Novedades</h2>'+notificationHtml(3)+'</div><div class="section"><button class="btn secondary" onclick="showTerms()">📄 Términos y condiciones del Club HAL Garage</button><p class="muted center" style="font-size:11px;margin-top:7px">Consulta las reglas de participación y uso de tu membresía.</p></div>'}

function recompensas(a){const rs=member.rewards.filter(r=>r.status!=='REDEEMED');a.innerHTML='<div class="eyebrow">RECOMPENSAS</div><div class="title">Regalos para ti 🎁</div><p class="muted">HAL Garage puede otorgarte estas recompensas directamente. No se descuentan de tus puntos.</p>'+(rs.length?rs.map(r=>'<div class="reward"><div class="row"><div><div style="font-size:27px">🎁</div><b>'+esc(r.reward?.title||'Recompensa especial')+'</b></div><span class="pill">DISPONIBLE</span></div><p class="muted">'+esc(r.reward?.description||'Cortesía especial para ti.')+'</p><small class="muted">'+(r.expires_at?'Vence: '+new Date(r.expires_at).toLocaleDateString('es-PE'):'Sin vencimiento indicado')+'</small></div>').join(''):'<div class="card center"><div class="icon">🎁</div><h3>Aún no tienes recompensas</h3><p class="muted">Cuando HAL Garage te asigne una cortesía, aparecerá aquí.</p></div>')}
function canjes(a){a.innerHTML='<div class="eyebrow">CANJES</div><div class="title">Catálogo 🎟️</div><p class="muted">Canjea tus puntos por productos disponibles.</p>'+(member.products.length?member.products.map(p=>'<div class="product"><div class="row"><div><div style="font-size:25px">🛍️</div><b>'+esc(p.name)+'</b></div><span class="price">'+p.points_cost+' pts</span></div><p class="muted">'+esc(p.description||'Producto HAL Garage')+'</p><p class="muted">'+(p.stock>0?'Disponible · '+p.stock+' unidad(es)':'Agotado')+'</p><button class="btn" '+(p.stock>0&&member.points>=p.points_cost?'':'disabled')+' onclick="redeem(\''+p.id+'\')">'+(p.stock>0?(member.points>=p.points_cost?'Canjear':'Necesitas más puntos'):'Agotado')+'</button></div>').join(''):'<div class="card center"><p class="muted">No hay productos disponibles en este momento.</p></div>')+'<div class="section"><h2>🎟️ Mis canjes</h2>'+redemptionHtml()+'</div>'}
function beneficios(a){const now=new Date(),year=now.getFullYear(),month=now.getMonth()+1,birthMonth=member.birthDate?Number(String(member.birthDate).slice(5,7)):null,usage=member.benefitUsage||[],bs=member.benefits.filter(x=>{if(x.category!==member.category)return false;const isWelcome=/bienvenida/i.test(x.title),isBirthday=/cumpleaños/i.test(x.title);if(isWelcome)return !usage.some(u=>u.benefit_id===x.id);if(isBirthday)return birthMonth===month;return true}),usedFor=(id,annual)=>usage.find(u=>u.benefit_id===id&&Number(u.usage_year||0)===(annual?year:0));a.innerHTML='<div class="eyebrow">BENEFICIOS</div><div class="title">Tus beneficios 👑</div><div class="card"><div class="row"><b>Categoría '+esc(member.category)+'</b><span class="pill gold">ACTUAL</span></div><p class="muted" style="margin-top:8px">Estos son los beneficios correspondientes a tu categoría actual.</p></div><div class="section">'+(bs.length?bs.map(x=>{const annual=/cumpleaños/i.test(x.title),record=usedFor(x.id,annual),done=!!record;return '<div class="benefit"><div class="row" style="justify-content:space-between;align-items:center"><b>'+esc(x.title)+'</b>'+(x.usage_control?'<span class="pill '+(done?'used':'pending')+'">'+(done?'USADO':'PENDIENTE DE USO')+'</span>':'')+'</div><p class="muted">'+esc(x.description||'')+'</p>'+(x.usage_control&&done?'<small class="muted">Utilizado el '+new Date(record.used_at).toLocaleDateString('es-PE')+'</small>':'')+'</div>'}).join(''):'<div class="card center"><p class="muted">No hay beneficios publicados para tu categoría actualmente.</p></div>')+'</div><div class="section"><h2>🔔 Notificaciones</h2>'+notificationHtml(20)+'</div>'}
function raspa(a){const rows=member.coupons||[];a.innerHTML='<div class="eyebrow">RASPA Y GANA</div><div class="title">Mis cupones 🎟️</div><p class="muted">Aquí aparecen los descuentos que obtuviste al participar en Raspa y Gana desde la página web de HAL Garage.</p>'+(rows.length?rows.map(x=>'<div class="reward"><div class="row"><b>'+esc(x.service_name)+'</b><span class="pill '+(x.status==='AVAILABLE'?'pending':x.status==='REDEEMED'?'used':'')+'">'+(x.status==='AVAILABLE'?'DISPONIBLE':x.status==='REDEEMED'?'CANJEADO':esc(x.status))+'</span></div><div class="big-number">'+Number(x.discount_percent)+'% OFF</div><p class="muted">'+esc(x.service_description||'')+'</p><p><b>Código: '+esc(x.coupon_code)+'</b></p><small class="muted">Vence: '+new Date(x.expires_at).toLocaleDateString('es-PE')+'</small></div>').join(''):'<div class="card center"><div class="icon">🎁</div><h3>Aún no tienes cupones</h3><p class="muted">Participa en Raspa y Gana desde nuestra página web. Si ganas, el cupón aparecerá aquí cuando tus datos estén vinculados a tu membresía.</p><a class="btn" href="https://hal-garage.com/raspa-gana.html" target="_blank" rel="noopener" style="display:block;text-decoration:none">Participar en Raspa y Gana</a></div>')+'<p class="muted" style="font-size:11px">Los cupones son personales, tienen fecha de vencimiento y solo pueden canjearse una vez.</p>'}function sorteos(a){a.innerHTML='<div class="title">Sorteos HAL Garage 🎟️</div><p class="muted">Participa en cada campaña con tus puntos. Cada ticket te da una oportunidad de ganar; si hay varios puestos, se asignará un premio distinto a cada ganador.</p><div id="raffleList" class="loading">Cargando sorteos…</div>';api('/rest/v1/club_raffles?select=id,title,description,prize_name,prizes,image_url,starts_at,ends_at,draw_at,event_at,points_per_ticket,status&status=eq.ACTIVE').then(rows=>{document.getElementById('raffleList').innerHTML=rows.length?rows.map(r=>'<div class="product">'+(r.image_url?'<img src="'+esc(r.image_url)+'" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px">':'')+'<b>'+esc(r.title)+'</b><p class="muted">'+esc(r.description||'')+'</p><div style="margin:12px 0"><b>🏆 Premios por puesto</b><ol style="padding-left:22px;line-height:1.7">'+((r.prizes||[]).slice().sort((x,y)=>x.place-y.place).map(p=>'<li><b>'+esc(p.place)+'.º puesto:</b> '+esc(p.prize)+'</li>').join('')||'<li>'+esc(r.prize_name||'Premio por anunciar')+'</li>')+'</ol></div><p class="price">'+Number(r.points_per_ticket||10)+' puntos por ticket</p><p class="muted">Último día para canjear tickets: '+(r.ends_at?new Date(r.ends_at).toLocaleDateString('es-PE'):'Por anunciar')+'<br>Fecha del sorteo: '+(r.draw_at?new Date(r.draw_at).toLocaleDateString('es-PE'):'Por anunciar')+'<br>Fecha principal: '+(r.event_at?new Date(r.event_at).toLocaleDateString('es-PE'):'Por anunciar')+'</p><button class="btn" data-raffle="'+r.id+'" data-cost="'+Number(r.points_per_ticket||10)+'" onclick="redeemRaffle(this.dataset.raffle,Number(this.dataset.cost))">Comprar tickets</button></div>').join(''):'<div class="card">No hay sorteos disponibles por el momento.</div>'}).then(()=>api('/rest/v1/club_raffle_tickets?select=id,raffle_id,ticket_number,points_spent,created_at&member_id=eq.'+encodeURIComponent(member.id)+'&order=created_at.desc')).then(ts=>{const box=document.getElementById('raffleList');if(box)box.innerHTML+='<div class="section"><h2>🎫 Mis tickets</h2>'+(ts.length?ts.map(t=>'<div class="notification"><b>Ticket N.º '+t.ticket_number+'</b><p class="muted">'+t.points_spent+' puntos · '+new Date(t.created_at).toLocaleDateString('es-PE')+'</p></div>').join(''):'<div class="card">Todavía no tienes tickets canjeados.</div>')+'</div>'}).catch(e=>{const box=document.getElementById('raffleList');if(box)box.textContent=e.message})}function redeemRaffle(id,cost){const qty=prompt('¿Cuántos tickets deseas comprar? Cada ticket cuesta '+cost+' puntos. Tienes '+member.points+' puntos disponibles.');if(qty===null)return;const q=Number(qty);if(!Number.isInteger(q)||q<1)return;if(q*cost>member.points){toast('No tienes puntos suficientes para esa cantidad de tickets.');return}api('/rest/v1/rpc/club_redeem_raffle_tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_raffle_id:id,p_quantity:q})}).then(async out=>{const result=Array.isArray(out)?out[0]:out;toast('Tickets asignados: '+(result.ticket_numbers||[]).join(', '));await load()}).catch(e=>toast(e.message))}
function notificationHtml(n){const xs=member.notifications.slice(0,n);return xs.length?xs.map(x=>'<div class="notification"><b>'+esc(x.title)+'</b><p class="muted">'+esc(x.body)+'</p><small class="muted">'+new Date(x.created_at).toLocaleDateString('es-PE')+'</small></div>').join(''):'<div class="card"><p class="muted">No tienes novedades por ahora.</p></div>'}

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function redeem(id){const p=member.products.find(x=>x.id===id);if(!p)return;if(member.points<p.points_cost){toast('Aún no tienes suficientes puntos.');return}openModal('<h2>¿Quieres canjear este producto?</h2><div class="card"><b>🛍️ '+esc(p.name)+'</b><p class="muted">Costo: '+p.points_cost+' puntos</p><p>Tu saldo: <b>'+member.points+' puntos</b></p><p>Después del canje: <b>'+(member.points-p.points_cost)+' puntos</b></p></div><button class="btn" onclick="confirmRedeem(\''+id+'\')">Confirmar canje</button><button class="btn secondary" onclick="closeModal()">Cancelar</button>')}
async function confirmRedeem(id){const btn=sheet.querySelector('.btn');btn.disabled=true;btn.textContent='Procesando…';try{const r=await api('/rest/v1/rpc/club_redeem_product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_auth_user_id:authId(),p_product_id:id})});closeModal();toast('✅ Canje realizado. Código: '+r.pickup_code);await load()}catch(e){btn.disabled=false;btn.textContent='Confirmar canje';toast(e.message)}}
function showTerms(){openModal("<div class=\"row\" style=\"position:sticky;top:-20px;background:#fff;padding:4px 0 12px;z-index:2\"><h2 style=\"margin:0\">Términos y condiciones</h2><button class=\"login\" onclick=\"closeModal()\">Cerrar ✕</button></div>\n<p class=\"muted\" style=\"font-size:12px\">Club HAL Garage · Lee estas condiciones antes de utilizar los puntos, beneficios, recompensas y promociones.</p>\n<div style=\"font-size:13px;line-height:1.65\">\n<h3>1. Aceptación y alcance</h3><p>El Club HAL Garage es un programa de fidelización administrado por HAL Garage. Al registrarse, acceder o utilizar la aplicación, el cliente declara que ha leído y acepta estas condiciones. Estas reglas se aplican al registro, membresía, puntos, categorías, beneficios, recompensas, canjes, sorteos y demás funciones del Club. Cada campaña podrá tener condiciones particulares adicionales, que se mostrarán en la publicación correspondiente.</p>\n<h3>2. Registro y cuenta del cliente</h3><p>El registro debe realizarse con información verdadera, vigente y correspondiente al titular. El cliente es responsable de mantener actualizados sus datos y de proteger sus credenciales de acceso. La cuenta es personal; no debe compartirse, venderse ni utilizarse en nombre de otra persona. Si detecta accesos no autorizados, errores o datos incorrectos, debe comunicarlo a HAL Garage por sus canales oficiales. HAL Garage podrá solicitar información razonable para verificar la titularidad de la cuenta.</p>\n<h3>3. Datos personales y privacidad</h3><p>Los datos proporcionados y los datos generados por el uso del Club —por ejemplo, identificación y contacto, vehículos registrados, movimientos de puntos, canjes y participación en campañas— se utilizarán para administrar la membresía, prestar los servicios solicitados, gestionar beneficios y sorteos, atender consultas, prevenir usos indebidos y comunicar novedades relacionadas con el Club. El acceso a la información estará limitado a las personas que la necesiten para esas funciones y podrá compartirse con proveedores que apoyen la operación tecnológica, bajo las medidas correspondientes. El cliente puede solicitar información, actualización o atención de sus datos a HAL Garage mediante sus canales oficiales. No introduzcas en la aplicación datos de terceros sin autorización.</p>\n<h3>4. Acumulación y uso de puntos</h3><p>Los puntos son unidades promocionales del Club: no son dinero, no generan intereses, no pueden retirarse en efectivo ni transferirse o venderse a otros clientes. Se acreditan según las operaciones y promociones válidas que HAL Garage registre en el sistema. El saldo mostrado en la aplicación es el saldo disponible para utilizar. El cliente debe revisar sus movimientos y comunicar cualquier diferencia. HAL Garage podrá corregir registros duplicados, errores de cálculo, operaciones anuladas o puntos obtenidos mediante fraude, conservando la trazabilidad del ajuste. No se garantiza una cantidad fija de puntos por cada compra salvo que una promoción lo indique expresamente.</p>\n<h3>5. Categorías y progreso</h3><p>El Club contempla las categorías BRONCE, PLATA, ORO y VIP. Como referencia del programa, los objetivos de progreso son PLATA desde 201 puntos, ORO desde 401 puntos y VIP desde 601 puntos acumulados válidos. El avance se calcula con los movimientos elegibles que registra el sistema; los puntos utilizados en canjes no reducen ese avance. Los ajustes administrativos no cuentan como acumulación, salvo que HAL Garage indique lo contrario. La tarjeta de progreso es informativa y no sustituye la categoría vigente que figure en la cuenta. La asignación o corrección de categoría se realizará conforme a las reglas operativas del Club.</p>\n<h3>6. Beneficios y promociones</h3><p>Los beneficios dependen de la categoría, vigencia, disponibilidad y condiciones publicadas. Entre ellos pueden existir descuentos, servicios de cortesía, promociones de bienvenida, cumpleaños o referidos. Un beneficio sujeto a control de uso puede utilizarse solo las veces y dentro del periodo que indique su descripción. Los beneficios de bienvenida y cumpleaños, cuando estén habilitados, son personales y no canjeables por dinero. El beneficio de cumpleaños se aplica conforme a la fecha de nacimiento registrada y a las reglas de la promoción vigente. Los beneficios por referidos se acreditan únicamente cuando se cumplen las condiciones de la campaña y el sistema valida la operación elegible; no se permiten autorreferidos, registros ficticios ni duplicados. Los descuentos no se acumulan entre sí ni con otras promociones, salvo autorización expresa.</p>\n<h3>7. Recompensas asignadas por HAL Garage</h3><p>HAL Garage puede asignar recompensas o cortesías directamente a una cuenta. Estas recompensas se mostrarán en la sección Recompensas e indicarán, cuando corresponda, su fecha de vencimiento y condiciones. Una recompensa asignada no descuenta puntos, salvo que su descripción indique expresamente otra modalidad. Es personal, no transferible y no canjeable por efectivo. Para hacerla efectiva, el cliente deberá identificarse y coordinar su uso con HAL Garage dentro de la vigencia indicada. La disponibilidad está sujeta a las condiciones comunicadas al momento de la asignación.</p>\n<h3>8. Catálogo y canjes</h3><p>Los productos o servicios del catálogo muestran el costo en puntos y la disponibilidad registrada. El canje se confirma cuando la aplicación procesa correctamente la operación y genera el comprobante o código correspondiente. Antes de confirmar, el cliente debe revisar el producto, costo y saldo restante. Los puntos se descuentan al confirmarse el canje. El código de recojo debe presentarse para validar la entrega. La entrega se coordinará con HAL Garage y estará sujeta al stock, horario y condiciones informadas. Un canje confirmado no puede convertirse en efectivo ni cambiarse por otro producto, salvo error atribuible a HAL Garage o una solución acordada. Si la aplicación muestra un error, no repitas varias veces la operación: comunícate con HAL Garage para verificar el estado.</p>\n<h3>9. Sorteos y compra de tickets</h3><p>Los sorteos disponibles se mostrarán en la sección Sorteos. Cada campaña indicará sus premios, costo por ticket en puntos, fecha límite para adquirir tickets, fecha del sorteo y, si corresponde, fecha del evento o entrega. La participación se confirma cuando el sistema acepta la operación y asigna números de ticket. Tener más tickets representa más oportunidades, pero no garantiza ganar. Solo participan los tickets válidamente registrados antes del cierre de la campaña. Los puntos utilizados en tickets no se devuelven por decisión voluntaria del cliente; si existiera un cobro duplicado, error técnico o cancelación atribuible a HAL Garage, se revisará el caso y se aplicará la solución correspondiente. Los ganadores se determinarán mediante el procedimiento anunciado para cada campaña y serán contactados por los datos registrados. Para recibir el premio, deberán acreditar su identidad y cumplir el plazo y las instrucciones comunicadas. Si no responden o no reclaman dentro del plazo informado, HAL Garage podrá aplicar el procedimiento alternativo indicado en las condiciones de esa campaña. Los premios no son transferibles ni canjeables por dinero, salvo que la campaña indique expresamente lo contrario.</p>\n<h3>10. Uso correcto de la aplicación</h3><p>Está prohibido crear cuentas falsas o duplicadas, manipular operaciones, intentar alterar saldos, explotar errores, utilizar datos ajenos sin autorización o interferir con el funcionamiento de la aplicación. HAL Garage podrá revisar operaciones inusuales, suspender temporalmente funciones mientras verifica una incidencia y corregir movimientos fraudulentos o erróneos. Cuando sea posible, comunicará al cliente el motivo y el resultado de la revisión.</p>\n<h3>11. Disponibilidad y cambios del programa</h3><p>La aplicación puede presentar interrupciones por mantenimiento, conectividad o fallas técnicas. HAL Garage procurará restablecer el servicio y conservar los registros de operaciones confirmadas. HAL Garage podrá actualizar el catálogo, beneficios, campañas y estas condiciones por razones operativas o comerciales. Los cambios se publicarán en la aplicación o por los canales oficiales y no deberán alterar retroactivamente un canje o ticket ya confirmado, salvo corrección de error, fraude o exigencia legal. Las condiciones específicas anunciadas para una campaña complementan estas reglas generales.</p>\n<h3>12. Atención y consultas</h3><p>Para consultas sobre registro, datos, puntos, categorías, beneficios, recompensas, canjes o sorteos, el cliente debe comunicarse con HAL Garage mediante sus canales oficiales y facilitar la información necesaria para identificar la operación. Se recomienda conservar los comprobantes y códigos generados por la aplicación.</p>\n<h3>13. Aceptación final</h3><p>Al continuar utilizando el Club HAL Garage, el cliente reconoce que ha tenido la oportunidad de revisar estas condiciones. Si no está de acuerdo, puede dejar de utilizar las funciones del programa y solicitar orientación a HAL Garage sobre su cuenta y los movimientos pendientes.</p>\n<p class=\"muted\" style=\"font-size:11px;margin-top:18px\">Versión informativa del Club HAL Garage. Las condiciones particulares visibles en cada campaña también deben revisarse antes de participar.</p></div>\n<button class=\"btn\" onclick=\"closeModal()\">He leído los términos y condiciones</button>")}
function openModal(h){sheet.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',3500)}function logout(){localStorage.removeItem('club_access_token');localStorage.removeItem('club_refresh_token');localStorage.removeItem('club_customer_id');location.href='./login.html'}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});load();
</script></body></html>
