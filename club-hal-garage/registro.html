<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b67b2"><title>Registro | Club HAL Garage</title><style>:root{--b:#0b67b2;--b2:#1388df;--ink:#172433;--muted:#718096;--bg:#f4f7fa;--line:#e3eaf1;--red:#c43d4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.app{max-width:520px;min-height:100vh;margin:auto;padding:22px 17px 30px}.brand{text-align:center;font-size:25px;font-weight:950}.brand span{color:var(--b)}.club{text-align:center;color:var(--muted);font-size:11px;font-weight:800}.progress{display:flex;gap:8px;margin:24px 0}.step{height:6px;flex:1;border-radius:99px;background:#dfe7ee}.step.active{background:linear-gradient(90deg,var(--b),var(--b2))}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 32px rgba(23,36,51,.09)}h1{font-size:24px;margin:0 0 7px}p{color:var(--muted);font-size:13px;line-height:1.5;margin:7px 0 18px}label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin:13px 0 6px}input{width:100%;border:1px solid #d5e0e9;border-radius:12px;padding:13px;background:#fbfdff;color:var(--ink);font:inherit;outline:none}input:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(11,103,178,.1)}.plate{text-transform:uppercase;letter-spacing:2px;font-weight:900;text-align:center;font-size:22px}.otp{text-align:center;letter-spacing:8px;font-size:26px;font-weight:900}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:18px;background:var(--b);color:#fff;font-weight:850;font-size:14px}.btn.secondary{background:#edf4f9;color:var(--b)}.btn:disabled{opacity:.55}.check{display:flex;align-items:center;gap:10px;margin-top:16px;padding:13px;background:#f4f8fb;border:1px solid var(--line);border-radius:13px}.check input{width:19px;height:19px;margin:0}.error{color:var(--red);font-size:12px;margin-top:8px;display:none}.notice{background:#edf7ff;border:1px solid #cfe8fa;border-radius:13px;padding:12px;color:#245b80;font-size:12px;line-height:1.45;margin-top:12px}.success{text-align:center}.icon{font-size:54px}.vehicle{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:12px;background:#fbfdff}.vehicle b{font-size:12px;color:var(--muted)}.pv{font-size:20px;font-weight:950;letter-spacing:2px;margin-top:4px}.small{font-size:11px;color:var(--muted)}</style></head><body><div class="app"><div class="brand">HAL <span>GARAGE</span></div><div class="club">CLUB</div><div class="progress"><div class="step active" id="bar1"></div><div class="step" id="bar2"></div></div><div id="screen"></div></div><script>
const URL='https://maqnglazkhwtzskfddgc.supabase.co',KEY='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';const d={vehicles:[],token:'',user:'',customer:''};const screen=document.getElementById('screen');
async function api(path,opt={}){const h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(d.token)h.Authorization='Bearer '+d.token;const r=await fetch(URL+path,{...opt,headers:h});let x=null;try{x=await r.json()}catch(_){}if(!r.ok)throw Error(x?.msg||x?.message||x?.error_description||'Error de conexión');return x}
function err(id,m){const e=document.getElementById(id);e.textContent=m;e.style.display='block'}function prog(n){bar1.classList.toggle('active',n>=1);bar2.classList.toggle('active',n>=2)}function phone(v){let x=v.replace(/\D/g,'');if(x.startsWith('51')&&x.length===11)x=x.slice(2);return x.length===9&&x[0]==='9'?'+51'+x:''}function plate(v){return v.trim().toUpperCase().replace(/\s+/g,'')}
function start(){prog(1);screen.innerHTML=`<section class="card"><h1>¡Bienvenido al Club HAL Garage! 👋</h1><p>Regístrate para disfrutar de puntos, recompensas y beneficios exclusivos.</p><label>Nombre completo</label><input id="name" autocomplete="name" placeholder="Ej. Eduardo Lazo"><label>WhatsApp</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="987 654 321"><label>DNI</label><input id="dni" inputmode="numeric" maxlength="8" placeholder="8 dígitos"><label>Fecha de nacimiento</label><input id="birth" type="date"><div class="error" id="e1"></div><button class="btn" onclick="send()">Enviar código por WhatsApp →</button></section>`}
async function send(){const name=document.getElementById('name').value.trim(),p=document.getElementById('phone').value.trim(),dni=document.getElementById('dni').value.trim(),birth=document.getElementById('birth').value,e=phone(p);if(!name||!e||!/^[0-9]{8}$/.test(dni)||!birth){err('e1','Completa nombre, WhatsApp, DNI y fecha de nacimiento correctamente.');return}d.name=name;d.phone=p;d.e=e;d.dni=dni;d.birth=birth;const b=document.querySelector('.btn');b.disabled=true;b.textContent='Enviando a WhatsApp…';try{await api('/auth/v1/otp',{method:'POST',body:JSON.stringify({phone:e,channel:'whatsapp'})});otp()}catch(x){err('e1','No pudimos enviar el código por WhatsApp. '+x.message);console.error(x)}finally{b.disabled=false;b.textContent='Enviar código por WhatsApp →'}}
function otp(){prog(1);screen.innerHTML=`<section class="card"><h1>Verifica tu WhatsApp 📲</h1><p>Enviamos un código de 6 dígitos por WhatsApp al <b>${d.phone}</b>.</p><label>Código de verificación</label><input id="code" class="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"><div class="error" id="eo"></div><button class="btn" onclick="verify()">Verificar y continuar →</button><button class="btn secondary" onclick="start()">← Volver</button><div class="notice">El código llega por WhatsApp. No compartas este código con nadie.</div></section>`;code.focus()}
async function verify(){const c=code.value.trim();if(!/^[0-9]{6}$/.test(c)){err('eo','Ingresa el código de 6 dígitos.');return}const b=document.querySelector('.btn');b.disabled=true;b.textContent='Verificando…';try{const a=await api('/auth/v1/verify',{method:'POST',body:JSON.stringify({phone:d.e,token:c,type:'sms'})});if(!a?.access_token||!a?.user?.id)throw Error('No se pudo crear la sesión.');d.token=a.access_token;d.user=a.user.id;step2()}catch(x){err('eo','Código inválido o vencido. '+x.message);console.error(x)}finally{b.disabled=false;b.textContent='Verificar y continuar →'}}
function step2(){prog(2);screen.innerHTML=`<section class="card"><h1>Agrega tu vehículo 🚗</h1><p>Solo necesitamos la placa. Puedes registrar uno o dos vehículos.</p><label>Placa del vehículo</label><input id="p1" class="plate" maxlength="8" placeholder="ABC-123" oninput="this.value=this.value.toUpperCase()"><div class="check"><input id="has2" type="checkbox" onchange="second.innerHTML=this.checked?'<label>Segunda placa</label><input id=\'p2\' class=\'plate\' maxlength=\'8\' placeholder=\'DEF-456\' oninput=\'this.value=this.value.toUpperCase()\'>':''"><div><b>¿Tienes otro vehículo?</b><div class="small">Puedes agregar una segunda placa.</div></div></div><div id="second"></div><div class="error" id="e2"></div><button class="btn" onclick="finish()">Agregar vehículos y finalizar ✓</button><button class="btn secondary" onclick="otp()">← Volver</button></section>`}
async function finish(){const a=plate(p1.value),b=document.getElementById('has2').checked?plate(document.getElementById('p2')?.value||''):'';if(!a)return err('e2','Ingresa la placa de tu vehículo.');if(document.getElementById('has2').checked&&!b)return err('e2','Ingresa la segunda placa o desmarca la opción.');if(a===b)return err('e2','Las placas deben ser diferentes.');d.vehicles=[a,...(b?[b]:[])];const btn=document.querySelector('.btn');btn.disabled=true;btn.textContent='Guardando…';try{let q=await api('/rest/v1/club_customers?select=*&auth_user_id=eq.'+encodeURIComponent(d.user)+'&limit=1');let c;if(q.length)c=q[0];else{const z=await api('/rest/v1/club_customers',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({auth_user_id:d.user,full_name:d.name,phone:d.e,dni:d.dni,birth_date:d.birth})});c=z[0]}d.customer=c.id;for(const x of d.vehicles){try{await api('/rest/v1/club_vehicles',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:c.id,plate:x})})}catch(e){if(!/duplicate|unique/i.test(e.message))throw e}}success()}catch(e){err('e2','No pudimos completar el registro. '+e.message);console.error(e)}finally{btn.disabled=false;btn.textContent='Agregar vehículos y finalizar ✓'}}
function success(){screen.innerHTML=`<section class="card success"><div class="icon">🎉</div><h1>¡Registro completado!</h1><p>Bienvenido, <b>${d.name}</b>. Tu cuenta del Club HAL Garage está lista.</p>${d.vehicles.map((x,i)=>`<div class="vehicle"><b>VEHÍCULO ${i+1}</b><div class="pv">${x}</div></div>`).join('')}<p class="small">Tu membresía comienza en BRONCE con 0 puntos. HAL Garage podrá asignarte puntos, recompensas y beneficios.</p><button class="btn" onclick="location.href='./index.html'">Entrar al Club HAL Garage</button></section>`}start();
</script></body></html>
