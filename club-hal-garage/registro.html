<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b67b2"><title>Registro | Club HAL Garage</title><style>:root{--b:#0b67b2;--b2:#1388df;--i:#172433;--m:#718096;--bg:#f4f7fa;--l:#e3eaf1;--d:#c43d4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:22px 17px 30px}.brand{text-align:center;font-size:25px;font-weight:950}.brand span{color:var(--b)}.club{text-align:center;color:var(--m);font-size:11px;font-weight:800}.progress{display:flex;gap:8px;margin:24px 0}.step{height:6px;flex:1;border-radius:99px;background:#dfe7ee}.step.active{background:linear-gradient(90deg,var(--b),var(--b2))}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:22px;box-shadow:0 12px 32px #17243317}h1{font-size:25px;margin:0 0 7px}p{color:var(--m);font-size:13px;line-height:1.5;margin:7px 0 18px}label{display:block;color:var(--m);font-size:12px;font-weight:800;margin:13px 0 6px}input{width:100%;border:1px solid #d5e0e9;border-radius:12px;padding:13px;background:#fbfdff;color:var(--i);font:inherit;outline:0}input:focus{border-color:var(--b);box-shadow:0 0 0 3px #0b67b21a}.pin{text-align:center;letter-spacing:7px;font-size:23px;font-weight:900}.plate{text-transform:uppercase;letter-spacing:2px;font-weight:900;text-align:center;font-size:22px}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:18px;background:var(--b);color:#fff;font-weight:850;font-size:14px}.btn.secondary{background:#edf4f9;color:var(--b)}.btn:disabled{opacity:.55}.check{display:flex;align-items:center;gap:10px;margin-top:16px;padding:13px;background:#f4f8fb;border:1px solid var(--l);border-radius:13px}.check input{width:19px;height:19px;margin:0}.error{color:var(--d);font-size:12px;margin-top:9px;display:none}.notice{background:#edf7ff;border:1px solid #cfe8fa;border-radius:13px;padding:12px;color:#245b80;font-size:12px;line-height:1.45;margin-top:12px}.vehicle{border:1px solid var(--l);border-radius:14px;padding:13px;margin-top:12px;background:#fbfdff}.vehicle b{font-size:12px;color:var(--m)}.vehicle .pv{font-size:20px;font-weight:950;letter-spacing:2px;margin-top:4px}.success{text-align:center}.success .icon{font-size:54px}.small{font-size:11px;color:var(--m)}</style></head><body><div class="app"><div class="brand">HAL <span>GARAGE</span></div><div class="club">CLUB</div><div class="progress"><div class="step active" id="bar1"></div><div class="step" id="bar2"></div></div><div id="screen"></div></div><script>
const U='https://maqnglazkhwtzskfddgc.supabase.co',K='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_',F=U+'/functions/v1/club-auth';const d={name:'',phone:'',dni:'',birth:'',pin:'',vehicles:[],token:'',uid:'',cid:''},s=document.getElementById('screen');
const api=async(path,opt={})=>{const h={'apikey':K,'Content-Type':'application/json',...(opt.headers||{})};if(d.token)h.Authorization='Bearer '+d.token;const r=await fetch(U+path,{...opt,headers:h}),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.msg||b.message||b.error_description||b.error||'Error de conexión');return b};
const ferr=(id,m)=>{const e=document.getElementById(id);e.textContent=m;e.style.display='block'};const ph=v=>{let x=v.replace(/\D/g,'');if(x.startsWith('51')&&x.length===11)x=x.slice(2);return /^9\d{8}$/.test(x)?'+51'+x:''};const plate=v=>v.trim().toUpperCase().replace(/\s+/g,'');const prog=n=>{bar1.classList.toggle('active',n>=1);bar2.classList.toggle('active',n>=2)};
function step1(){prog(1);s.innerHTML=`<section class="card"><h1>¡Bienvenido al Club HAL Garage! 👋</h1><p>Regístrate en unos segundos para disfrutar de puntos, recompensas y beneficios exclusivos.</p><label>Nombre completo</label><input id="name" autocomplete="name" placeholder="Ej. Eduardo Lazo"><label>Teléfono / WhatsApp</label><input id="phone" type="tel" inputmode="tel" placeholder="987 654 321"><label>DNI</label><input id="dni" inputmode="numeric" maxlength="8" placeholder="8 dígitos"><label>Fecha de nacimiento</label><input id="birth" type="date"><label>Clave del Club</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><label>Repite tu clave</label><input id="pin2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><div class="notice">🔐 Tu clave de 6 dígitos te permitirá volver a ingresar al Club. No enviaremos SMS ni WhatsApp.</div><div class="error" id="err1"></div><button class="btn" onclick="cont()">Continuar →</button></section>`}
async function cont(){const n=name.value.trim(),p=ph(phone.value),di=dni.value.trim(),b=birth.value,x=pin.value,y=pin2.value;if(!n||!p||!/^[0-9]{8}$/.test(di)||!b||!/^[0-9]{6}$/.test(x)||x!==y){ferr('err1','Completa los datos y usa una clave de 6 dígitos igual en ambos campos.');return}Object.assign(d,{name:n,phone:p,dni:di,birth:b,pin:x});const btn=document.querySelector('.btn');btn.disabled=true;btn.textContent='Preparando tu cuenta…';try{const a=await api('/auth/v1/signup',{method:'POST',body:'{}'});if(!a?.access_token||!a?.user?.id)throw Error('No se pudo crear la cuenta');d.token=a.access_token;d.uid=a.user.id;step2()}catch(e){ferr('err1','No pudimos iniciar tu cuenta. Verifica que Anonymous Sign-Ins esté activado en Supabase.')}finally{btn.disabled=false;btn.textContent='Continuar →'}}
function step2(){prog(2);s.innerHTML=`<section class="card"><h1>Agrega tu vehículo 🚗</h1><p>Solo necesitamos la placa. Puedes registrar uno o dos vehículos.</p><label>Placa del vehículo</label><input id="plate1" class="plate" maxlength="8" placeholder="ABC-123" oninput="this.value=this.value.toUpperCase()"><div class="check"><input id="has2" type="checkbox" onchange="toggle2()"><div><b>¿Tienes otro vehículo?</b><div class="small">Marca esta opción para agregar una segunda placa.</div></div></div><div id="second"></div><div class="error" id="err2"></div><button class="btn" onclick="finish()">Agregar vehículos y finalizar ✓</button><button class="btn secondary" onclick="step1()">← Volver</button></section>`}
function toggle2(){second.innerHTML=has2.checked?`<label>Segunda placa</label><input id="plate2" class="plate" maxlength="8" placeholder="DEF-456" oninput="this.value=this.value.toUpperCase()">`:''}
async function finish(){const p1=plate(plate1.value),p2=has2.checked?plate(plate2.value):'';if(!p1||has2.checked&&!p2||p1===p2&&p2){ferr('err2','Revisa las placas. Debes ingresar una placa y, si agregas otra, debe ser diferente.');return}d.vehicles=[p1,...(p2?[p2]:[])];const btn=document.querySelector('.btn');btn.disabled=true;btn.textContent='Guardando registro…';try{let c;const ex=await api('/rest/v1/club_customers?select=*&auth_user_id=eq.'+encodeURIComponent(d.uid)+'&limit=1');if(ex.length)c=ex[0];else{const cr=await api('/rest/v1/club_customers',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({auth_user_id:d.uid,full_name:d.name,phone:d.phone,dni:d.dni,birth_date:d.birth})});c=cr[0]}d.cid=c.id;const auth=await fetch(F,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+d.token},body:JSON.stringify({action:'set_pin',customer_id:c.id,phone:d.phone,dni:d.dni,pin:d.pin})}),ab=await auth.json().catch(()=>({}));if(!auth.ok||!ab.ok)throw Error(ab.error||'No se pudo crear la clave');if(ab.access_token)d.token=ab.access_token;d.uid=ab.user_id||d.uid;for(const q of d.vehicles){try{await api('/rest/v1/club_vehicles',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:c.id,plate:q})})}catch(e){if(!/duplicate|unique/i.test(e.message))throw e}}success()}catch(e){ferr('err2','No pudimos completar el registro. '+e.message)}finally{btn.disabled=false;btn.textContent='Agregar vehículos y finalizar ✓'}}
function success(){s.innerHTML=`<section class="card success"><div class="icon">🎉</div><h1>¡Registro completado!</h1><p>Bienvenido, <b>${d.name}</b>. Tu cuenta ya tiene una clave de acceso.</p>${d.vehicles.map((q,i)=>`<div class="vehicle"><b>VEHÍCULO ${i+1}</b><div class="pv">${q}</div></div>`).join('')}<p class="small">Tu membresía empieza en categoría BRONCE con 0 puntos. HAL Garage podrá asignarte puntos, recompensas y beneficios desde el sistema.</p><button class="btn" onclick="location.href='./index.html'">Entrar al Club HAL Garage</button></section>`}step1();</script></body></html>
