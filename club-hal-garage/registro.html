<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b67b2"><title>Registro | Club HAL Garage</title><style>:root{--b:#0b67b2;--b2:#1388df;--i:#172433;--m:#718096;--bg:#f4f7fa;--l:#e3eaf1;--d:#c43d4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:22px 17px 30px}.brand{text-align:center;font-size:25px;font-weight:950}.brand span{color:var(--b)}.club{text-align:center;color:var(--m);font-size:11px;font-weight:800}.progress{display:flex;gap:8px;margin:24px 0}.step{height:6px;flex:1;border-radius:99px;background:#dfe7ee}.step.active{background:linear-gradient(90deg,var(--b),var(--b2))}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:22px;box-shadow:0 12px 32px #17243317}h1{font-size:25px;margin:0 0 7px}p{color:var(--m);font-size:13px;line-height:1.5;margin:7px 0 18px}label{display:block;color:var(--m);font-size:12px;font-weight:800;margin:13px 0 6px}input{width:100%;border:1px solid #d5e0e9;border-radius:12px;padding:13px;background:#fbfdff;color:var(--i);font:inherit;outline:0}input:focus{border-color:var(--b);box-shadow:0 0 0 3px #0b67b21a}.pin{text-align:center;letter-spacing:7px;font-size:23px;font-weight:900}.plate{text-transform:uppercase;letter-spacing:2px;font-weight:900;text-align:center;font-size:22px}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:18px;background:var(--b);color:#fff;font-weight:850;font-size:14px}.btn.secondary{background:#edf4f9;color:var(--b)}.btn:disabled{opacity:.55}.check{display:flex;align-items:center;gap:10px;margin-top:16px;padding:13px;background:#f4f8fb;border:1px solid var(--l);border-radius:13px}.check input{width:19px;height:19px;margin:0}.error{color:var(--d);font-size:12px;margin-top:9px;display:none}.notice{background:#edf7ff;border:1px solid #cfe8fa;border-radius:13px;padding:12px;color:#245b80;font-size:12px;line-height:1.45;margin-top:12px}.vehicle{border:1px solid var(--l);border-radius:14px;padding:13px;margin-top:12px;background:#fbfdff}.vehicle b{font-size:12px;color:var(--m)}.vehicle .pv{font-size:20px;font-weight:950;letter-spacing:2px;margin-top:4px}.success{text-align:center}.success .icon{font-size:54px}.small{font-size:11px;color:var(--m)}</style></head><body><div class="app"><div class="brand">HAL <span>GARAGE</span></div><div class="club">CLUB</div><div class="progress"><div class="step active" id="bar1"></div><div class="step" id="bar2"></div></div><div id="screen"></div></div><script>
const U='https://maqnglazkhwtzskfddgc.supabase.co',K='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_',F=U+'/functions/v1/club-auth';
const d={name:'',phone:'',dni:'',birth:'',pin:'',vehicles:[]},s=document.getElementById('screen');
const el=id=>document.getElementById(id);const ferr=(id,m)=>{const e=el(id);e.textContent=m;e.style.display='block'};const ph=v=>{let x=String(v||'').replace(/\D/g,'');if(x.startsWith('51')&&x.length===11)x=x.slice(2);return /^9\d{8}$/.test(x)?'+51'+x:''};const plate=v=>String(v||'').trim().toUpperCase().replace(/\s+/g,'');const prog=n=>{el('bar1').classList.toggle('active',n>=1);el('bar2').classList.toggle('active',n>=2)};
async function callRegister(){const r=await fetch(F,{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({action:'register',name:d.name,phone:d.phone,dni:d.dni,birth_date:d.birth,pin:d.pin,vehicles:d.vehicles})});const b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw Error(b.error||'No pudimos completar el registro');return b}
function step1(){prog(1);s.innerHTML=`<section class="card"><h1>¡Bienvenido al Club HAL Garage! 👋</h1><p>Regístrate en unos segundos para disfrutar de puntos, recompensas y beneficios exclusivos.</p><label>Nombre completo</label><input id="name" autocomplete="name" placeholder="Ej. Eduardo Lazo"><label>Teléfono / WhatsApp</label><input id="phone" type="tel" inputmode="tel" placeholder="987 654 321"><label>DNI</label><input id="dni" inputmode="numeric" maxlength="8" placeholder="8 dígitos"><label>Fecha de nacimiento</label><input id="birth" type="date"><label>Clave del Club</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><label>Repite tu clave</label><input id="pin2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><div class="notice">🔐 Esta clave será tu forma de ingresar nuevamente al Club. No enviaremos SMS ni WhatsApp.</div><div class="error" id="err1"></div><button type="button" class="btn" id="continueBtn">Continuar →</button></section>`;el('continueBtn').addEventListener('click',cont)}
function cont(){const n=el('name').value.trim(),p=ph(el('phone').value),di=el('dni').value.trim(),b=el('birth').value,x=el('pin').value,y=el('pin2').value;if(!n||!p||!/^[0-9]{8}$/.test(di)||!b||!/^[0-9]{6}$/.test(x)||x!==y){ferr('err1','Completa los datos y usa una clave de 6 dígitos igual en ambos campos.');return}Object.assign(d,{name:n,phone:p,dni:di,birth:b,pin:x});step2()}
function step2(){prog(2);s.innerHTML=`<section class="card"><h1>Agrega tu vehículo 🚗</h1><p>Solo necesitamos la placa. Puedes registrar uno o dos vehículos.</p><label>Placa del vehículo</label><input id="plate1" class="plate" maxlength="8" placeholder="ABC-123" oninput="this.value=this.value.toUpperCase()"><div class="check"><input id="has2" type="checkbox"><div><b>¿Tienes otro vehículo?</b><div class="small">Marca esta opción para agregar una segunda placa.</div></div></div><div id="second"></div><div class="notice">✨ Tu cuenta y tu membresía se crearán de forma segura al finalizar este paso.</div><div class="error" id="err2"></div><button type="button" class="btn" id="finishBtn">Crear mi cuenta ✓</button><button type="button" class="btn secondary" id="backBtn">← Volver</button></section>`;el('has2').addEventListener('change',toggle2);el('finishBtn').addEventListener('click',finish);el('backBtn').addEventListener('click',step1)}
function toggle2(){el('second').innerHTML=el('has2').checked?`<label>Segunda placa</label><input id="plate2" class="plate" maxlength="8" placeholder="DEF-456" oninput="this.value=this.value.toUpperCase()">`:''}
async function finish(){const p1=plate(el('plate1').value),p2=el('has2').checked?plate(el('plate2').value):'';if(!p1||el('has2').checked&&!p2||p1===p2&&p2){ferr('err2','Revisa las placas. Debes ingresar una placa y, si agregas otra, debe ser diferente.');return}d.vehicles=[p1,...(p2?[p2]:[])];const btn=el('finishBtn');btn.disabled=true;btn.textContent='Creando tu cuenta…';try{const b=await callRegister();localStorage.setItem('club_access_token',b.access_token);localStorage.setItem('club_refresh_token',b.refresh_token);localStorage.setItem('club_customer_id',b.customer_id);d.name=b.name||d.name;success()}catch(e){console.error(e);ferr('err2',e.message)}finally{btn.disabled=false;btn.textContent='Crear mi cuenta ✓'}}
function success(){s.innerHTML=`<section class="card success"><div class="icon">🎉</div><h1>¡Registro completado!</h1><p>Bienvenido, <b>${d.name}</b>. Tu cuenta ya está lista y puedes volver a ingresar con tu teléfono y tu clave.</p>${d.vehicles.map((q,i)=>`<div class="vehicle"><b>VEHÍCULO ${i+1}</b><div class="pv">${q}</div></div>`).join('')}<p class="small">Tu membresía empieza en categoría BRONCE con 0 puntos. HAL Garage podrá asignarte puntos, recompensas y beneficios desde el Club.</p><button type="button" class="btn" onclick="location.href='./index.html'">Entrar al Club HAL Garage</button></section>`}step1();</script></body></html>
