<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b67b2">
<title>Registro | Club HAL Garage</title>
<style>
:root{--blue:#0b67b2;--blue2:#1388df;--ink:#172433;--muted:#718096;--bg:#f4f7fa;--card:#fff;--line:#e3eaf1;--danger:#c43d4b;--shadow:0 12px 32px rgba(23,36,51,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:22px 17px 30px}.brand{text-align:center;font-size:25px;font-weight:950;letter-spacing:-.7px}.brand span{color:var(--blue)}.club{text-align:center;color:var(--muted);font-size:11px;font-weight:800;margin-top:-2px}.progress{display:flex;gap:8px;margin:24px 0}.step{height:6px;flex:1;border-radius:99px;background:#dfe7ee}.step.active{background:linear-gradient(90deg,var(--blue),var(--blue2))}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}h1{font-size:25px;margin:0 0 7px}p{color:var(--muted);font-size:13px;line-height:1.5;margin:7px 0 18px}label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin:13px 0 6px}input{width:100%;border:1px solid #d5e0e9;border-radius:12px;padding:13px;background:#fbfdff;color:var(--ink);font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,103,178,.10)}.plate{text-transform:uppercase;letter-spacing:2px;font-weight:900;text-align:center;font-size:22px}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:18px;background:var(--blue);color:#fff;font-weight:850;font-size:14px}.btn.secondary{background:#edf4f9;color:var(--blue)}.check{display:flex;align-items:center;gap:10px;margin-top:16px;padding:13px;background:#f4f8fb;border:1px solid var(--line);border-radius:13px}.check input{width:19px;height:19px;margin:0}.vehicle{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:12px;background:#fbfdff}.vehicle b{font-size:12px;color:var(--muted)}.vehicle .plateview{font-size:20px;font-weight:950;letter-spacing:2px;margin-top:4px}.success{text-align:center}.success .icon{font-size:54px}.small{font-size:11px;color:var(--muted)}.error{color:var(--danger);font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body><div class="app">
<div class="brand">HAL <span>GARAGE</span></div><div class="club">CLUB</div>
<div class="progress"><div class="step active" id="bar1"></div><div class="step" id="bar2"></div></div>
<div id="screen"></div>
</div>
<script>
const data={name:'',phone:'',dni:'',birthDate:'',vehicles:[]};
const screen=document.getElementById('screen');
function step1(){document.getElementById('bar1').classList.add('active');document.getElementById('bar2').classList.remove('active');screen.innerHTML=`<section class="card"><h1>¡Bienvenido al Club HAL Garage! 👋</h1><p>Regístrate para comenzar a disfrutar de puntos, recompensas y beneficios exclusivos.</p><label>Nombre completo</label><input id="name" type="text" autocomplete="name" placeholder="Ej. Eduardo Lazo"><label>Teléfono</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej. 987 654 321"><label>DNI</label><input id="dni" type="text" inputmode="numeric" maxlength="8" placeholder="8 dígitos"><label>Fecha de nacimiento</label><input id="birth" type="date"><div class="error" id="err1"></div><button class="btn" onclick="nextStep()">Continuar →</button></section>`}
function nextStep(){const name=document.getElementById('name').value.trim();const phone=document.getElementById('phone').value.trim();const dni=document.getElementById('dni').value.trim();const birth=document.getElementById('birth').value;const err=document.getElementById('err1');if(!name||!phone||dni.length!==8||!/^\d{8}$/.test(dni)||!birth){err.textContent='Completa todos los datos correctamente. El DNI debe tener 8 dígitos.';err.style.display='block';return}Object.assign(data,{name,phone,dni,birthDate:birth});step2()}
function step2(){document.getElementById('bar1').classList.add('active');document.getElementById('bar2').classList.add('active');screen.innerHTML=`<section class="card"><h1>Agrega tu vehículo 🚗</h1><p>Solo necesitamos la placa. Puedes registrar uno o dos vehículos.</p><label>Placa del vehículo</label><input id="plate1" class="plate" maxlength="8" type="text" autocomplete="off" placeholder="ABC-123" oninput="this.value=this.value.toUpperCase()"><div class="check"><input id="has2" type="checkbox" onchange="toggleSecond()"><div><b>¿Tienes otro vehículo?</b><div class="small">Marca esta opción para agregar una segunda placa.</div></div></div><div id="second"></div><div class="error" id="err2"></div><button class="btn" onclick="finishRegistration()">Agregar vehículos y finalizar ✓</button><button class="btn secondary" onclick="step1()">← Volver</button></section>`}
function toggleSecond(){document.getElementById('second').innerHTML=document.getElementById('has2').checked?`<label>Segunda placa</label><input id="plate2" class="plate" maxlength="8" type="text" placeholder="DEF-456" oninput="this.value=this.value.toUpperCase()">`:''}
function normalizePlate(v){return v.trim().toUpperCase().replace(/\s+/g,'')}
function finishRegistration(){const p1=normalizePlate(document.getElementById('plate1').value);const p2=document.getElementById('has2').checked?normalizePlate(document.getElementById('plate2').value):'';const err=document.getElementById('err2');if(!p1){err.textContent='Ingresa la placa de tu vehículo.';err.style.display='block';return}if(document.getElementById('has2').checked&&!p2){err.textContent='Ingresa la segunda placa o desmarca la opción.';err.style.display='block';return}if(p2&&p1===p2){err.textContent='Las placas deben ser diferentes.';err.style.display='block';return}data.vehicles=[p1,...(p2?[p2]:[])];localStorage.setItem('club_hal_registration',JSON.stringify(data));showSuccess()}
function showSuccess(){screen.innerHTML=`<section class="card success"><div class="icon">🎉</div><h1>¡Registro completado!</h1><p>Bienvenido, <b>${data.name}</b>. Tus vehículos quedaron registrados en el Club HAL Garage.</p>${data.vehicles.map((p,i)=>`<div class="vehicle"><b>VEHÍCULO ${i+1}</b><div class="plateview">${p}</div></div>`).join('')}<p class="small">En el siguiente paso conectaremos este registro con la cuenta segura del Club y tu perfil de puntos.</p><button class="btn" onclick="location.href='./index.html'">Entrar al Club HAL Garage</button></section>`}
step1();
</script></body></html>
