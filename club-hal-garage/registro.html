<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b67b2">
<title>Registro | Club HAL Garage</title>
<style>
:root{--blue:#0b67b2;--blue2:#1388df;--ink:#172433;--muted:#718096;--bg:#f4f7fa;--card:#fff;--line:#e3eaf1;--danger:#c43d4b;--shadow:0 12px 32px rgba(23,36,51,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:22px 17px 30px}.brand{text-align:center;font-size:25px;font-weight:950;letter-spacing:-.7px}.brand span{color:var(--blue)}.club{text-align:center;color:var(--muted);font-size:11px;font-weight:800;margin-top:-2px}.progress{display:flex;gap:8px;margin:24px 0}.step{height:6px;flex:1;border-radius:99px;background:#dfe7ee}.step.active{background:linear-gradient(90deg,var(--blue),var(--blue2))}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}h1{font-size:25px;margin:0 0 7px}p{color:var(--muted);font-size:13px;line-height:1.5;margin:7px 0 18px}label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin:13px 0 6px}input{width:100%;border:1px solid #d5e0e9;border-radius:12px;padding:13px;background:#fbfdff;color:var(--ink);font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,103,178,.10)}.plate{text-transform:uppercase;letter-spacing:2px;font-weight:900;text-align:center;font-size:22px}.otp{text-align:center;letter-spacing:8px;font-size:26px;font-weight:900}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:18px;background:var(--blue);color:#fff;font-weight:850;font-size:14px}.btn.secondary{background:#edf4f9;color:var(--blue)}.btn:disabled{opacity:.55}.check{display:flex;align-items:center;gap:10px;margin-top:16px;padding:13px;background:#f4f8fb;border:1px solid var(--line);border-radius:13px}.check input{width:19px;height:19px;margin:0}.vehicle{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:12px;background:#fbfdff}.vehicle b{font-size:12px;color:var(--muted)}.vehicle .plateview{font-size:20px;font-weight:950;letter-spacing:2px;margin-top:4px}.success{text-align:center}.success .icon{font-size:54px}.small{font-size:11px;color:var(--muted)}.error{color:var(--danger);font-size:12px;margin-top:8px;display:none}.notice{background:#edf7ff;border:1px solid #cfe8fa;border-radius:13px;padding:12px;color:#245b80;font-size:12px;line-height:1.45;margin-top:12px}
</style>
</head>
<body><div class="app">
<div class="brand">HAL <span>GARAGE</span></div><div class="club">CLUB</div>
<div class="progress"><div class="step active" id="bar1"></div><div class="step" id="bar2"></div></div>
<div id="screen"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://maqnglazkhwtzskfddgc.supabase.co';
const SUPABASE_KEY='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const data={name:'',phone:'',phoneE164:'',dni:'',birthDate:'',vehicles:[]};
const screen=document.getElementById('screen');
function setProgress(n){document.getElementById('bar1').classList.toggle('active',n>=1);document.getElementById('bar2').classList.toggle('active',n>=2)}
function showError(id,msg){const e=document.getElementById(id);if(e){e.textContent=msg;e.style.display='block'}}
function normalizePhone(v){let d=v.replace(/\D/g,'');if(d.startsWith('51')&&d.length===11)d=d.slice(2);if(d.length===9&&d.startsWith('9'))return '+51'+d;return ''}
function step1(){setProgress(1);screen.innerHTML=`<section class="card"><h1>¡Bienvenido al Club HAL Garage! 👋</h1><p>Regístrate para comenzar a disfrutar de puntos, recompensas y beneficios exclusivos.</p><label>Nombre completo</label><input id="name" type="text" autocomplete="name" placeholder="Ej. Eduardo Lazo"><label>Teléfono</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="987 654 321"><label>DNI</label><input id="dni" type="text" inputmode="numeric" maxlength="8" placeholder="8 dígitos"><label>Fecha de nacimiento</label><input id="birth" type="date"><div class="error" id="err1"></div><button class="btn" onclick="sendOtp()">Continuar y verificar teléfono →</button></section>`}
async function sendOtp(){const name=document.getElementById('name').value.trim();const phone=document.getElementById('phone').value.trim();const dni=document.getElementById('dni').value.trim();const birth=document.getElementById('birth').value;const e164=normalizePhone(phone);if(!name||!e164||dni.length!==8||!/^[0-9]{8}$/.test(dni)||!birth){showError('err1','Completa todos los datos correctamente. Usa un celular peruano de 9 dígitos y un DNI de 8 dígitos.');return}data.name=name;data.phone=phone;data.phoneE164=e164;data.dni=dni;data.birthDate=birth;const btn=document.querySelector('.btn');btn.disabled=true;btn.textContent='Enviando código…';const {error}=await supabase.auth.signInWithOtp({phone:e164});btn.disabled=false;btn.textContent='Continuar y verificar teléfono →';if(error){showError('err1','No pudimos enviar el código. Verifica el número o la configuración de SMS del Club.');console.error(error);return}otpStep()}
function otpStep(){setProgress(1);screen.innerHTML=`<section class="card"><h1>Verifica tu teléfono 📲</h1><p>Enviamos un código de 6 dígitos a <b>${data.phone}</b>.</p><label>Código de verificación</label><input id="otp" class="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"><div class="error" id="errOtp"></div><button class="btn" onclick="verifyPhone()">Verificar y continuar →</button><button class="btn secondary" onclick="step1()">← Volver</button><div class="notice">Tu teléfono se usará para entrar de forma segura al Club HAL Garage.</div></section>`;document.getElementById('otp').focus()}
async function verifyPhone(){const token=document.getElementById('otp').value.trim();if(!/^[0-9]{6}$/.test(token)){showError('errOtp','Ingresa el código de 6 dígitos.');return}const btn=document.querySelector('.btn');btn.disabled=true;btn.textContent='Verificando…';const {data:authData,error}=await supabase.auth.verifyOtp({phone:data.phoneE164,token,type:'sms'});if(error||!authData.session){btn.disabled=false;btn.textContent='Verificar y continuar →';showError('errOtp','El código no es válido o ya venció. Solicita uno nuevo.');return}await createCustomerAndVehicles()}
async function createCustomerAndVehicles(){const {data:sessionData}=await supabase.auth.getSession();const user=sessionData.session?.user;if(!user){showError('errOtp','No se pudo crear la sesión segura. Intenta nuevamente.');return}let customer=null;const own=await supabase.from('club_customers').select('*').eq('auth_user_id',user.id).maybeSingle();if(own.error){showError('errOtp','No pudimos comprobar tu perfil. Intenta nuevamente.');return}if(own.data){customer=own.data;const {error}=await supabase.from('club_customers').update({full_name:data.name,phone:data.phoneE164,dni:data.dni,birth_date:data.birthDate,updated_at:new Date().toISOString()}).eq('id',own.data.id);if(error){showError('errOtp','No pudimos actualizar tus datos.');return}}else{const ins=await supabase.from('club_customers').insert({auth_user_id:user.id,full_name:data.name,phone:data.phoneE164,dni:data.dni,birth_date:data.birthDate}).select('*').single();if(ins.error){showError('errOtp','No pudimos guardar tu registro. Intenta nuevamente.');console.error(ins.error);return}customer=ins.data}for(const plate of data.vehicles){const {error}=await supabase.from('club_vehicles').insert({customer_id:customer.id,plate});if(error&&!String(error.message||'').toLowerCase().includes('duplicate')){showError('errOtp','Tu perfil se creó, pero no pudimos guardar una de las placas.');console.error(error);return}}showSuccess()}
function step2(){setProgress(2);screen.innerHTML=`<section class="card"><h1>Agrega tu vehículo 🚗</h1><p>Solo necesitamos la placa. Puedes registrar uno o dos vehículos.</p><label>Placa del vehículo</label><input id="plate1" class="plate" maxlength="8" type="text" autocomplete="off" placeholder="ABC-123" oninput="this.value=this.value.toUpperCase()"><div class="check"><input id="has2" type="checkbox" onchange="toggleSecond()"><div><b>¿Tienes otro vehículo?</b><div class="small">Marca esta opción para agregar una segunda placa.</div></div></div><div id="second"></div><div class="error" id="err2"></div><button class="btn" onclick="finishRegistration()">Agregar vehículos y finalizar ✓</button><button class="btn secondary" onclick="otpStep()">← Volver</button></section>`}
function toggleSecond(){document.getElementById('second').innerHTML=document.getElementById('has2').checked?`<label>Segunda placa</label><input id="plate2" class="plate" maxlength="8" type="text" placeholder="DEF-456" oninput="this.value=this.value.toUpperCase()">`:''}
function normalizePlate(v){return v.trim().toUpperCase().replace(/\s+/g,'')}
function finishRegistration(){const p1=normalizePlate(document.getElementById('plate1').value);const p2=document.getElementById('has2').checked?normalizePlate(document.getElementById('plate2').value):'';if(!p1){showError('err2','Ingresa la placa de tu vehículo.');return}if(document.getElementById('has2').checked&&!p2){showError('err2','Ingresa la segunda placa o desmarca la opción.');return}if(p2&&p1===p2){showError('err2','Las placas deben ser diferentes.');return}data.vehicles=[p1,...(p2?[p2]:[])];createCustomerAndVehicles()}
function showSuccess(){screen.innerHTML=`<section class="card success"><div class="icon">🎉</div><h1>¡Registro completado!</h1><p>Bienvenido, <b>${data.name}</b>. Ya tienes tu cuenta segura del Club HAL Garage.</p>${data.vehicles.map((p,i)=>`<div class="vehicle"><b>VEHÍCULO ${i+1}</b><div class="plateview">${p}</div></div>`).join('')}<p class="small">Tu membresía empieza en categoría BRONCE con 0 puntos. HAL Garage podrá asignarte puntos, recompensas y beneficios desde el sistema.</p><button class="btn" onclick="location.href='./index.html'">Entrar al Club HAL Garage</button></section>`}
// Tras verificar el teléfono, pasamos al registro de vehículos.
const originalVerify=verifyPhone;verifyPhone=async function(){const token=document.getElementById('otp').value.trim();if(!/^[0-9]{6}$/.test(token)){showError('errOtp','Ingresa el código de 6 dígitos.');return}const btn=document.querySelector('.btn');btn.disabled=true;btn.textContent='Verificando…';const {data:authData,error}=await supabase.auth.verifyOtp({phone:data.phoneE164,token,type:'sms'});if(error||!authData.session){btn.disabled=false;btn.textContent='Verificar y continuar →';showError('errOtp','El código no es válido o ya venció. Solicita uno nuevo.');return}step2()}
step1();
</script></body></html>
