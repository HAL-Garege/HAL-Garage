<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b67b2"><title>Ingresar | Club HAL Garage</title><style>:root{--blue:#0b67b2;--ink:#172433;--muted:#718096;--bg:#f4f7fa;--line:#e3eaf1;--danger:#c43d4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:30px 17px}.brand{text-align:center;font-size:28px;font-weight:950}.brand span{color:var(--blue)}.club{text-align:center;color:var(--muted);font-size:11px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:23px;margin-top:25px;box-shadow:0 12px 32px rgba(23,36,51,.09)}h1{font-size:25px;margin:0 0 8px}p{color:var(--muted);font-size:13px;line-height:1.5}label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:15px 0 6px}input{width:100%;border:1px solid #d5e0e9;border-radius:12px;padding:14px;background:#fbfdff;font:inherit;outline:0}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0b67b21a}.pin{text-align:center;letter-spacing:7px;font-weight:900;font-size:23px}.btn{width:100%;border:0;border-radius:13px;padding:14px;margin-top:18px;background:var(--blue);color:#fff;font-weight:850;font-size:14px}.btn.secondary{background:#edf4f9;color:var(--blue)}.error{color:var(--danger);font-size:12px;margin-top:10px;display:none}.link{display:block;text-align:center;color:var(--blue);font-size:13px;font-weight:800;margin-top:17px;text-decoration:none}.notice{background:#edf7ff;border:1px solid #cfe8fa;border-radius:13px;padding:12px;color:#245b80;font-size:12px;line-height:1.45;margin-top:13px}</style></head><body><div class="app"><div class="brand">HAL <span>GARAGE</span></div><div class="club">CLUB</div><section class="card"><div id="screen"></div></section></div><script>
const URL='https://maqnglazkhwtzskfddgc.supabase.co/functions/v1/club-auth';const screen=document.getElementById('screen');
function err(msg){const e=document.getElementById('err');e.textContent=msg;e.style.display='block'}function phone(v){let d=v.replace(/\D/g,'');if(d.startsWith('51')&&d.length===11)d=d.slice(2);return d.length===9&&d.startsWith('9')?d:''}
function login(){screen.innerHTML=`<h1>Bienvenido nuevamente 👋</h1><p>Ingresa a tu cuenta del Club HAL Garage.</p><label>Teléfono / WhatsApp</label><input id="ph" type="tel" inputmode="tel" placeholder="987 654 321"><label>Clave del Club</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><div class="error" id="err"></div><button class="btn" onclick="doLogin()">Ingresar al Club →</button><a class="link" href="#" onclick="recover();return false">Crear o recuperar mi clave</a><a class="link" href="./registro.html">¿Aún no estás registrado?</a>`}
async function call(body){const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'No se pudo completar la operación');return b}
async function doLogin(){const p=phone(document.getElementById('ph').value),pin=document.getElementById('pin').value;if(!p||!/^[0-9]{6}$/.test(pin)){err('Ingresa un celular peruano y una clave de 6 dígitos.');return}const b=document.querySelector('.btn');b.disabled=true;b.textContent='Ingresando…';try{const x=await call({action:'login',phone:p,pin});localStorage.setItem('club_access_token',x.access_token);localStorage.setItem('club_refresh_token',x.refresh_token);localStorage.setItem('club_customer_id',x.customer_id);location.href='./index.html'}catch(e){err(e.message)}finally{b.disabled=false;b.textContent='Ingresar al Club →'}}
function recover(){screen.innerHTML=`<h1>Crear o recuperar clave 🔐</h1><p>Para proteger tu cuenta, necesitamos comprobar tus datos registrados.</p><label>Teléfono / WhatsApp</label><input id="ph" type="tel" inputmode="tel" placeholder="987 654 321"><label>DNI</label><input id="dni" type="text" inputmode="numeric" maxlength="8" placeholder="8 dígitos"><label>Placa de tu vehículo</label><input id="plate" type="text" maxlength="8" placeholder="ABC-123" style="text-transform:uppercase"><label>Nueva clave de 6 dígitos</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><div class="error" id="err"></div><button class="btn" onclick="doRecover()">Guardar nueva clave →</button><button class="btn secondary" onclick="login()">← Volver a ingresar</button><div class="notice">No enviaremos SMS ni WhatsApp. La placa ayuda a verificar que la cuenta te pertenece.</div>`}
async function doRecover(){const p=phone(document.getElementById('ph').value),dni=document.getElementById('dni').value.trim(),plate=document.getElementById('plate').value.trim().toUpperCase(),pin=document.getElementById('pin').value;if(!p||!/^[0-9]{8}$/.test(dni)||!plate||!/^[0-9]{6}$/.test(pin)){err('Completa teléfono, DNI, placa y una clave de 6 dígitos.');return}const b=document.querySelector('.btn');b.disabled=true;b.textContent='Actualizando…';try{await call({action:'recover',phone:p,dni,plate,pin});screen.innerHTML=`<h1>¡Clave actualizada! ✅</h1><p>Tu clave del Club HAL Garage fue actualizada correctamente.</p><button class="btn" onclick="login()">Ingresar al Club →</button>`}catch(e){err(e.message)}finally{b.disabled=false;b.textContent='Guardar nueva clave →'}}login();
</script></body></html>
