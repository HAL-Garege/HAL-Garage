<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111b">
<title>HAL Garage — Sistema operativo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#07111b;--panel:#0e1d2a;--line:#263b4e;--text:#f4f8fb;--muted:#91a4b7;--blue:#1595ff;--green:#49cf42;--red:#ff6262;--orange:#ffb52e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:#091722}
header{position:sticky;top:0;z-index:5;background:#091722;border-bottom:1px solid var(--line);padding:14px 15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:900}.logo b{color:#2ba9ff}.muted{color:var(--muted);font-size:12px}
main{padding:15px 14px 95px}.title{font-size:25px;font-weight:850;margin:2px 0}.date{color:var(--muted);font-size:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.metric{font-size:24px;font-weight:850;margin-top:4px}
.green{color:var(--green)}.blue{color:#43abff}.red{color:var(--red)}.orange{color:var(--orange)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{width:100%;border:0;border-radius:10px;padding:11px;margin-top:8px;background:#117ff0;color:#fff;font-weight:750}.btn.alt{background:#152b3d}.btn.green{background:#32a92b}.btn.red{background:#b8323f}.btn.orange{background:#9a6a00}.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;background:#07131f;border:1px solid #2a4359;color:#fff;border-radius:9px;padding:10px;margin:5px 0 9px}
label{font-size:12px;color:var(--muted);display:block;margin-top:5px}.result{background:#102637;border:1px solid #28506c;border-radius:10px;padding:10px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.service{display:flex;justify-content:space-between;align-items:center;padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#0b1824}
.service.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay button{padding:10px;border:1px solid #294157;background:#0b1824;color:white;border-radius:9px}.pay button.active{border-color:var(--blue);background:#103654}
.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:8px 4px;border-bottom:1px solid #203244;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;background:#183047}.ok{background:#12351a;color:#74e77b}.warn{background:#4a3507;color:#ffc04d}.bad{background:#4a151a;color:#ff7777}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#07111b;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px;z-index:6}.nav button{background:none;border:0;color:var(--muted);font-size:10px}.nav button b{display:block;font-size:18px}.nav button.active{color:#42aaff}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#183148;padding:11px 14px;border-radius:10px;display:none;z-index:20;font-size:13px;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.modalbox{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#0e1d2a;border:1px solid var(--line);border-radius:18px;padding:18px}
.photo-preview{max-width:100%;max-height:190px;border-radius:10px;border:1px solid var(--line);display:block;margin:8px auto}.hidden{display:none!important}
.small{font-size:11px}.danger{color:#ff7777}.success{color:#74e77b}.center{text-align:center}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">HAL <b>GARAGE</b></div><div class="muted" id="userLabel">Sin sesión</div></header>
<main id="app"></main>
<nav class="nav">
<button data-page="dashboard" onclick="go('dashboard')"><b>⌂</b>Inicio</button>
<button data-page="clients" onclick="go('clients')"><b>👤</b>Clientes</button>
<button data-page="sale" onclick="go('sale')"><b>＋</b>Venta</button>
<button data-page="cash" onclick="go('cash')"><b>💰</b>Caja</button>
<button data-page="more" onclick="go('more')"><b>☰</b>Más</button>
</nav>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://maqnglazkhwtzskfddgc.supabase.co';
const SUPABASE_KEY='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';
const EVIDENCE_BUCKET='hal-garage-evidence';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:false,persistSession:false,detectSessionInUrl:false}});

let HAL_USER=null, page='dashboard', clients=[], vehicles=[], vehicleTypes=[], services=[], prices=[], selectedClient=null, selectedVehicle=null;
let saleItems=[], salePayment='cash', saleEvidence={plate:null,payment:null};

const FIXED_USERS={
 admin:{role:'admin',name:'HAL GARAGE',password:'hal.garage.2020'},
 supervisor:{role:'supervisor',name:'Hal Garage',password:'Halgarage2020'},
 operario:{role:'operator',name:'hal garage',password:'hal2020'}
};

function money(n){return 'S/ '+Number(n||0).toFixed(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg,error=false){const e=document.getElementById('toast');e.textContent=msg;e.style.background=error?'#b42318':'#16803c';e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2600)}
function setHTML(x){document.getElementById('app').innerHTML=x}
function role(){return HAL_USER?.role}
function isAdmin(){return role()==='admin'}
function canOperate(){return ['admin','supervisor','operator'].includes(role())}
function requireLogin(){if(HAL_USER)return true;showLogin();return false}
function createdBy(){return HAL_USER?.id?{created_by:HAL_USER.id}:{}}
function canManagePrices(){return isAdmin()||role()==='supervisor'}
function canCorrect(){return isAdmin()||role()==='supervisor'}
function fmtDate(d=new Date()){return new Intl.DateTimeFormat('es-PE',{dateStyle:'medium'}).format(d)}
function activeNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
async function q(table,query){const {data,error}=await query;if(error)throw error;return data||[]}

async function resolveProfile(){
  try{
    const rows=await q('profiles',db.from('profiles').select('id,full_name,role,active').eq('active',true).limit(100));
    const exact=rows.find(x=>String(x.full_name).trim().toLowerCase()===HAL_USER.name.trim().toLowerCase());
    const byRole=rows.find(x=>x.role===HAL_USER.role||(HAL_USER.role==='operator'&&x.role==='operario'));
    HAL_USER.id=exact?.id||byRole?.id||null;
  }catch(e){console.warn(e)}
}

function showLogin(){
 const old=document.getElementById('login');if(old)old.remove();
 document.body.insertAdjacentHTML('afterbegin',`<div class="modal" id="login"><div class="modalbox">
 <div class="center"><div style="font-size:30px;font-weight:850">HAL <span class="blue">GARAGE</span></div><div class="muted">Sistema de gestión</div></div>
 <label>Perfil</label><select id="loginProfile"><option value="admin">👑 Administrador</option><option value="supervisor">🛠️ Supervisor</option><option value="operario">🚗 Operario</option></select>
 <label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
 <button class="btn" onclick="login()">INGRESAR</button><div id="loginMsg" class="danger center small" style="margin-top:10px"></div>
 </div></div>`);
}
async function login(){
 const k=document.getElementById('loginProfile').value,p=document.getElementById('loginPass').value,u=FIXED_USERS[k],m=document.getElementById('loginMsg');
 if(p!==u.password){m.textContent='Contraseña incorrecta.';return}
 HAL_USER={id:null,name:u.name,role:u.role};sessionStorage.setItem('HAL_FIXED_USER',k);await resolveProfile();
 document.getElementById('login')?.remove();document.getElementById('userLabel').textContent=HAL_USER.name+' · '+roleLabel(role());go(page);toast('Sesión iniciada');
}
function logout(){HAL_USER=null;sessionStorage.removeItem('HAL_FIXED_USER');document.getElementById('userLabel').textContent='Sin sesión';showLogin()}
function roleLabel(r){return r==='admin'?'Administrador':r==='supervisor'?'Supervisor':'Operario'}

async function boot(){
 const k=sessionStorage.getItem('HAL_FIXED_USER');
 if(k&&FIXED_USERS[k]){const u=FIXED_USERS[k];HAL_USER={id:null,name:u.name,role:u.role};await resolveProfile();document.getElementById('userLabel').textContent=HAL_USER.name+' · '+roleLabel(role())}
 if(!HAL_USER){showLogin();return}
 go('dashboard');
}
function go(p){if(!requireLogin())return;page=p;activeNav();({dashboard:dashboard,clients:clientsPage,sale:salePage,cash:cashPage,more:morePage}[p]||dashboard)()}

async function dashboard(){
 try{
  const today=new Date();const start=new Date(today);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+1);
  const [salesToday,expensesToday,allClients,low]=await Promise.all([
   q('sales',db.from('sales').select('id,total,status,created_at').gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).neq('status','voided')),
   q('expenses',db.from('expenses').select('id,amount,created_at').gte('created_at',start.toISOString()).lt('created_at',end.toISOString())),
   q('clients',db.from('clients').select('id,full_name,phone').eq('active',true).order('full_name')),
   q('products',db.from('products').select('id,name,stock,minimum_stock').eq('active',true).order('name'))
  ]);
  const income=salesToday.reduce((a,x)=>a+Number(x.total||0),0),expense=expensesToday.reduce((a,x)=>a+Number(x.amount||0),0);
  setHTML(`<div class="title">Inicio</div><div class="date">${fmtDate()}</div>
  <div class="grid"><div class="card"><div class="muted">Ventas hoy</div><div class="metric green">${money(income)}</div></div>
  <div class="card"><div class="muted">Gastos hoy</div><div class="metric red">${money(expense)}</div></div>
  <div class="card"><div class="muted">Neto del día</div><div class="metric blue">${money(income-expense)}</div></div>
  <div class="card"><div class="muted">Clientes</div><div class="metric">${allClients.length}</div></div></div>
  <div class="card"><div class="row"><b>Acciones rápidas</b><span class="badge">${roleLabel(role())}</span></div>
  <button class="btn" onclick="go('sale')">＋ Registrar venta</button><button class="btn alt" onclick="go('clients')">👤 Buscar cliente</button><button class="btn alt" onclick="cashPage()">💰 Ver caja</button></div>
  <div class="card"><b>Stock bajo</b>${low.filter(x=>Number(x.stock)<=Number(x.minimum_stock)).map(x=>`<div class="result row"><span>${esc(x.name)}</span><span class="badge warn">${esc(x.stock)}</span></div>`).join('')||'<div class="muted" style="margin-top:8px">No hay productos bajo mínimo.</div>'}</div>
  <div class="card"><b>Seguridad</b><div class="muted" style="margin-top:7px">Los precios y correcciones están bloqueados para operarios. Las evidencias de placa y pago se guardan junto a la venta.</div></div>`);
 }catch(e){setHTML(`<div class="title">Inicio</div><div class="errorbox">${esc(e.message)}</div>`)}
}

async function loadCatalog(){
 [clients,vehicles,vehicleTypes,services,prices]=await Promise.all([
  q('clients',db.from('clients').select('*').eq('active',true).order('full_name')),
  q('vehicles',db.from('vehicles').select('*').eq('active',true).order('plate')),
  q('vehicle_types',db.from('vehicle_types').select('*').eq('active',true).order('name')),
  q('services',db.from('services').select('*').eq('active',true).order('name')),
  q('service_prices',db.from('service_prices').select('*').eq('active',true))
 ]);
}
async function clientsPage(){
 try{await loadCatalog()}catch(e){}
 setHTML(`<div class="title">Clientes</div><div class="date">Clientes y vehículos registrados</div>
 <input id="clientSearch" placeholder="Buscar por nombre, teléfono o placa..." oninput="renderClientResults()">
 <button class="btn" onclick="newClient()">＋ Nuevo cliente</button><div id="clientResults"></div>`);
 renderClientResults();
}
function renderClientResults(){
 const term=(document.getElementById('clientSearch')?.value||'').toLowerCase();
 const rows=clients.filter(c=>{
  const vs=vehicles.filter(v=>v.client_id===c.id).map(v=>v.plate).join(' ');
  return (c.full_name+' '+(c.phone||'')+' '+vs).toLowerCase().includes(term)
 });
 document.getElementById('clientResults').innerHTML=rows.slice(0,50).map(c=>{
  const vs=vehicles.filter(v=>v.client_id===c.id);
  return `<div class="card"><div class="row"><b>${esc(c.full_name)}</b><span class="badge">${vs.length} vehículo(s)</span></div><div class="muted">${esc(c.phone||'Sin teléfono')}</div>
  ${vs.map(v=>`<div class="result row"><span>🚗 ${esc(v.plate)} · ${esc(v.brand||'')} ${esc(v.model||'')}</span><button class="smallbtn" onclick="startSale('${c.id}','${v.id}')">Vender</button></div>`).join('')}
  <button class="btn alt" onclick="addVehicle('${c.id}')">＋ Agregar vehículo</button><button class="btn alt" onclick="clientHistory('${c.id}')">📋 Historial de servicios</button></div>`
 }).join('')||'<div class="card muted">No se encontraron clientes.</div>';
}
async function clientHistory(clientId){
 const c=clients.find(x=>x.id===clientId);if(!c)return;
 try{
  const sales=await q('sales',db.from('sales').select('id,sale_number,total,status,created_at,vehicle_id').eq('client_id',clientId).order('created_at',{ascending:false}));
  const items=sales.length?await q('sale_items',db.from('sale_items').select('sale_id,service_name_snapshot,price_applied,quantity,subtotal').in('sale_id',sales.map(x=>x.id))):[];
  const total=sales.reduce((a,x)=>a+Number(x.total||0),0);
  setHTML(`<div class="title">Historial del cliente</div><div class="date">${esc(c.full_name)} · ${sales.length} visita(s) · ${money(total)} acumulado</div>
  <button class="btn alt" onclick="clientsPage()">← Volver a clientes</button>
  <div class="card"><div class="grid"><div><div class="muted">Visitas</div><div class="metric">${sales.length}</div></div><div><div class="muted">Total gastado</div><div class="metric green">${money(total)}</div></div></div></div>
  ${sales.map(x=>{const v=vehicles.find(v=>v.id===x.vehicle_id),its=items.filter(i=>i.sale_id===x.id);return `<div class="card"><div class="row"><b>Venta #${esc(x.sale_number)}</b><span class="badge">${new Date(x.created_at).toLocaleDateString('es-PE')}</span></div><div class="muted">${v?esc(v.plate):'Vehículo'} · ${esc(x.status)}</div>${its.map(i=>`<div class="result row"><span>${esc(i.service_name_snapshot)} × ${i.quantity}</span><b>${money(i.subtotal)}</b></div>`).join('')}<div class="row" style="margin-top:8px"><span>Total</span><b>${money(x.total)}</b></div></div>`}).join('')||'<div class="card muted">Este cliente todavía no tiene servicios registrados.</div>'}`);
 }catch(e){setHTML(`<div class="title">Historial</div><div class="errorbox">${esc(e.message)}</div>`)}
}

async function newClient(){
 const name=prompt('Nombre completo del cliente');if(!name?.trim())return;
 const phone=prompt('Teléfono (opcional)')||null;
 try{const {data,error}=await db.from('clients').insert({full_name:name.trim(),phone,...createdBy()}).select().single();if(error)throw error;toast('Cliente creado');await clientsPage()}catch(e){toast(e.message,true)}
}
async function addVehicle(clientId){
 const plate=prompt('Placa');if(!plate?.trim())return;
 const vt=prompt('Tipo: Auto / Camioneta / SUV / Camioneta XL');if(!vt?.trim())return;
 const type=vehicleTypes.find(x=>x.name.toLowerCase()===vt.trim().toLowerCase())||vehicleTypes[0];
 const brand=prompt('Marca (opcional)')||null,model=prompt('Modelo (opcional)')||null;
 try{const {error}=await db.from('vehicles').insert({client_id:clientId,vehicle_type_id:type.id,plate:plate.trim().toUpperCase(),brand,model,...createdBy()});if(error)throw error;toast('Vehículo registrado');await clientsPage()}catch(e){toast(e.message,true)}
}
function startSale(c,v){selectedClient=clients.find(x=>x.id===c);selectedVehicle=vehicles.find(x=>x.id===v);go('sale')}

async function salePage(){
 try{await loadCatalog()}catch(e){toast(e.message,true)}
 saleItems=[];salePayment='cash';saleEvidence={plate:null,payment:null};
 setHTML(`<div class="title">Nueva venta</div><div class="date">Registra servicios y evidencia</div>
 <label>Cliente</label><select id="saleClient" onchange="selectSaleClient(this.value)"><option value="">Seleccionar...</option>${clients.map(c=>`<option value="${c.id}" ${selectedClient?.id===c.id?'selected':''}>${esc(c.full_name)}</option>`).join('')}</select>
 <label>Vehículo</label><select id="saleVehicle" onchange="selectSaleVehicle(this.value)"><option value="">Seleccionar...</option></select>
 <div id="saleVehicleInfo"></div><div class="card"><b>Servicios</b><div id="serviceList"></div></div>
 <div class="card"><div class="row"><b>Total</b><span id="saleTotal" class="metric green">${money(0)}</span></div>
 <div class="pay"><button onclick="setPay('cash')" id="pay_cash">💵 Efectivo</button><button onclick="setPay('yape')" id="pay_yape">📱 Yape</button><button onclick="setPay('plin')" id="pay_plin">📱 Plin</button><button onclick="setPay('transfer')" id="pay_transfer">🏦 Transfer.</button></div>
 <label>Foto de placa (obligatoria)</label><input id="platePhoto" type="file" accept="image/*" capture="environment" onchange="previewFile(this,'platePreview')"><img id="platePreview" class="photo-preview hidden">
 <label>Comprobante de pago (obligatorio)</label><input id="paymentPhoto" type="file" accept="image/*" capture="environment" onchange="previewFile(this,'paymentPreview')"><img id="paymentPreview" class="photo-preview hidden">
 <button class="btn green" onclick="finishSale()">CONFIRMAR VENTA</button></div>`);
 selectSaleClient(selectedClient?.id||'');setPay('cash');
}
function selectSaleClient(id){
 selectedClient=clients.find(c=>c.id===id)||null;const s=document.getElementById('saleVehicle');if(!s)return;
 const vs=vehicles.filter(v=>v.client_id===id);s.innerHTML='<option value="">Seleccionar...</option>'+vs.map(v=>`<option value="${v.id}" ${selectedVehicle?.id===v.id?'selected':''}>${esc(v.plate)} · ${esc(v.brand||'')} ${esc(v.model||'')}</option>`).join('');
 if(selectedVehicle&&selectedVehicle.client_id===id)selectSaleVehicle(selectedVehicle.id);else{selectedVehicle=null;document.getElementById('saleVehicleInfo').innerHTML='';renderServices()}
}
function selectSaleVehicle(id){
 selectedVehicle=vehicles.find(v=>v.id===id)||null;
 const t=vehicleTypes.find(x=>x.id===selectedVehicle?.vehicle_type_id);
 document.getElementById('saleVehicleInfo').innerHTML=selectedVehicle?`<div class="result"><b>${esc(selectedVehicle.plate)}</b> · ${esc(t?.name||'')}</div>`:'';
 renderServices();
}
function priceFor(serviceId,vehicleTypeId){return prices.find(p=>p.service_id===serviceId&&p.vehicle_type_id===vehicleTypeId)}
function renderServices(){
 const box=document.getElementById('serviceList');if(!box)return;
 if(!selectedVehicle){box.innerHTML='<div class="muted">Selecciona un vehículo.</div>';updateTotal();return}
 const rows=services.map(s=>{const p=priceFor(s.id,selectedVehicle.vehicle_type_id);if(!p)return '';const active=saleItems.some(i=>i.service_id===s.id);return `<div class="service ${active?'active':''}" onclick="toggleService('${s.id}')"><span>${esc(s.name)}</span><b>${money(p.price)}</b></div>`}).join('');
 box.innerHTML=rows||'<div class="muted">No hay precios para este tipo de vehículo.</div>';updateTotal()
}
function toggleService(id){
 if(!selectedVehicle)return;
 const i=saleItems.findIndex(x=>x.service_id===id);if(i>=0)saleItems.splice(i,1);else{const s=services.find(x=>x.id===id),p=priceFor(id,selectedVehicle.vehicle_type_id);saleItems.push({service_id:id,vehicle_type_id:selectedVehicle.vehicle_type_id,service_name_snapshot:s.name,price_applied:Number(p.price),quantity:1,subtotal:Number(p.price)})}
 renderServices()
}
function updateTotal(){const t=saleItems.reduce((a,x)=>a+x.subtotal,0);const e=document.getElementById('saleTotal');if(e)e.textContent=money(t)}
function setPay(p){salePayment=p;document.querySelectorAll('.pay button').forEach(b=>b.classList.remove('active'));document.getElementById('pay_'+p)?.classList.add('active')}
function previewFile(input,id){const f=input.files?.[0],img=document.getElementById(id);if(!f||!img)return;img.src=URL.createObjectURL(f);img.classList.remove('hidden')}
async function uploadEvidence(saleId,type,file){
 if(!file)throw new Error('Falta la foto de '+(type==='plate'?'placa':'comprobante de pago')+'.');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('La evidencia debe ser JPG, PNG o WEBP.');
 if(file.size>5*1024*1024)throw new Error('Cada foto debe pesar máximo 5 MB.');
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
 const path=`sales/${saleId}/${type}-${Date.now()}.${ext}`;
 const {error}=await db.storage.from(EVIDENCE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
 if(error)throw error;
 const {error:e2}=await db.from('sale_evidence').insert({sale_id:saleId,evidence_type:type,storage_path:path,uploaded_by:HAL_USER.id});
 if(e2)throw e2;
 return path;
}
async function finishSale(){
 if(!canOperate())return toast('No tienes permiso.',true);
 if(!selectedClient||!selectedVehicle)return toast('Selecciona cliente y vehículo.',true);
 if(!saleItems.length)return toast('Agrega al menos un servicio.',true);
 const plate=document.getElementById('platePhoto')?.files?.[0],payment=document.getElementById('paymentPhoto')?.files?.[0];
 if(!plate||!payment)return toast('La foto de placa y el comprobante son obligatorios.',true);
 const total=saleItems.reduce((a,x)=>a+x.subtotal,0);
 try{
  const {data:sale,error}=await db.from('sales').insert({client_id:selectedClient.id,vehicle_id:selectedVehicle.id,total,status:'confirmed',...createdBy()}).select().single();if(error)throw error;
  const {error:ie}=await db.from('sale_items').insert(saleItems.map(x=>({...x,sale_id:sale.id})));if(ie)throw ie;
  const {error:pe}=await db.from('payments').insert({sale_id:sale.id,method:salePayment,amount:total,...createdBy()});if(pe)throw pe;
  const {error:ce}=await db.from('cash_movements').insert({movement_type:'income',payment_method:salePayment,amount:total,sale_id:sale.id,...createdBy()});if(ce)throw ce;
  await uploadEvidence(sale.id,'plate',plate);await uploadEvidence(sale.id,'payment',payment);
  toast('Venta registrada correctamente');selectedClient=null;selectedVehicle=null;saleItems=[];setTimeout(()=>go('dashboard'),700);
 }catch(e){toast(e.message,true)}
}

async function cashPage(){
 try{
  const global=!(['operator'].includes(role()));
  const start=global?null:new Date(); if(start)start.setHours(0,0,0,0);
  const end=global?null:new Date(start); if(end)end.setDate(end.getDate()+1);
  let mq=db.from('cash_movements').select('*').order('created_at',{ascending:false});
  let eq=db.from('expenses').select('*').order('created_at',{ascending:false});
  if(!global){mq=mq.gte('created_at',start.toISOString()).lt('created_at',end.toISOString());eq=eq.gte('created_at',start.toISOString()).lt('created_at',end.toISOString())}
  const [mov,exp]=await Promise.all([q('cash_movements',mq.limit(500)),q('expenses',eq.limit(500))]);
  const income=mov.filter(x=>x.movement_type==='income').reduce((a,x)=>a+Number(x.amount),0),expense=exp.reduce((a,x)=>a+Number(x.amount),0);
  setHTML(`<div class="title">Caja</div><div class="date">${global?'Caja global · Administrador/Supervisor':'Solo ingresos y movimientos de hoy · Operario'}</div>
  <div class="grid"><div class="card"><div class="muted">${global?'Ingresos globales':'Ingresos de hoy'}</div><div class="metric green">${money(income)}</div></div>
  <div class="card"><div class="muted">${global?'Gastos globales':'Gastos de hoy'}</div><div class="metric red">${money(expense)}</div></div></div>
  ${isAdmin()||role()==='supervisor'?'<button class="btn" onclick="newExpense()">＋ Registrar gasto</button>':''}
  <div class="card"><b>Movimientos ${global?'globales':'del día'}</b><table class="table"><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Método</th></tr>
  ${mov.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('es-PE')}</td><td>${x.movement_type==='income'?'Ingreso':'Salida'}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sin movimientos.</td></tr>'}</table></div>`);
 }catch(e){setHTML(`<div class="title">Caja</div><div class="errorbox">${esc(e.message)}</div>`)}
}
async function newExpense(){
 if(!(isAdmin()||role()==='supervisor'))return;
 const concept=prompt('Concepto del gasto');if(!concept?.trim())return;const amount=Number(prompt('Monto S/'));if(!(amount>0))return;
 const method=(prompt('Método: cash / yape / plin / transfer / other')||'cash').trim();
 try{
  const {data,error}=await db.from('expenses').insert({concept:concept.trim(),amount,payment_method:method,...createdBy()}).select().single();if(error)throw error;
  const {error:e2}=await db.from('cash_movements').insert({movement_type:'expense',payment_method:method,amount,expense_id:data.id,...createdBy()});if(e2)throw e2;
  toast('Gasto registrado');cashPage()
 }catch(e){toast(e.message,true)}
}

async function morePage(){
 setHTML(`<div class="title">Más</div><div class="date">Herramientas y control</div>
 <div class="card"><button class="btn" onclick="inventoryPage()">📦 Inventario / Productos</button><button class="btn alt" onclick="workdayPage()">🕘 Jornada</button><button class="btn alt" onclick="correctionsPage()">✏️ Correcciones</button>${canManagePrices()?'<button class="btn alt" onclick="pricesPage()">💲 Precios</button>':''}<button class="btn red" onclick="logout()">Cerrar sesión</button></div>
 <div class="card"><b>Perfil</b><div class="muted" style="margin-top:6px">${esc(HAL_USER.name)} · ${roleLabel(role())}</div></div>`)
}
async function inventoryPage(){
 try{
  const ps=await q('products',db.from('products').select('*').eq('active',true).order('name'));
  setHTML(`<div class="title">Inventario</div><div class="date">Stock, ingresos y salidas</div>
  ${isAdmin()||role()==='supervisor'?'<button class="btn" onclick="newProduct()">＋ Ingresar producto al inventario</button>':''}
  <button class="btn alt" onclick="inventoryMove()">↕ Registrar entrada / salida</button>
  <div class="card"><table class="table"><tr><th>Producto</th><th>Stock</th><th>Mín.</th><th>Acción</th></tr>
  ${ps.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.unit_name)}</span></td>
  <td class="${Number(p.stock)<=Number(p.minimum_stock)?'orange':''}">${esc(p.stock)}</td><td>${esc(p.minimum_stock)}</td>
  <td><button class="smallbtn" onclick="inventoryMove('${p.id}')">Movimiento</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No hay productos registrados.</td></tr>'}</table></div>
  <div class="card"><b>Permisos</b><div class="muted" style="margin-top:6px">Administrador y Supervisor pueden crear productos. Los tres perfiles pueden registrar salidas/consumo; las entradas de productos quedan para Administrador y Supervisor.</div></div>`);
 }catch(e){setHTML(`<div class="title">Inventario</div><div class="errorbox">${esc(e.message)}<br><span class="small">Si la tabla de categorías no existe, puedes omitirla; los productos no dependen de ella.</span></div>`)}
}
async function newProduct(){
 if(!(isAdmin()||role()==='supervisor'))return toast('Solo Administrador o Supervisor puede ingresar productos.',true);
 const name=prompt('Nombre del producto');if(!name?.trim())return;
 const unit=prompt('Unidad: unidad, litro, ml, kg, etc.','unidad')||'unidad';
 const stock=Number(prompt('Stock inicial','0'));if(!(stock>=0))return;
 const minimum=Number(prompt('Stock mínimo','0'));if(!(minimum>=0))return;
 try{
  const {error}=await db.from('products').insert({name:name.trim(),unit_name:unit.trim(),stock,minimum_stock:minimum});
  if(error)throw error;
  if(stock>0){
   const ps=await q('products',db.from('products').select('id').eq('name',name.trim()).limit(1));
   if(ps[0])await db.from('inventory_movements').insert({product_id:ps[0].id,movement_type:'entry',quantity:stock,reason:'Stock inicial',...createdBy()});
  }
  toast('Producto ingresado al inventario');inventoryPage();
 }catch(e){toast(e.message,true)}
}
async function inventoryMove(productId=null){
 const ps=await q('products',db.from('products').select('*').eq('active',true).order('name'));
 if(!ps.length)return toast('Primero ingresa un producto al inventario.',true);
 let p=productId?ps.find(x=>x.id===productId):null;
 if(!p){
  const name=prompt('Nombre exacto del producto');if(!name)return;
  p=ps.find(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase());
 }
 if(!p)return toast('Producto no encontrado.',true);
 const type=prompt('Tipo: entry = ingreso de producto / exit = consumo o salida / adjustment = ajuste');
 if(!['entry','exit','adjustment'].includes(type))return toast('Tipo de movimiento inválido.',true);
 if(type==='entry' && !(isAdmin()||role()==='supervisor'))return toast('Solo Administrador o Supervisor puede ingresar productos.',true);
 const qty=Number(prompt('Cantidad'));if(!(qty>0))return;
 const reason=prompt('Motivo',type==='entry'?'Compra / reposición':'Consumo de servicio')||'Movimiento manual';
 try{
  let stock=Number(p.stock);
  if(type==='entry')stock+=qty;
  else if(type==='exit'){if(stock<qty)throw new Error('Stock insuficiente.');stock-=qty}
  else stock=qty;
  const {error}=await db.from('inventory_movements').insert({product_id:p.id,movement_type:type,quantity:qty,reason,...createdBy()});if(error)throw error;
  const {error:e}=await db.from('products').update({stock,updated_at:new Date().toISOString()}).eq('id',p.id);if(e)throw e;
  toast('Movimiento de inventario guardado');inventoryPage();
 }catch(e){toast(e.message,true)}
}
async function workdayPage(){
 try{
  const rows=await q('workdays',db.from('workdays').select('*').order('work_date',{ascending:false}).limit(30));
  const today=new Date().toISOString().slice(0,10);
  const mine=rows.find(w=>w.operator_id===HAL_USER.id&&w.work_date===today&&w.status==='open');
  setHTML(`<div class="title">Jornada</div><div class="date">${fmtDate()}</div>
  ${mine?`<div class="card"><b>Jornada abierta</b><div class="muted" style="margin-top:6px">La jornada de hoy está activa.</div><button class="btn red" onclick="closeWorkday('${mine.id}')">Cerrar jornada</button></div>`
  :`<div class="card"><b>Jornada de hoy</b><div class="muted" style="margin-top:6px">Debes abrir la jornada antes de comenzar a operar.</div><button class="btn" onclick="openWorkday()">＋ Abrir jornada</button></div>`}
  <div class="card"><b>Historial de jornadas</b><table class="table"><tr><th>Fecha</th><th>Estado</th><th>Cierre</th></tr>
  ${rows.map(w=>`<tr><td>${esc(w.work_date)}</td><td><span class="badge ${w.status==='open'?'ok':'warn'}">${esc(w.status)}</span></td><td>${w.closed_at?new Date(w.closed_at).toLocaleString('es-PE'):'—'}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sin jornadas.</td></tr>'}</table></div>`);
 }catch(e){setHTML(`<div class="title">Jornada</div><div class="errorbox">${esc(e.message)}</div>`)}
}
async function openWorkday(){
 const d=new Date().toISOString().slice(0,10);
 try{
  const existing=await q('workdays',db.from('workdays').select('id,status').eq('operator_id',HAL_USER.id).eq('work_date',d).limit(10));
  if(existing.some(x=>x.status==='open'))return toast('Ya tienes una jornada abierta.',true);
  const {error}=await db.from('workdays').insert({operator_id:HAL_USER.id,work_date:d,status:'open'});if(error)throw error;
  toast('Jornada abierta');workdayPage()
 }catch(e){toast(e.message,true)}
}
async function closeWorkday(id){
 try{const {error}=await db.from('workdays').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',id);if(error)throw error;toast('Jornada cerrada');workdayPage()}catch(e){toast(e.message,true)}
}
async function correctionsPage(){
 try{const rows=await q('correction_requests',db.from('correction_requests').select('*').order('created_at',{ascending:false}).limit(50));setHTML(`<div class="title">Correcciones</div>${canCorrect()?'<button class="btn" onclick="requestCorrection()">＋ Solicitar / registrar corrección</button>':''}<div class="card"><table class="table"><tr><th>Fecha</th><th>Entidad</th><th>Estado</th><th>Motivo</th></tr>${rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('es-PE')}</td><td>${esc(r.entity_type)}</td><td><span class="badge ${r.status==='approved'?'ok':r.status==='pending'?'warn':'bad'}">${esc(r.status)}</span></td><td>${esc(r.reason)}</td></tr>`).join('')}</table></div>`)}catch(e){toast(e.message,true)}
}
async function requestCorrection(){
 const entity=prompt('Entidad: sale / expense / client / vehicle');if(!entity)return;const id=prompt('ID de la entidad');if(!id)return;const reason=prompt('Motivo obligatorio');if(!reason)return;
 try{const {error}=await db.from('correction_requests').insert({entity_type:entity,entity_id:id,requested_by:HAL_USER.id,reason,requested_changes:{manual:true},status:'pending'});if(error)throw error;toast('Solicitud registrada');correctionsPage()}catch(e){toast(e.message,true)}
}
async function pricesPage(){
 if(!canManagePrices())return toast('Solo Administrador o Supervisor puede modificar precios.',true);
 try{await loadCatalog();setHTML(`<div class="title">Precios</div><div class="date">Solo Administrador puede editar</div><div class="card">${prices.map(p=>{const s=services.find(x=>x.id===p.service_id),v=vehicleTypes.find(x=>x.id===p.vehicle_type_id);return `<div class="result"><div class="row"><span>${esc(s?.name||'')}</span><span>${esc(v?.name||'')}</span></div><input id="price_${p.id}" type="number" min="0" step="0.01" value="${p.price}"><button class="btn" onclick="savePrice('${p.id}')">Guardar</button></div>`}).join('')}</div>`)}catch(e){toast(e.message,true)}
}
async function savePrice(id){
 if(!canManagePrices())return toast('Solo Administrador o Supervisor.',true);const value=Number(document.getElementById('price_'+id)?.value);if(!(value>=0))return;
 try{const {error}=await db.from('service_prices').update({price:value,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;toast('Precio actualizado')}catch(e){toast(e.message,true)}
}

boot();
</script>
