<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg">
<title>HAL Garage</title>
<style>
:root{--bg:#07111b;--panel:#0e1d2a;--line:#263b4e;--text:#f4f8fb;--muted:#91a4b7;--blue:#1595ff;--green:#49cf42;--red:#ff6262;--orange:#ffb52e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:#091722}
header{position:sticky;top:0;z-index:5;background:#091722;border-bottom:1px solid var(--line);padding:15px 16px;display:flex;justify-content:space-between}.logo{font-size:21px;font-weight:900}.logo b{color:#2ba9ff}.muted{color:var(--muted);font-size:12px}
main{padding:16px 15px 92px}.title{font-size:25px;font-weight:850;margin:2px 0}.date{color:var(--muted);font-size:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.metric{font-size:25px;font-weight:850;margin-top:4px}.green{color:var(--green)}.blue{color:#43abff}.red{color:var(--red)}.orange{color:var(--orange)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px;background:#117ff0;color:#fff;font-weight:750}.btn.alt{background:#152b3d}.btn.green{background:#32a92b}.btn.red{background:#b8323f}.btn:disabled{opacity:.4}
input,select,textarea{width:100%;background:#07131f;border:1px solid #2a4359;color:#fff;border-radius:9px;padding:11px;margin:5px 0 10px}.result{background:#102637;border:1px solid #28506c;border-radius:10px;padding:11px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.service{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#0b1824}.service.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay button{padding:11px;border:1px solid #294157;background:#0b1824;color:white;border-radius:9px}.pay button.active{border-color:var(--blue);background:#103654}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:8px 4px;border-bottom:1px solid #203244;text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;background:#183047}.ok{background:#12351a;color:#74e77b}.warn{background:#4a3507;color:#ffc04d}.bad{background:#4a151a;color:#ff7777}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#07111b;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px;z-index:6}.nav button{background:none;border:0;color:var(--muted);font-size:10px}.nav button b{display:block;font-size:18px}.nav button.active{color:#42aaff}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#183148;padding:11px 14px;border-radius:10px;display:none;z-index:10;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">HAL <b>GARAGE</b></div><div class="muted" id="userLabel">Modo demo</div></header>
<main id="app"></main>
<nav class="nav">
<button data-page="dashboard" onclick="go('dashboard')"><b>⌂</b>Inicio</button>
<button data-page="clients" onclick="go('clients')"><b>👤</b>Clientes</button>
<button data-page="sale" onclick="go('sale')"><b>＋</b>Venta</button>
<button data-page="cash" onclick="go('cash')"><b>💰</b>Caja</button>
<button data-page="more" onclick="go('more')"><b>☰</b>Más</button>
</nav></div>
<div class="toast" id="toast"></div>
<script>
const KEY='hal_garage_v1';
const defaults={role:'admin',clients:[
{name:'Juan Pérez',phone:'987654321',plate:'A7B-123',brand:'Toyota',model:'Hilux',type:'Camioneta / SUV',visits:4,total:120},
{name:'María Gonzales',phone:'956222111',plate:'V4F-456',brand:'Nissan',model:'X-Trail',type:'Camioneta / SUV',visits:2,total:50}],
prices:{'Lavado exterior':{Auto:10,'Camioneta / SUV':15,'Camioneta XL':20},'Lavado completo':{Auto:20,'Camioneta / SUV':30,'Camioneta XL':40},'Aspirado':{Auto:7,'Camioneta / SUV':10,'Camioneta XL':13},'Encerado':{Auto:15,'Camioneta / SUV':20,'Camioneta XL':20},'Lavado de motor':{Auto:8,'Camioneta / SUV':8,'Camioneta XL':8},'Pulido':{Auto:200,'Camioneta / SUV':300,'Camioneta XL':350}},
sales:[{plate:'A7B-123',client:'Juan Pérez',service:'Lavado completo',amount:30,pay:'Yape',time:'10:35'}],
expenses:[{concept:'Shampoo',amount:25,pay:'Efectivo',time:'09:30'}],
products:[{name:'Shampoo Neutro',unit:'Galonera 20 L',stock:10,min:3},{name:'Espuma Activa',unit:'Galonera 20 L',stock:8,min:2},{name:'Limpia Vidrios',unit:'Botella 500 ml',stock:3,min:5},{name:'Microfibra Premium',unit:'Unidad',stock:28,min:10}],
journey:{open:null,lunch:null,back:null,close:null,notes:''},selected:null,service:'Lavado exterior',pay:'Efectivo'};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return 'S/ '+Number(n).toFixed(2)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,clients,sale,cash,more,inventory,journey,reports,settings}[p]||dashboard)()}
function setHTML(x){document.getElementById('app').innerHTML=x}
function dashboard(){let i=db.sales.reduce((a,x)=>a+x.amount,0),e=db.expenses.reduce((a,x)=>a+x.amount,0);setHTML(`<div class="title">Dashboard</div><div class="date">Control de HAL Garage</div><div class="grid"><div class="card"><div class="muted">Ventas hoy</div><div class="metric green">${money(i)}</div></div><div class="card"><div class="muted">Vehículos</div><div class="metric blue">${db.sales.length}</div></div><div class="card"><div class="muted">Gastos</div><div class="metric red">${money(e)}</div></div><div class="card"><div class="muted">Resultado</div><div class="metric orange">${money(i-e)}</div></div></div><div class="card"><div class="row"><b>Jornada</b><span class="badge ok">${db.journey.close?'Cerrada':db.journey.open?'Abierta':'Pendiente'}</span></div><div class="result">🟢 ${db.journey.open||'Pendiente'} · 🟡 ${db.journey.lunch||'—'} · 🔵 ${db.journey.back||'—'} · 🔴 ${db.journey.close||'—'}</div><button class="btn alt" onclick="go('journey')">Ver jornada</button></div><div class="card"><div class="row"><b>Inventario</b><span class="badge warn">${db.products.filter(p=>p.stock<=p.min).length} bajos</span></div><button class="btn alt" onclick="go('inventory')">Ver inventario</button></div>`)}
function clients(){setHTML(`<div class="title">Clientes</div><div class="date">Buscar por placa, nombre o teléfono</div><input id="cq" placeholder="Ej. A7B-123" oninput="filterClients()"><div id="clist">${clientRows(db.clients)}</div><button class="btn" onclick="newClient()">＋ Nuevo cliente</button>`)}
function clientRows(a){return a.map((c,i)=>`<div class="card"><div class="muted">${c.plate}</div><b>${c.name}</b><div>${c.brand} ${c.model} · ${c.type}</div><div class="muted">${c.visits} visitas · ${money(c.total)}</div><button class="btn alt" onclick="selectClient(${i})">Usar vehículo</button></div>`).join('')||'<div class="card">No hay resultados.</div>'}
function filterClients(){let q=document.getElementById('cq').value.toLowerCase();document.getElementById('clist').innerHTML=clientRows(db.clients.filter(c=>(c.name+c.phone+c.plate+c.brand+c.model).toLowerCase().includes(q)))}
function newClient(){let name=prompt('Nombre completo');if(!name)return;let phone=prompt('Teléfono')||'',plate=(prompt('Placa')||'').toUpperCase();if(!plate)return;let brand=prompt('Marca')||'',model=prompt('Modelo')||'',type=prompt('Tipo: Auto / Camioneta / SUV / Camioneta XL')||'Auto';if(db.clients.some(c=>c.plate===plate))return toast('Esa placa ya está registrada');db.clients.push({name,phone,plate,brand,model,type,visits:0,total:0});save();toast('Cliente registrado');clients()}
function selectClient(i){db.selected=i;save();go('sale')}
function sale(){let c=db.selected!=null?db.clients[db.selected]:null;setHTML(`<div class="title">Nueva venta</div><div class="date">Placa → servicio → pago → guardar</div><div class="card"><b>1. Placa</b><input id="sp" placeholder="A7B-123" value="${c?c.plate:''}" oninput="lookupSale()"><div id="sc">${c?`<div class="result"><b>${c.name}</b><br>${c.plate} · ${c.brand} ${c.model}<br><span class="muted">${c.type}</span></div>`:'<div class="muted">Busca una placa registrada.</div>'}</div></div><div class="card"><b>2. Servicio</b>${Object.keys(db.prices).map(s=>`<div class="service ${db.service===s?'active':''}" onclick="pickService('${s}')"><span>${s}</span><b>${c?money(db.prices[s][c.type]||0):'—'}</b></div>`).join('')}</div><div class="card"><b>3. Forma de pago</b><div class="pay">${['Efectivo','Yape','Plin','Transferencia'].map(p=>`<button class="${db.pay===p?'active':''}" onclick="db.pay='${p}';save();sale()">${p}</button>`).join('')}</div></div><div class="card"><b>4. Comprobante</b><button class="btn alt" onclick="toast('📷 Cámara: se implementará en la versión conectada')">📷 Tomar foto</button><div class="muted">Yape, Plin y transferencia: obligatorio.</div></div><div class="card"><b>Resumen</b><div class="result">${c?c.name:'Sin cliente'}<br>${c?c.plate:'—'}<br>${db.service}<br><strong class="green">${c?money(db.prices[db.service][c.type]||0):'—'}</strong></div><button class="btn green" onclick="saveSale()">GUARDAR VENTA</button></div>`)}
function lookupSale(){let q=document.getElementById('sp').value.toUpperCase();let i=db.clients.findIndex(c=>c.plate===q);db.selected=i>=0?i:null;save();sale()}
function pickService(s){db.service=s;save();sale()}
function saveSale(){if(db.selected==null)return toast('Selecciona una placa');let c=db.clients[db.selected],a=db.prices[db.service][c.type]||0;db.sales.push({plate:c.plate,client:c.name,service:db.service,amount:a,pay:db.pay,time:new Date().toLocaleTimeString('es-PE')});c.visits++;c.total+=a;save();toast('Venta registrada → Caja + historial');go('dashboard')}
function cash(){let i=db.sales.reduce((a,x)=>a+x.amount,0),e=db.expenses.reduce((a,x)=>a+x.amount,0);setHTML(`<div class="title">Caja</div><div class="date">Los ingresos vienen de Ventas automáticamente.</div><div class="grid"><div class="card"><div class="muted">Ingresos</div><div class="metric green">${money(i)}</div></div><div class="card"><div class="muted">Gastos</div><div class="metric red">${money(e)}</div></div><div class="card"><div class="muted">Neto</div><div class="metric blue">${money(i-e)}</div></div><div class="card"><div class="muted">Ventas</div><div class="metric orange">${db.sales.length}</div></div></div><div class="card"><b>Medios de pago</b>${['Efectivo','Yape','Plin','Transferencia'].map(p=>`<div class="result">${p}<b style="float:right">${money(db.sales.filter(x=>x.pay===p).reduce((a,x)=>a+x.amount,0))}</b></div>`).join('')}</div><div class="card"><b>Registrar gasto</b><button class="btn alt" onclick="newExpense()">＋ Nuevo gasto</button></div>`)}
function newExpense(){let c=prompt('Concepto');if(!c)return;let a=Number(prompt('Monto')||0);if(!a)return;let p=prompt('Pago: Efectivo / Yape / Plin / Transferencia')||'Efectivo';db.expenses.push({concept:c,amount:a,pay:p,time:new Date().toLocaleTimeString('es-PE')});save();toast('Gasto registrado');cash()}
function inventory(){setHTML(`<div class="title">Inventario</div><div class="date">Presentaciones y unidades reales del negocio</div><div class="grid"><div class="card"><div class="muted">Productos</div><div class="metric green">${db.products.length}</div></div><div class="card"><div class="muted">Stock bajo</div><div class="metric orange">${db.products.filter(p=>p.stock<=p.min).length}</div></div></div>${db.products.map((p,i)=>`<div class="card"><div class="row"><b>${p.name}</b><span class="badge ${p.stock<=p.min?'warn':'ok'}">${p.stock<=p.min?'Stock bajo':'En stock'}</span></div><div class="muted">${p.unit} · actual ${p.stock} · mínimo ${p.min}</div><button class="btn alt" onclick="useProduct(${i})">− 1</button></div>`).join('')}<button class="btn" onclick="addProduct()">＋ Nuevo producto</button>`)}
function useProduct(i){if(db.products[i].stock<=0)return toast('Sin stock');db.products[i].stock--;save();toast('Salida registrada');inventory()}
function addProduct(){let n=prompt('Producto');if(!n)return;let u=prompt('Presentación/unidad')||'Unidad',s=Number(prompt('Stock inicial')||0),m=Number(prompt('Stock mínimo')||0);db.products.push({name:n,unit:u,stock:s,min:m});save();inventory()}
function journey(){setHTML(`<div class="title">Jornada</div><div class="date">Carina · foto obligatoria por evento</div><div class="card"><div class="row"><b>Estado</b><span class="badge ${db.journey.close?'bad':db.journey.open?'ok':'warn'}">${db.journey.close?'Cerrada':db.journey.open?'Abierta':'Pendiente'}</span></div></div>${[['open','🟢','Abrir'],['lunch','🟡','Almuerzo'],['back','🔵','Regreso'],['close','🔴','Cerrar']].map(x=>`<div class="card"><div class="row"><b>${x[1]} ${x[2]}</b><span class="muted">${db.journey[x[0]]||'Pendiente'}</span></div><button class="btn ${x[0]=='close'?'red':x[0]=='open'?'green':'alt'}" onclick="eventJourney('${x[0]}')" ${db.journey[x[0]]?'disabled':''}>Registrar</button><div class="result">📷 Foto obligatoria<br><span class="muted">Hora oficial: servidor en versión conectada.</span></div></div>`).join('')}<div class="card"><b>Motivo / observación</b><select onchange="db.journey.notes=this.value;save()"><option>Seleccionar</option><option>Sin almuerzo</option><option>Permiso autorizado</option><option>Incidente</option><option>Salida anticipada autorizada</option></select></div>`)}
function eventJourney(k){if(k==='open'&&db.journey.open)return toast('Ya está abierta');if(k!=='open'&&!db.journey.open)return toast('Primero abre la jornada');if(k==='back'&&!db.journey.lunch)return toast('Primero registra almuerzo');db.journey[k]=new Date().toLocaleTimeString('es-PE');save();toast('Evento registrado');journey()}
function reports(){let i=db.sales.reduce((a,x)=>a+x.amount,0),e=db.expenses.reduce((a,x)=>a+x.amount,0),sv={};db.sales.forEach(s=>sv[s.service]=(sv[s.service]||0)+1);setHTML(`<div class="title">Reportes</div><div class="date">Resumen actual</div><div class="grid"><div class="card"><div class="muted">Ventas</div><div class="metric green">${db.sales.length}</div></div><div class="card"><div class="muted">Ingresos</div><div class="metric blue">${money(i)}</div></div><div class="card"><div class="muted">Gastos</div><div class="metric red">${money(e)}</div></div><div class="card"><div class="muted">Neto</div><div class="metric orange">${money(i-e)}</div></div></div><div class="card"><b>Servicios más realizados</b>${Object.entries(sv).map(([k,v])=>`<div class="result">${k}<b style="float:right">${v}</b></div>`).join('')}</div><div class="card"><b>Clientes frecuentes</b>${db.clients.slice().sort((a,b)=>b.visits-a.visits).map(c=>`<div class="result">${c.name} · ${c.plate}<b style="float:right">${c.visits}</b></div>`).join('')}</div>`)}
function settings(){setHTML(`<div class="title">Administración</div><div class="date">Solo Eduardo puede modificar.</div><div class="card"><b>Usuarios</b><div class="result">Eduardo · Administrador</div><div class="result">Carina · Operadora · solo registrar</div></div><div class="card"><b>Tarifario</b><table class="table"><tr><th>Servicio</th><th>Auto</th><th>Cam/SUV</th><th>XL</th></tr>${Object.entries(db.prices).map(([s,p])=>`<tr><td>${s}</td><td>${money(p.Auto)}</td><td>${money(p['Camioneta / SUV'])}</td><td>${money(p['Camioneta XL'])}</td></tr>`).join('')}</table></div><div class="card"><b>Seguridad</b><p class="muted">Correcciones: autorización de Eduardo.</p><p class="muted">Fotos de jornada: obligatorias.</p><p class="muted">Eliminación por operadora: bloqueada.</p></div>`)}
function more(){setHTML(`<div class="title">Más</div><div class="date">Módulos restantes</div><div class="card"><b>📦 Inventario</b><button class="btn alt" onclick="go('inventory')">Abrir</button></div><div class="card"><b>🕐 Jornada</b><button class="btn alt" onclick="go('journey')">Abrir</button></div><div class="card"><b>📊 Reportes</b><button class="btn alt" onclick="go('reports')">Abrir</button></div><div class="card"><b>⚙️ Administración</b><button class="btn alt" onclick="go('settings')">Abrir</button></div>`)}
document.getElementById('userLabel').textContent='Eduardo · Admin';
go('dashboard');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
