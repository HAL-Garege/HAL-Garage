<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="icon" href="assets/icon.svg">
<title>HAL Garage</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://maqnglazkhwtzskfddgc.supabase.co';

const SUPABASE_KEY = 'sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>
<style>
:root{--bg:#07111b;--panel:#0e1d2a;--line:#263b4e;--text:#f4f8fb;--muted:#91a4b7;--blue:#1595ff;--green:#49cf42;--red:#ff6262;--orange:#ffb52e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:#091722}
header{position:sticky;top:0;z-index:5;background:#091722;border-bottom:1px solid var(--line);padding:15px 16px;display:flex;justify-content:space-between}.logo{font-size:21px;font-weight:900}.logo b{color:#2ba9ff}.muted{color:var(--muted);font-size:12px}
main{padding:16px 15px 92px}.title{font-size:25px;font-weight:850;margin:2px 0}.date{color:var(--muted);font-size:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.metric{font-size:25px;font-weight:850;margin-top:4px}.green{color:var(--green)}.blue{color:#43abff}.red{color:var(--red)}.orange{color:var(--orange)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px;background:#117ff0;color:#fff;font-weight:750}.btn.alt{background:#152b3d}.btn.green{background:#32a92b}.btn.red{background:#b8323f}.btn:disabled{opacity:.4}
input,select,textarea{width:100%;background:#07131f;border:1px solid #2a4359;color:#fff;border-radius:9px;padding:11px;margin:5px 0 10px}.result{background:#102637;border:1px solid #28506c;border-radius:10px;padding:11px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.service{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#0b1824}.service.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay button{padding:11px;border:1px solid #294157;background:#0b1824;color:white;border-radius:9px}.pay button.active{border-color:var(--blue);background:#103654}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:8px 4px;border-bottom:1px solid #203244;text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;background:#183047}.ok{background:#12351a;color:#74e77b}.warn{background:#4a3507;color:#ffc04d}.bad{background:#4a151a;color:#ff7777}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#07111b;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px;z-index:6}.nav button{background:none;border:0;color:var(--muted);font-size:10px}.nav button b{display:block;font-size:18px}.nav button.active{color:#42aaff}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#183148;padding:11px 14px;border-radius:10px;display:none;z-index:10;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">HAL <b>GARAGE</b></div><div class="muted" id="userLabel">Modo demo</div></header>
<main id="app"></main>
<nav class="nav">
<button data-page="dashboard" onclick="go('dashboard')"><b>⌂</b>Inicio</button>
<button data-page="clients" onclick="go('clients')"><b>👤</b>Clientes</button>
<button data-page="sale" onclick="go('sale')"><b>＋</b>Venta</button>
<button data-page="cash" onclick="go('cash')"><b>💰</b>Caja</button>
<button data-page="more" onclick="go('more')"><b>☰</b>Más</button>
</nav></div>
<div class="toast" id="toast"></div>
<script>
  /* =====================================================
   HAL GARAGE — SISTEMA PRINCIPAL
   Supabase + Autenticación + Dashboard + Clientes
   ===================================================== */

let HAL_USER = null;
let selectedClient = null;

/* =====================================================
   UTILIDADES
   ===================================================== */

function money(n) {
  return 'S/ ' + Number(n || 0).toFixed(2);
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  if (!el) return;

  el.textContent = msg;
  el.style.display = 'block';
  el.style.padding = '12px 16px';
  el.style.position = 'fixed';
  el.style.bottom = '90px';
  el.style.left = '50%';
  el.style.transform = 'translateX(-50%)';
  el.style.zIndex = '99999';
  el.style.borderRadius = '12px';
  el.style.background = type === 'error' ? '#b42318' : '#16803c';
  el.style.color = '#fff';

  setTimeout(() => {
    el.style.display = 'none';
  }, 2500);
}

function setHTML(html) {
  const app = document.getElementById('app');
  if (app) app.innerHTML = html;
}

/* =====================================================
   LOGIN
   ===================================================== */

function showLogin() {

  const old = document.getElementById('halLogin');
  if (old) old.remove();

  document.body.insertAdjacentHTML('afterbegin', `
    <div id="halLogin"
      style="
      position:fixed;
      inset:0;
      z-index:99999;
      background:#07111b;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      box-sizing:border-box">

      <div style="
        width:100%;
        max-width:390px;
        background:#0e1d2a;
        border:1px solid #263b4d;
        border-radius:22px;
        padding:28px;
        box-sizing:border-box">

        <div style="
          text-align:center;
          font-size:30px;
          font-weight:800;
          margin-bottom:8px">

          <span style="color:white">HAL</span>
          <span style="color:#4d8dff"> GARAGE</span>

        </div>

        <div style="
          text-align:center;
          color:#8da2b5;
          margin-bottom:25px">

          Sistema de gestión

        </div>

        <input id="halEmail"
          type="email"
          placeholder="Correo electrónico"
          style="
          width:100%;
          box-sizing:border-box;
          padding:14px;
          margin-bottom:12px;
          border-radius:12px;
          border:1px solid #31495c;
          background:#07111b;
          color:white">

        <input id="halPassword"
          type="password"
          placeholder="Contraseña"
          style="
          width:100%;
          box-sizing:border-box;
          padding:14px;
          margin-bottom:15px;
          border-radius:12px;
          border:1px solid #31495c;
          background:#07111b;
          color:white">

        <button onclick="loginHAL()"
          style="
          width:100%;
          padding:14px;
          border:0;
          border-radius:12px;
          background:#2675ff;
          color:white;
          font-size:16px;
          font-weight:700">

          INGRESAR

        </button>

        <div id="halLoginMsg"
          style="
          min-height:24px;
          margin-top:15px;
          text-align:center;
          color:#ff7777">

        </div>

      </div>
    </div>
  `);
}

async function loginHAL() {

  const email =
    document.getElementById('halEmail').value.trim();

  const password =
    document.getElementById('halPassword').value;

  const msg =
    document.getElementById('halLoginMsg');

  if (!email || !password) {
    msg.textContent = 'Completa correo y contraseña.';
    return;
  }

  msg.textContent = 'Ingresando...';

  const { data, error } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    console.error(error);
    msg.textContent = 'Correo o contraseña incorrectos.';
    return;
  }

  await loadUser(data.user);
}

async function loadUser(user) {

  const { data, error } =
    await supabase
      .from('profiles')
      .select('id,full_name,role,active')
      .eq('id', user.id)
      .maybeSingle();

  if (error) {
    console.error(error);
    toast('Error cargando usuario', 'error');
    return;
  }

  if (!data) {
    toast('Perfil no configurado', 'error');
    await supabase.auth.signOut();
    return;
  }

  if (!data.active) {
    toast('Usuario desactivado', 'error');
    await supabase.auth.signOut();
    return;
  }

  HAL_USER = {
    id: user.id,
    email: user.email,
    name: data.full_name,
    role: data.role
  };

  const login = document.getElementById('halLogin');
  if (login) login.remove();

  updateUserLabel();

  go('dashboard');
}

function updateUserLabel() {

  const el = document.getElementById('userLabel');

  if (el && HAL_USER) {
    el.textContent =
      HAL_USER.name + ' · ' + HAL_USER.role;
  }
}

asyncasync function logoutHAL() {

    try {
        await supabase.auth.signOut();
    } catch (error) {
        console.error("Error cerrando sesión:", error);
    }

    HAL_USER = null;

    showLogin();
}

/* =====================================================
   DASHBOARD
   ===================================================== */

async function dashboard() {

  setHTML(`
    <div class="title">
      Dashboard
    </div>

    <div style="
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px">

      <div class="card">
        <small>Ventas de hoy</small>
        <h2 id="dashSales">S/ 0.00</h2>
      </div>

      <div class="card">
        <small>Vehículos</small>
        <h2 id="dashVehicles">0</h2>
      </div>

      <div class="card">
        <small>Gastos de hoy</small>
        <h2 id="dashExpenses">S/ 0.00</h2>
      </div>

      <div class="card">
        <small>Resultado</small>
        <h2 id="dashResult">S/ 0.00</h2>
      </div>

    </div>

    <div class="card" style="margin-top:15px">
      <h3>Accesos rápidos</h3>

      <div style="
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px">

        <button onclick="go('clients')">
          👤 Clientes
        </button>

        <button onclick="go('sale')">
          ➕ Nueva venta
        </button>

        <button onclick="go('cash')">
          💰 Caja
        </button>

        <button onclick="go('more')">
          ☰ Más
        </button>

      </div>
    </div>
  `);

  await loadDashboardData();
}

async function loadDashboardData() {

  const today =
    new Date().toISOString().slice(0,10);

  const start = today + 'T00:00:00';
  const end = today + 'T23:59:59';

  const { data: sales } =
    await supabase
      .from('sales')
      .select('total')
      .gte('created_at', start)
      .lte('created_at', end);

  const { data: expenses } =
    await supabase
      .from('expenses')
      .select('amount')
      .gte('created_at', start)
      .lte('created_at', end);

  const { count: vehicles } =
    await supabase
      .from('vehicles')
      .select('*', {
        count:'exact',
        head:true
      })
      .eq('active', true);

  const totalSales =
    (sales || []).reduce(
      (a,b) => a + Number(b.total || 0), 0
    );

  const totalExpenses =
    (expenses || []).reduce(
      (a,b) => a + Number(b.amount || 0), 0
    );

  const result =
    totalSales - totalExpenses;

  const s = document.getElementById('dashSales');
  const v = document.getElementById('dashVehicles');
  const e = document.getElementById('dashExpenses');
  const r = document.getElementById('dashResult');

  if (s) s.textContent = money(totalSales);
  if (v) v.textContent = vehicles || 0;
  if (e) e.textContent = money(totalExpenses);
  if (r) r.textContent = money(result);
}

/* =====================================================
   CLIENTES
   ===================================================== */

async function clients() {

  setHTML(`
    <div class="title">
      Clientes
    </div>

    <div style="
      display:flex;
      gap:8px;
      margin-bottom:15px">

      <input
        id="clientSearch"
        placeholder="Buscar cliente..."
        oninput="filterClients()">

      <button onclick="newClient()">
        + Nuevo
      </button>

    </div>

    <div id="clientList">
      Cargando clientes...
    </div>
  `);

  await loadClients();
}

async function loadClients() {

  const { data, error } =
    await supabase
      .from('clients')
      .select('*')
      .eq('active', true)
      .order('full_name');

  if (error) {
    console.error(error);
    toast('Error cargando clientes', 'error');
    return;
  }

  window.HAL_CLIENTS = data || [];

  renderClients(window.HAL_CLIENTS);
}

function renderClients(list) {

  const box =
    document.getElementById('clientList');

  if (!box) return;

  if (!list.length) {

    box.innerHTML = `
      <div class="card">
        No hay clientes registrados.
      </div>
    `;

    return;
  }

  box.innerHTML = list.map(c => `

    <div class="card"
      style="margin-bottom:10px">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center">

        <div>

          <strong>${escapeHTML(c.full_name)}</strong>

          <div style="opacity:.7">
            ${escapeHTML(c.phone || 'Sin teléfono')}
          </div>

        </div>

        <button onclick="selectClient('${c.id}')">
          Ver
        </button>

      </div>

    </div>

  `).join('');
}

function filterClients() {

  const q =
    document
      .getElementById('clientSearch')
      .value
      .toLowerCase();

  const list =
    (window.HAL_CLIENTS || [])
      .filter(c =>
        c.full_name.toLowerCase().includes(q) ||
        (c.phone || '').includes(q)
      );

  renderClients(list);
}

async function newClient() {

  const name =
    prompt('Nombre completo del cliente:');

  if (!name) return;

  const phone =
    prompt('Teléfono:') || null;

  const { error } =
    await supabase
      .from('clients')
      .insert({
        full_name:name.trim(),
        phone:phone,
        active:true,
        created_by:HAL_USER.id
      });

  if (error) {

    console.error(error);
    toast('No se pudo crear el cliente', 'error');
    return;
  }

  toast('Cliente registrado');

  await loadClients();
}

async function selectClient(id) {

  const { data, error } =
    await supabase
      .from('clients')
      .select('*')
      .eq('id', id)
      .single();

  if (error) {
    toast('Error cargando cliente', 'error');
    return;
  }

  selectedClient = data;

  setHTML(`
    <div class="title">
      Cliente
    </div>

    <div class="card">

      <h2>
        ${escapeHTML(data.full_name)}
      </h2>

      <p>
        📞 ${escapeHTML(data.phone || 'Sin teléfono')}
      </p>

      <button onclick="loadClientVehicles('${data.id}')">
        🚗 Ver vehículos
      </button>

      <button onclick="go('clients')">
        ← Volver
      </button>

    </div>

    <div id="clientVehicles"></div>
  `);

  await loadClientVehicles(data.id);
}

async function loadClientVehicles(clientId) {

  const box =
    document.getElementById('clientVehicles');

  if (!box) return;

  const { data, error } =
    await supabase
      .from('vehicles')
      .select('*')
      .eq('client_id', clientId)
      .eq('active', true)
      .order('plate');

  if (error) {
    console.error(error);
    box.innerHTML =
      '<div class="card">Error cargando vehículos.</div>';
    return;
  }

  box.innerHTML = `

    <div class="card">

      <h3>Vehículos</h3>

      ${
        data.length
        ? data.map(v => `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #263b4d">

            <strong>
              🚗 ${escapeHTML(v.plate)}
            </strong>

            <div style="opacity:.7">
              ${escapeHTML(v.brand || '')}
              ${escapeHTML(v.model || '')}
            </div>

          </div>
        `).join('')
        : '<p>No tiene vehículos registrados.</p>'
      }

    </div>
  `;
}

/* =====================================================
   NAVEGACIÓN
   ===================================================== */

function go(page) {

  document
    .querySelectorAll('.nav button')
    .forEach(b => b.classList.remove('active'));

  const button =
    document.querySelector(
      `.nav button[data-page="${page}"]`
    );

  if (button) button.classList.add('active');

  if (page === 'dashboard') dashboard();
  else if (page === 'clients') clients();
  else if (page === 'sale') sale();
  else if (page === 'cash') cash();
  else if (page === 'more') more();
  else dashboard();
}

/* =====================================================
   PANTALLAS TEMPORALES
   Las convertiremos en módulos completos en el
   siguiente bloque.
   ===================================================== */

function sale() {

  setHTML(`
    <div class="title">Nueva venta</div>

    <div class="card">

      <h3>Módulo de ventas</h3>

      <p>
        Aquí conectaremos clientes,
        vehículos, servicios, precios
        y pagos directamente con Supabase.
      </p>

      <button onclick="go('clients')">
        👤 Seleccionar cliente
      </button>

    </div>
  `);
}

function cash() {

  setHTML(`
    <div class="title">Caja</div>

    <div class="card">

      <h3>Control de caja</h3>

      <p>
        Aquí mostraremos ingresos,
        egresos y saldo real.
      </p>

    </div>
  `);
}

function more() {

  setHTML(`
    <div class="title">Más</div>

    <div class="card">

      <button onclick="go('dashboard')">
        🏠 Inicio
      </button>

      <button onclick="logoutHAL()">
        🚪 Cerrar sesión
      </button>

    </div>
  `);
}

/* =====================================================
   SEGURIDAD
   ===================================================== */

function escapeHTML(value) {

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

/* =====================================================
   INICIO
   ===================================================== */

async function iniciarHAL() {

  const {
    data: { session }
  } = await supabase.auth.getSession();

  if (session?.user) {

    await loadUser(session.user);

  } else {

    showLogin();

  }
}

supabase.auth.onAuthStateChange(
  async (event, session) => {

    if (
      event === 'SIGNED_IN' &&
      session?.user
    ) {

      await loadUser(session.user);

    }

    if (event === 'SIGNED_OUT') {

      HAL_USER = null;
      showLogin();

    }

  }
);

iniciarHAL();
</script>
</body></html>
