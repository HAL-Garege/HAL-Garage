<body>
<div class="app">

<main id="app"></main>
<nav class="nav">

<div class="toast" id="toast"></div>
<script>
  /* =====================================================
   HAL GARAGE — SISTEMA PRINCIPAL
   Supabase + Autenticación + Dashboard + Clientes
   ===================================================== */

let HAL_USER = null;
let selectedClient = null;

/* =====================================================
   UTILIDADES
   ===================================================== */

function money(n) {
  return 'S/ ' + Number(n || 0).toFixed(2);
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  if (!el) return;

  el.textContent = msg;
  el.style.display = 'block';
  el.style.padding = '12px 16px';
  el.style.position = 'fixed';
  el.style.bottom = '90px';
  el.style.left = '50%';
  el.style.transform = 'translateX(-50%)';
  el.style.zIndex = '99999';
  el.style.borderRadius = '12px';
  el.style.background = type === 'error' ? '#b42318' : '#16803c';
  el.style.color = '#fff';

  setTimeout(() => {
    el.style.display = 'none';
  }, 2500);
}

function setHTML(html) {
  const app = document.getElementById('app');
  if (app) app.innerHTML = html;
}

/* =====================================================
   LOGIN
   ===================================================== */

function showLogin() {

  const old = document.getElementById('halLogin');
  if (old) old.remove();

  document.body.insertAdjacentHTML('afterbegin', `
    <div id="halLogin"
      style="
      position:fixed;
      inset:0;
      z-index:99999;
      background:#07111b;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      box-sizing:border-box">

      <div style="
        width:100%;
        max-width:390px;
        background:#0e1d2a;
        border:1px solid #263b4d;
        border-radius:22px;
        padding:28px;
        box-sizing:border-box">

        <div style="
          text-align:center;
          font-size:30px;
          font-weight:800;
          margin-bottom:8px">

          <span style="color:white">HAL</span>
          <span style="color:#4d8dff"> GARAGE</span>

        </div>

        <div style="
          text-align:center;
          color:#8da2b5;
          margin-bottom:25px">

          Sistema de gestión

        </div>

        <input id="halEmail"
          type="email"
          placeholder="Correo electrónico"
          style="
          width:100%;
          box-sizing:border-box;
          padding:14px;
          margin-bottom:12px;
          border-radius:12px;
          border:1px solid #31495c;
          background:#07111b;
          color:white">

        <input id="halPassword"
          type="password"
          placeholder="Contraseña"
          style="
          width:100%;
          box-sizing:border-box;
          padding:14px;
          margin-bottom:15px;
          border-radius:12px;
          border:1px solid #31495c;
          background:#07111b;
          color:white">

        <button onclick="loginHAL()"
          style="
          width:100%;
          padding:14px;
          border:0;
          border-radius:12px;
          background:#2675ff;
          color:white;
          font-size:16px;
          font-weight:700">

          INGRESAR

        </button>

        <div id="halLoginMsg"
          style="
          min-height:24px;
          margin-top:15px;
          text-align:center;
          color:#ff7777">

        </div>

      </div>
    </div>
  `);
}

async function loginHAL() {

  const email =
    document.getElementById('halEmail').value.trim();

  const password =
    document.getElementById('halPassword').value;

  const msg =
    document.getElementById('halLoginMsg');

  if (!email || !password) {
    msg.textContent = 'Completa correo y contraseña.';
    return;
  }

  msg.textContent = 'Ingresando...';
  const btn=document.querySelector('#halLogin button');
  if(btn) { btn.disabled=true; btn.textContent='CONECTANDO...'; }

  let result;
  try {
    result = await withTimeout(supabase.auth.signInWithPassword({email,password}),12000);
  } catch (e) {
    console.error(e);
    msg.textContent = e.message || 'No se pudo conectar con el servidor.';
    if(btn){btn.disabled=false;btn.textContent='INGRESAR';}
    return;
  }
  const { data, error } = result;

  if (error) {
    console.error(error);
    msg.textContent = error.message || 'Correo o contraseña incorrectos.';
    if(btn){btn.disabled=false;btn.textContent='INGRESAR';}
    return;
  }

  await loadUser(data.user);
}

async function loadUser(user) {

  let result;
  try {
    result = await withTimeout(supabase.from('profiles').select('id,full_name,role,active').eq('id', user.id).maybeSingle(),10000);
  } catch(e) {
    console.error(e); toast('No se pudo cargar tu perfil: '+e.message,'error'); return;
  }
  const { data, error } = result;

  if (error) {
    console.error(error);
    toast('Error cargando usuario', 'error');
    return;
  }

  if (!data) {
    toast('Perfil no configurado', 'error');
    await supabase.auth.signOut();
    return;
  }

  if (!data.active) {
    toast('Usuario desactivado', 'error');
    await supabase.auth.signOut();
    return;
  }

  HAL_USER = {
    id: user.id,
    email: user.email,
    name: data.full_name,
    role: data.role
  };

  const login = document.getElementById('halLogin');
  if (login) login.remove();

  updateUserLabel();

  go('dashboard');
}

function updateUserLabel() {

  const el = document.getElementById('userLabel');

  if (el && HAL_USER) {
    el.textContent =
      HAL_USER.name + ' · ' + HAL_USER.role;
  }
}

async function logoutHAL() {
  try { await supabase.auth.signOut(); } catch (e) { console.error(e); }
  HAL_USER = null;
  showLogin();
}

/* =====================================================
   DASHBOARD
   ===================================================== */

async function dashboard() {
  if (!requireUser()) return;

  setHTML(`
    <div class="title">
      Dashboard
    </div>

    <div style="
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px">

      <div class="card">
        <small>Ventas de hoy</small>
        <h2 id="dashSales">S/ 0.00</h2>
      </div>

      <div class="card">
        <small>Vehículos</small>
        <h2 id="dashVehicles">0</h2>
      </div>

      <div class="card">
        <small>Gastos de hoy</small>
        <h2 id="dashExpenses">S/ 0.00</h2>
      </div>

      <div class="card">
        <small>Resultado</small>
        <h2 id="dashResult">S/ 0.00</h2>
      </div>

    </div>

    <div class="card" style="margin-top:15px">
      <h3>Accesos rápidos</h3>

      <div style="
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px">

        <button onclick="go('clients')">
          👤 Clientes
        </button>

        <button onclick="go('sale')">
          ➕ Nueva venta
        </button>

        <button onclick="go('cash')">
          💰 Caja
        </button>

        <button onclick="go('attendance')">
          👷 Personal
        </button>

        <button onclick="go('more')">
          ☰ Más
        </button>

      </div>
    </div>
  `);

  await loadDashboardData();
}

async function loadDashboardData() {

  const today =
    new Date().toISOString().slice(0,10);

  const start = today + 'T00:00:00';
  const end = today + 'T23:59:59';

  const { data: sales } =
    await supabase
      .from('sales')
      .select('total')
      .gte('created_at', start)
      .lte('created_at', end);

  const { data: expenses } =
    await supabase
      .from('expenses')
      .select('amount')
      .gte('created_at', start)
      .lte('created_at', end);

  const { count: vehicles } =
    await supabase
      .from('vehicles')
      .select('*', {
        count:'exact',
        head:true
      })
      .eq('active', true);

  const totalSales =
    (sales || []).reduce(
      (a,b) => a + Number(b.total || 0), 0
    );

  const totalExpenses =
    (expenses || []).reduce(
      (a,b) => a + Number(b.amount || 0), 0
    );

  const result =
    totalSales - totalExpenses;

  const s = document.getElementById('dashSales');
  const v = document.getElementById('dashVehicles');
  const e = document.getElementById('dashExpenses');
  const r = document.getElementById('dashResult');

  if (s) s.textContent = money(totalSales);
  if (v) v.textContent = vehicles || 0;
  if (e) e.textContent = money(totalExpenses);
  if (r) r.textContent = money(result);
}

/* =====================================================
   CLIENTES
   ===================================================== */

async function clients() {
  if (!requireUser()) return;

  setHTML(`
    <div class="title">
      Clientes
    </div>

    <div style="
      display:flex;
      gap:8px;
      margin-bottom:15px">

      <input
        id="clientSearch"
        placeholder="Buscar cliente..."
        oninput="filterClients()">

      <button onclick="newClient()">
        + Nuevo
      </button>

    </div>

    <div id="clientList">
      Cargando clientes...
    </div>
  `);

  await loadClients();
}

async function loadClients() {

  const { data, error } =
    await supabase
      .from('clients')
      .select('*')
      .eq('active', true)
      .order('full_name');

  if (error) {
    console.error(error);
    const box=document.getElementById('clientList');
    if(box) box.innerHTML='<div class="errorbox"><b>No se pudieron cargar los clientes.</b><br>'+escapeHTML(error.message)+'</div>';
    toast('Error cargando clientes: '+error.message, 'error');
    return;
  }

  window.HAL_CLIENTS = data || [];

  renderClients(window.HAL_CLIENTS);
}

function renderClients(list) {

  const box =
    document.getElementById('clientList');

  if (!box) return;

  if (!list.length) {

    box.innerHTML = `
      <div class="card">
        No hay clientes registrados.
      </div>
    `;

    return;
  }

  box.innerHTML = list.map(c => `

    <div class="card"
      style="margin-bottom:10px">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center">

        <div>

          <strong>${escapeHTML(c.full_name)}</strong>

          <div style="opacity:.7">
            ${escapeHTML(c.phone || 'Sin teléfono')}
          </div>

        </div>

        <button onclick="selectClient('${c.id}')">
          Ver
        </button>

      </div>

    </div>

  `).join('');
}

function filterClients() {

  const q =
    document
      .getElementById('clientSearch')
      .value
      .toLowerCase();

  const list =
    (window.HAL_CLIENTS || [])
      .filter(c =>
        c.full_name.toLowerCase().includes(q) ||
        (c.phone || '').includes(q)
      );

  renderClients(list);
}

async function newClient() {
  if (!requireUser()) return;

  const name =
    prompt('Nombre completo del cliente:');

  if (!name) return;

  const phone =
    prompt('Teléfono:') || null;

  const { error } =
    await supabase
      .from('clients')
      .insert({
        full_name:name.trim(),
        phone:phone,
        active:true,
        created_by:HAL_USER.id
      });

  if (error) {

    console.error(error);
    toast('No se pudo crear el cliente', 'error');
    return;
  }

  toast('Cliente registrado');

  await loadClients();
}

async function selectClient(id) {

  const { data, error } =
    await supabase
      .from('clients')
      .select('*')
      .eq('id', id)
      .single();

  if (error) {
    toast('Error cargando cliente', 'error');
    return;
  }

  selectedClient = data;

  setHTML(`
    <div class="title">
      Cliente
    </div>

    <div class="card">

      <h2>
        ${escapeHTML(data.full_name)}
      </h2>

      <p>
        📞 ${escapeHTML(data.phone || 'Sin teléfono')}
      </p>

      <button onclick="loadClientVehicles('${data.id}')">
        🚗 Ver vehículos
      </button>

      <button onclick="go('clients')">
        ← Volver
      </button>

    </div>

    <div id="clientVehicles"></div>
  `);

  await loadClientVehicles(data.id);
}

async function loadClientVehicles(clientId) {

  const box =
    document.getElementById('clientVehicles');

  if (!box) return;

  const { data, error } =
    await supabase
      .from('vehicles')
      .select('*')
      .eq('client_id', clientId)
      .eq('active', true)
      .order('plate');

  if (error) {
    console.error(error);
    box.innerHTML =
      '<div class="card">Error cargando vehículos.</div>';
    return;
  }

  box.innerHTML = `

    <div class="card">

      <h3>Vehículos</h3>

      ${
        data.length
        ? data.map(v => `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #263b4d">

            <strong>
              🚗 ${escapeHTML(v.plate)}
            </strong>

            <div style="opacity:.7">
              ${escapeHTML(v.brand || '')}
              ${escapeHTML(v.model || '')}
            </div>

          </div>
        `).join('')
        : '<p>No tiene vehículos registrados.</p>'
      }

    </div>
  `;
}

/* =====================================================
   NAVEGACIÓN
   ===================================================== */

function go(page) {

  document
    .querySelectorAll('.nav button')
    .forEach(b => b.classList.remove('active'));

  const button =
    document.querySelector(
      `.nav button[data-page="${page}"]`
    );

  if (button) button.classList.add('active');

  if (page === 'dashboard') dashboard();
  else if (page === 'clients') clients();
  else if (page === 'sale') sale();
  else if (page === 'cash') cash();
  else if (page === 'attendance') attendance();
  else if (page === 'more') more();
  else dashboard();
}

/* =====================================================
   PANTALLAS TEMPORALES
   Las convertiremos en módulos completos en el
   siguiente bloque.
   ===================================================== */

async function sale() {
  if (!requireUser()) return;

  setHTML(`
    <div class="title">Nueva atención</div>
    <div class="date">Registra el servicio y el pago en un solo paso.</div>

    <div class="card">
      <h3>1. Cliente</h3>
      <input id="saleClientSearch" placeholder="Buscar por nombre o teléfono" oninput="filterSaleClients()">
      <div id="saleClientResults"></div>
      <div id="saleSelectedClient"></div>
    </div>

    <div class="card" id="saleVehicleCard" style="display:none">
      <h3>2. Vehículo</h3>
      <div id="saleVehicleList">Cargando vehículos...</div>
    </div>

    <div class="card" id="saleServiceCard" style="display:none">
      <h3>3. Servicio</h3>
      <div id="saleServiceList">Cargando servicios...</div>
      <div class="row" style="margin-top:14px"><strong>Total</strong><strong id="saleTotal">S/ 0.00</strong></div>
    </div>

    <div class="card" id="salePaymentCard" style="display:none">
      <h3>4. Pago</h3>
      <div class="pay">
        <button id="pay_cash" onclick="selectSalePayment('cash')">💵 Efectivo</button>
        <button id="pay_yape" onclick="selectSalePayment('yape')">📱 Yape</button>
        <button id="pay_plin" onclick="selectSalePayment('plin')">📱 Plin</button>
        <button id="pay_transfer" onclick="selectSalePayment('transfer')">🏦 Transferencia</button>
      </div>
      <button class="btn green" id="finishSaleBtn" onclick="finishSale()" disabled>✅ FINALIZAR ATENCIÓN</button>
    </div>
  `);

  window.HAL_SALE = {client:null, vehicle:null, service:null, payment:null, services:[]};
  await loadSaleClients();
}

async function loadSaleClients() {
  const { data, error } = await supabase
    .from('clients')
    .select('id,full_name,phone')
    .eq('active', true)
    .order('full_name');
  if (error) { console.error(error); toast('Error cargando clientes','error'); return; }
  window.HAL_SALE_CLIENTS = data || [];
  filterSaleClients();
}

function filterSaleClients() {
  const q = (document.getElementById('saleClientSearch')?.value || '').toLowerCase().trim();
  const list = (window.HAL_SALE_CLIENTS || []).filter(c =>
    !q || c.full_name.toLowerCase().includes(q) || (c.phone || '').includes(q)
  ).slice(0, 20);
  const box = document.getElementById('saleClientResults');
  if (!box) return;
  box.innerHTML = list.length ? list.map(c => `
    <div class="result" onclick="chooseSaleClient('${c.id}')" style="cursor:pointer">
      <strong>${escapeHTML(c.full_name)}</strong><div style="opacity:.7">${escapeHTML(c.phone || 'Sin teléfono')}</div>
    </div>`).join('') : '<div class="muted">No se encontraron clientes.</div>';
}

async function chooseSaleClient(id) {
  const client = (window.HAL_SALE_CLIENTS || []).find(c => c.id === id);
  if (!client) return;
  window.HAL_SALE.client = client;
  const results = document.getElementById('saleClientResults');
  if (results) results.innerHTML = '';
  const search = document.getElementById('saleClientSearch');
  if (search) search.value = '';
  document.getElementById('saleSelectedClient').innerHTML = `
    <div class="result"><div class="row"><div><strong>👤 ${escapeHTML(client.full_name)}</strong><div>${escapeHTML(client.phone || 'Sin teléfono')}</div></div><button onclick="clearSaleClient()">Cambiar</button></div></div>`;
  document.getElementById('saleVehicleCard').style.display = 'block';
  await loadSaleVehicles(client.id);
}

function clearSaleClient() {
  window.HAL_SALE = {client:null, vehicle:null, service:null, payment:null, services:[]};
  const selected = document.getElementById('saleSelectedClient'); if (selected) selected.innerHTML = '';
  document.getElementById('saleVehicleCard').style.display = 'none';
  document.getElementById('saleServiceCard').style.display = 'none';
  document.getElementById('salePaymentCard').style.display = 'none';
  filterSaleClients();
}

async function loadSaleVehicles(clientId) {
  const box = document.getElementById('saleVehicleList');
  const { data, error } = await supabase
    .from('vehicles')
    .select('id,plate,brand,model,vehicle_type_id,vehicle_types(name)')
    .eq('client_id', clientId)
    .eq('active', true)
    .order('plate');
  if (error) { console.error(error); box.innerHTML='<div class="muted">Error cargando vehículos.</div>'; return; }
  if (!data?.length) {
    box.innerHTML = '<div class="muted">Este cliente no tiene vehículos registrados todavía.</div><button class="btn" onclick="go(\'clients\')">Ir a Clientes para registrar vehículo</button>';
    return;
  }
  box.innerHTML = data.map(v => `
    <div class="service" id="saleVehicle_${v.id}" onclick="chooseSaleVehicle('${v.id}')" style="cursor:pointer">
      <div><strong>🚗 ${escapeHTML(v.plate)}</strong><div style="opacity:.7">${escapeHTML(v.brand || '')} ${escapeHTML(v.model || '')}</div></div>
      <span class="badge">${escapeHTML(v.vehicle_types?.name || 'Vehículo')}</span>
    </div>`).join('');
  window.HAL_SALE_VEHICLES = data;
}

async function chooseSaleVehicle(id) {
  const vehicle = (window.HAL_SALE_VEHICLES || []).find(v => v.id === id);
  if (!vehicle) return;
  window.HAL_SALE.vehicle = vehicle;
  document.querySelectorAll('[id^="saleVehicle_"]').forEach(el => el.classList.remove('active'));
  document.getElementById('saleVehicle_' + id)?.classList.add('active');
  document.getElementById('saleServiceCard').style.display = 'block';
  document.getElementById('salePaymentCard').style.display = 'block';
  await loadSaleServices(vehicle.vehicle_type_id);
  updateSaleReady();
}

async function loadSaleServices(vehicleTypeId) {
  const box = document.getElementById('saleServiceList');
  const { data, error } = await supabase
    .from('service_prices')
    .select('id,service_id,vehicle_type_id,price,services(id,name,description)')
    .eq('vehicle_type_id', vehicleTypeId)
    .eq('active', true);
  if (error) { console.error(error); box.innerHTML='<div class="muted">Error cargando precios.</div>'; return; }
  const services = (data || []).filter(x => x.services?.active !== false);
  window.HAL_SALE.services = services;
  if (!services.length) {
    box.innerHTML = '<div class="card" style="margin-top:0">No hay precios configurados para este tipo de vehículo. Configura <b>service_prices</b> en Supabase antes de vender.</div>';
    return;
  }
  box.innerHTML = services.map(x => `
    <div class="service" id="saleService_${x.service_id}" onclick="chooseSaleService('${x.service_id}')" style="cursor:pointer">
      <div><strong>${escapeHTML(x.services.name)}</strong><div style="opacity:.7">${escapeHTML(x.services.description || '')}</div></div>
      <strong>${money(x.price)}</strong>
    </div>`).join('');
}

function chooseSaleService(serviceId) {
  const service = (window.HAL_SALE.services || []).find(x => x.service_id === serviceId);
  if (!service) return;
  window.HAL_SALE.service = service;
  document.querySelectorAll('[id^="saleService_"]').forEach(el => el.classList.remove('active'));
  document.getElementById('saleService_' + serviceId)?.classList.add('active');
  const total = document.getElementById('saleTotal'); if (total) total.textContent = money(service.price);
  updateSaleReady();
}

function selectSalePayment(method) {
  window.HAL_SALE.payment = method;
  document.querySelectorAll('[id^="pay_"]').forEach(el => el.classList.remove('active'));
  document.getElementById('pay_' + method)?.classList.add('active');
  updateSaleReady();
}

function updateSaleReady() {
  const b = document.getElementById('finishSaleBtn');
  if (b) b.disabled = !(window.HAL_SALE?.client && window.HAL_SALE?.vehicle && window.HAL_SALE?.service && window.HAL_SALE?.payment);
}

async function finishSale() {
  const s = window.HAL_SALE;
  if (!s?.client || !s.vehicle || !s.service || !s.payment || !HAL_USER) return;
  const btn = document.getElementById('finishSaleBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }
  const total = Number(s.service.price);
  try {
    const { data: sale, error: saleError } = await supabase.from('sales').insert({
      client_id:s.client.id,
      vehicle_id:s.vehicle.id,
      total,
      status:'confirmed',
      created_by:HAL_USER.id
    }).select('id,sale_number').single();
    if (saleError) throw saleError;

    const { error: itemError } = await supabase.from('sale_items').insert({
      sale_id:sale.id,
      service_id:s.service.service_id,
      vehicle_type_id:s.vehicle.vehicle_type_id,
      service_name_snapshot:s.service.services.name,
      price_applied:total,
      quantity:1,
      subtotal:total
    });
    if (itemError) throw itemError;

    const { error: paymentError } = await supabase.from('payments').insert({
      sale_id:sale.id,
      method:s.payment,
      amount:total,
      created_by:HAL_USER.id
    });
    if (paymentError) throw paymentError;

    const { error: cashError } = await supabase.from('cash_movements').insert({
      movement_type:'income',
      payment_method:s.payment,
      amount:total,
      sale_id:sale.id,
      created_by:HAL_USER.id
    });
    if (cashError) throw cashError;

    toast('Atención registrada correctamente');
    setHTML(`<div class="title">✅ Atención registrada</div><div class="card"><h2>${money(total)}</h2><p>Venta N.º ${escapeHTML(sale.sale_number)}</p><p>Cliente: ${escapeHTML(s.client.full_name)}</p><p>Placa: ${escapeHTML(s.vehicle.plate)}</p><p>Servicio: ${escapeHTML(s.service.services.name)}</p><p>Pago: ${escapeHTML(s.payment)}</p><button class="btn green" onclick="go('sale')">➕ Nueva atención</button><button class="btn alt" onclick="go('dashboard')">🏠 Ir al inicio</button></div>`);
  } catch (err) {
    console.error(err);
    toast('No se pudo registrar la atención. Revisa los permisos RLS.','error');
    if (btn) { btn.disabled = false; btn.textContent = '✅ FINALIZAR ATENCIÓN'; }
  }
}

async function cash() {
  if (!requireUser()) return;
  setHTML(`<div class="title">Caja</div><div class="date">Ingresos, egresos y saldo real</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card"><small>Ingresos</small><h2 id="cashIncome">S/ 0.00</h2></div><div class="card"><small>Egresos</small><h2 id="cashExpense">S/ 0.00</h2></div></div>
  <div class="card"><small>Saldo actual</small><h2 class="green" id="cashBalance">S/ 0.00</h2></div>
  <button class="btn red" onclick="newExpense()">➖ Registrar egreso</button>
  <div class="card"><h3>Últimos movimientos</h3><div id="cashList">Cargando...</div></div>`);
  await loadCash();
}
async function loadCash(){
  const box=document.getElementById('cashList');
  const {data,error}=await supabase.from('cash_movements').select('id,movement_type,payment_method,amount,created_at').order('created_at',{ascending:false}).limit(100);
  if(error){box.innerHTML='Error: '+escapeHTML(error.message);return;}
  let income=0,expense=0;(data||[]).forEach(x=>x.movement_type==='income'?income+=Number(x.amount||0):expense+=Number(x.amount||0));
  document.getElementById('cashIncome').textContent=money(income);document.getElementById('cashExpense').textContent=money(expense);document.getElementById('cashBalance').textContent=money(income-expense);
  box.innerHTML=(data||[]).map(x=>`<div class="result"><div class="row"><strong>${x.movement_type==='income'?'🟢 Ingreso':'🔴 Egreso'}</strong><strong>${money(x.amount)}</strong></div><div class="muted">${escapeHTML(x.payment_method||'')} · ${new Date(x.created_at).toLocaleString('es-PE')}</div></div>`).join('')||'<div class="muted">Sin movimientos.</div>';
}
function newExpense(){const concept=prompt('Concepto del egreso:');if(!concept)return;const amount=Number(prompt('Monto en soles:'));if(!amount||amount<=0){toast('Monto inválido','error');return;}const method=(prompt('Forma de pago: cash / yape / plin / transfer','cash')||'cash').trim().toLowerCase();saveExpense(concept.trim(),amount,method)}
async function saveExpense(concept,amount,method){
  const {data,error}=await supabase.from('expenses').insert({concept,category:'General',amount,payment_method:method,created_by:HAL_USER.id}).select('id').single();
  if(error){toast('No se pudo registrar el egreso: '+error.message,'error');return;}
  const {error:ce}=await supabase.from('cash_movements').insert({movement_type:'expense',payment_method:method,amount,expense_id:data.id,created_by:HAL_USER.id});
  if(ce){toast('Egreso guardado, pero caja devolvió error: '+ce.message,'error');return;}toast('Egreso registrado');await loadCash();
}

/* =====================================================
   PERSONAL / ASISTENCIA
   ===================================================== */
function isAdmin(){return ['admin','administrator','administrador','manager','gerente'].includes(String(HAL_USER?.role||'').toLowerCase())}
async function attendance(){
  if (!requireUser()) return;
  setHTML(`<div class="title">Personal</div><div class="date">Asistencia con foto y hora automática</div>
  <div class="card"><h3>Mi jornada de hoy</h3><div id="myAttendance">Cargando...</div><div id="attendanceActions"></div></div>
  ${isAdmin()?'<div class="card"><h3>Personal activo</h3><div id="staffList">Cargando...</div></div><div class="card"><h3>Marcaciones de hoy</h3><div id="staffAttendance">Cargando...</div></div>':''}`);
  await renderMyAttendance();if(isAdmin())await renderStaffAttendance();
}
async function getTodayWorkday(userId){const {data,error}=await supabase.from('workdays').select('*').eq('operator_id',userId).eq('work_date',new Date().toISOString().slice(0,10)).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error)console.error(error);return data}
async function getWorkdayEvents(id){const {data,error}=await supabase.from('workday_events').select('*').eq('workday_id',id).order('occurred_at');if(error)console.error(error);return data||[]}
function nextEvent(events){const t=(events||[]).map(e=>e.event_type);if(!t.includes('open'))return'open';if(!t.includes('lunch'))return'lunch';if(!t.includes('return'))return'return';if(!t.includes('close'))return'close';return null}
async function renderMyAttendance(){
  const box=document.getElementById('myAttendance'),actions=document.getElementById('attendanceActions');if(!box)return;const wd=await getTodayWorkday(HAL_USER.id);
  if(!wd){box.innerHTML='<span class="badge warn">Sin entrada registrada</span>';actions.innerHTML='<button class="btn green" onclick="markAttendance(\'entry\')">📸 MARCAR ENTRADA</button>';return;}
  const ev=await getWorkdayEvents(wd.id),labels={open:'🟢 Entrada',lunch:'🍽️ Inicio refrigerio',return:'🔄 Fin refrigerio',close:'🔴 Salida'};
  box.innerHTML=ev.map(e=>`<div class="result"><div class="row"><strong>${labels[e.event_type]||e.event_type}</strong><span>${new Date(e.occurred_at).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="muted">${e.photo_path?'📷 Foto registrada':'Sin foto'}</div></div>`).join('');
  const n=nextEvent(ev),lab={lunch:'🍽️ INICIAR REFRIGERIO',return:'🔄 TERMINAR REFRIGERIO',close:'📸 MARCAR SALIDA'};actions.innerHTML=n?`<button class="btn ${n==='close'?'red':'green'}" onclick="markAttendance('${n}')">${lab[n]}</button>`:'<span class="badge ok">Jornada completa</span>';
}
async function takeAttendancePhoto(){return new Promise(resolve=>{const input=document.createElement('input');input.type='file';input.accept='image/*';input.capture='user';input.onchange=()=>{const file=input.files?.[0];if(!file){resolve(null);return;}const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=720,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.src=url};input.click()})}
async function markAttendance(type){
  if(!requireUser())return;const photo=await takeAttendancePhoto();if(!photo){toast('La foto es obligatoria','error');return;}let wd=await getTodayWorkday(HAL_USER.id);
  if(type==='open'&&!wd){const {data,error}=await supabase.from('workdays').insert({operator_id:HAL_USER.id,work_date:new Date().toISOString().slice(0,10),status:'open'}).select('id').single();if(error){toast('No se pudo abrir la jornada: '+error.message,'error');return;}wd=data;}
  if(!wd){toast('No existe jornada para esta marcación','error');return;}
  const {error}=await supabase.from('workday_events').insert({workday_id:wd.id,event_type:type,occurred_at:new Date().toISOString(),photo_path:photo,created_by:HAL_USER.id});
  if(error){toast('No se pudo guardar: '+error.message,'error');return;}if(type==='close')await supabase.from('workdays').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',wd.id);
  toast(type==='open'?'Entrada registrada':type==='close'?'Salida registrada':'Marcación registrada');await renderMyAttendance();
}
async function renderStaffAttendance(){
  const staff=document.getElementById('staffList'),today=document.getElementById('staffAttendance');if(!staff)return;
  const {data:profiles,error}=await supabase.from('profiles').select('id,full_name,role,active').eq('active',true).order('full_name');if(error){staff.innerHTML=escapeHTML(error.message);return;}
  staff.innerHTML=(profiles||[]).map(p=>`<div class="result"><strong>👷 ${escapeHTML(p.full_name)}</strong><div class="muted">${escapeHTML(p.role||'')}</div></div>`).join('')||'<div class="muted">Sin personal activo.</div>';
  const {data:wd,error:we}=await supabase.from('workdays').select('id,operator_id,status,created_at,closed_at,profiles(full_name)').eq('work_date',new Date().toISOString().slice(0,10)).order('created_at');if(we){today.innerHTML=escapeHTML(we.message);return;}
  today.innerHTML=(wd||[]).map(w=>`<div class="result"><div class="row"><strong>${escapeHTML(w.profiles?.full_name||'Personal')}</strong><span class="badge ${w.status==='closed'?'ok':'warn'}">${escapeHTML(w.status)}</span></div><div class="muted">Inicio: ${new Date(w.created_at).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}${w.closed_at?' · Salida: '+new Date(w.closed_at).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}):''}</div></div>`).join('')||'<div class="muted">Nadie ha marcado hoy.</div>';
}

function more(){setHTML(`<div class="title">Más</div><div class="card"><button onclick="go('dashboard')">🏠 Inicio</button><button onclick="go('attendance')">👷 Personal / Asistencia</button><button onclick="go('cash')">💰 Caja</button><button onclick="logoutHAL()">🚪 Cerrar sesión</button></div>`)}

/* =====================================================
   SEGURIDAD
   ===================================================== */

function escapeHTML(value) {

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

/* =====================================================
   INICIO
   ===================================================== */

async function iniciarHAL() {

  const {
    data: { session }
  } = await supabase.auth.getSession();

  if (session?.user) {

    await loadUser(session.user);

  } else {

    showLogin();

  }
}

supabase.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session?.user && !HAL_USER) await loadUser(session.user);
  if (event === 'SIGNED_OUT') { HAL_USER = null; showLogin(); }
});

iniciarHAL();
</script>
