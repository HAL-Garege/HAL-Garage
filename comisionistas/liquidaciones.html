<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111b"><title>HAL Garage · Liquidaciones</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#07111b;--panel:#0e1d2a;--line:#263b4e;--text:#f4f8fb;--muted:#91a4b7;--blue:#1595ff;--green:#49cf42;--orange:#ffb52e;--red:#ff6262}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:40px}header{padding:15px 16px;background:#091722;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.logo{font-size:21px;font-weight:900}.logo b{color:#2ba9ff}.wrap{padding:16px}.title{font-size:28px;font-weight:900}.muted{color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:24px;font-weight:900;margin-top:5px}.orange{color:var(--orange)}.green{color:var(--green)}select,input,button{font:inherit}select,input{width:100%;background:#07131f;border:1px solid #2a4359;color:#fff;border-radius:9px;padding:10px;margin:5px 0 9px}.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;padding:10px 13px;margin-top:8px}.btn.green{background:#32a92b}.btn.alt{background:#152b3d}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{padding:4px 8px;border-radius:99px;background:#183047;font-size:10px}.pending{border-left:4px solid var(--orange)}.paid{border-left:4px solid var(--green)}.error{color:#ff9999;font-size:12px}.success{color:#74e77b;font-size:12px}</style></head><body><div class="app"><header><div class="logo">HAL <b>GARAGE</b> · Liquidaciones</div><div class="muted">Administración</div></header><main class="wrap"><a href="./admin.html" style="color:#8dccff;text-decoration:none;font-size:12px">← Volver a Comisionistas</a><div class="title">💵 Liquidaciones</div><div class="muted">Consulta comisiones pendientes y registra pagos.</div><div class="card"><label>Comisionista</label><select id="agent"><option value="">Todos</option></select></div><div class="grid"><div class="card"><div class="muted">Pendiente</div><div class="metric orange" id="pending">S/ 0.00</div></div><div class="card"><div class="muted">Pagado</div><div class="metric green" id="paid">S/ 0.00</div></div></div><div id="list"></div></main></div><script>const U='https://maqnglazkhwtzskfddgc.supabase.co',K='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';const db=supabase.createClient(U,K);let agents=[];const $=id=>document.getElementById(id),money=n=>'S/ '+Number(n||0).toFixed(2);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function loadAgents(){const {data,error}=await db.from('commissioners').select('id,full_name,access_code').order('full_name');if(error){$('list').innerHTML='<div class="error">'+esc(error.message)+'</div>';return}agents=data||[];$('agent').innerHTML='<option value="">Todos</option>'+agents.map(a=>'<option value="'+a.id+'">'+esc(a.full_name)+' · '+esc(a.access_code)+'</option>').join('');await load()}async function load(){const aid=$('agent').value;let q=db.from('commissioner_earnings').select('id,commissioner_id,sale_id,visit_type,amount,status,created_at,paid_at,notes').order('created_at',{ascending:false}).limit(200);if(aid)q=q.eq('commissioner_id',aid);const {data:e,error}=await q;if(error){$('list').innerHTML='<div class="error">'+esc(error.message)+'</div>';return}const rows=e||[];const ids=[...new Set(rows.map(x=>x.commissioner_id))];const [cs,ss]=await Promise.all([ids.length?db.from('commissioners').select('id,full_name,access_code').in('id',ids):Promise.resolve({data:[]}),rows.length?db.from('sales').select('id,sale_number,client_id,service_date,total').in('id',rows.map(x=>x.sale_id)):Promise.resolve({data:[]})]);const cm=Object.fromEntries((cs.data||[]).map(x=>[x.id,x]));const sm=Object.fromEntries((ss.data||[]).map(x=>[x.id,x]));const clientIds=[...new Set((ss.data||[]).map(x=>x.client_id).filter(Boolean))];const cr=clientIds.length?await db.from('clients').select('id,full_name').in('id',clientIds):{data:[]};const cl=Object.fromEntries((cr.data||[]).map(x=>[x.id,x]));$('pending').textContent=money(rows.filter(x=>x.status==='pending').reduce((a,x)=>a+Number(x.amount),0));$('paid').textContent=money(rows.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount),0));$('list').innerHTML=rows.length?rows.map(x=>{const a=cm[x.commissioner_id]||{};const s=sm[x.sale_id]||{};const c=cl[s.client_id]||{};return '<div class="card '+(x.status==='paid'?'paid':'pending')+'"><div class="row"><b>'+esc(a.full_name||'Comisionista')+'</b><span class="badge">'+(x.status==='paid'?'PAGADA':'PENDIENTE')+'</span></div><div style="margin-top:8px"><b>'+money(x.amount)+'</b> · '+(x.visit_type==='first'?'Primera visita':'Revisita')+'</div><div class="muted">Venta #'+esc(s.sale_number||'—')+' · '+esc(c.full_name||'Cliente')+' · Servicio: '+esc(s.service_date||'—')+'</div>'+(x.status==='pending'?'<button class="btn green" data-id="'+x.id+'" data-cid="'+x.commissioner_id+'">MARCAR COMO PAGADA</button>':'<div class="muted">Pagada: '+new Date(x.paid_at||x.created_at).toLocaleDateString('es-PE')+'</div>')+'</div>'}).join(''):'<div class="card muted">No hay comisiones para mostrar.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>pay(b.dataset.id,b.dataset.cid))}async function pay(id,cid){if(!confirm('¿Confirmar el pago de esta comisión?'))return;const row=await db.from('commissioner_earnings').select('id,commissioner_id,amount,status').eq('id',id).maybeSingle();if(row.error||!row.data)return alert('No se encontró la comisión.');if(row.data.status!=='pending')return alert('Esta comisión ya fue pagada.');const {error:pe}=await db.from('commissioner_payments').insert({commissioner_id:cid,amount:row.data.amount,payment_method:'manual',notes:'Pago registrado desde Liquidaciones',paid_at:new Date().toISOString()});if(pe)return alert(pe.message);const {error:ue}=await db.from('commissioner_earnings').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',id).eq('status','pending');if(ue)return alert(ue.message);await load()}$('agent').onchange=load;loadAgents();</script></body></html>
