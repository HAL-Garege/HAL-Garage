<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111b"><title>HAL Garage · Referidos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#07111b;--panel:#0e1d2a;--line:#263b4e;--text:#f4f8fb;--muted:#91a4b7;--blue:#1595ff;--green:#49cf42;--orange:#ffb52e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:40px}header{padding:15px 16px;background:#091722;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.logo{font-size:21px;font-weight:900}.logo b{color:#2ba9ff}.muted{color:var(--muted);font-size:12px}.wrap{padding:16px}.title{font-size:28px;font-weight:900}.sub{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric{font-size:24px;font-weight:900;margin-top:5px}.blue{color:#43abff}.green{color:var(--green)}.orange{color:var(--orange)}.btn{display:inline-block;text-decoration:none;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;padding:10px 13px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.ref{border-top:1px solid var(--line);padding:12px 0}.ref:first-child{border-top:0}.plate{font-weight:900;color:#43abff}.badge{padding:4px 8px;border-radius:99px;background:#183047;font-size:10px}.error{color:#ff9a9a;font-size:12px}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header><div class="logo">HAL <b>GARAGE</b> · Referidos</div><div class="muted">Administración</div></header><main class="wrap"><a href="./admin.html" style="color:#8dccff;text-decoration:none;font-size:12px">← Volver a Comisionistas</a><div class="title" style="margin-top:8px">👥 Referidos</div><div class="sub" id="subtitle">Cargando comisionista...</div><div class="grid"><div class="card"><div class="muted">Referidos</div><div class="metric blue" id="count">0</div></div><div class="card"><div class="muted">Visitas</div><div class="metric" id="visits">0</div></div><div class="card"><div class="muted">Comisiones</div><div class="metric orange" id="commissions">S/ 0.00</div></div></div><div class="card"><div class="row"><b>Todos los referidos</b><span class="badge" id="code">—</span></div><div id="list" style="margin-top:8px">Cargando...</div></div></main></div><script>const U='https://maqnglazkhwtzskfddgc.supabase.co',K='sb_publishable_gIB6HrGHT3X7CwIjAHGO8Q_7hYro-I_';const db=supabase.createClient(U,K);const $=id=>document.getElementById(id),money=n=>'S/ '+Number(n||0).toFixed(2);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('list').innerHTML='<div class="error">No se indicó el comisionista.</div>';return}const {data:a,error:ae}=await db.from('commissioners').select('id,full_name,access_code').eq('id',id).maybeSingle();if(ae||!a){$('list').innerHTML='<div class="error">No se encontró el comisionista.</div>';return}$('subtitle').textContent=a.full_name+' · Código '+a.access_code;$('code').textContent=a.access_code;const {data:r,error:re}=await db.from('commissioner_referrals').select('id,client_id,vehicle_id,created_at,active').eq('commissioner_id',id).eq('active',true).order('created_at',{ascending:false});if(re){$('list').innerHTML='<div class="error">'+esc(re.message)+'</div>';return}const rr=r||[];$('count').textContent=new Set(rr.map(x=>x.client_id)).size;const clientIds=[...new Set(rr.map(x=>x.client_id))],vehicleIds=[...new Set(rr.map(x=>x.vehicle_id).filter(Boolean))];let clients=[],vehicles=[];if(clientIds.length){const q=await db.from('clients').select('id,full_name,phone').in('id',clientIds);clients=q.data||[]}if(vehicleIds.length){const q=await db.from('vehicles').select('id,plate').in('id',vehicleIds);vehicles=q.data||[]}const {data:e}=await db.from('commissioner_earnings').select('amount,status,sale_id,visit_type,created_at').eq('commissioner_id',id);const earnings=e||[];$('visits').textContent=earnings.length;$('commissions').textContent=money(earnings.reduce((sum,x)=>sum+Number(x.amount||0),0));const cmap=Object.fromEntries(clients.map(x=>[x.id,x])),vmap=Object.fromEntries(vehicles.map(x=>[x.id,x]));if(!rr.length){$('list').innerHTML='<div class="muted">Este comisionista todavía no tiene referidos.</div>';return}$('list').innerHTML=rr.map((x,i)=>{const c=cmap[x.client_id]||{},v=vmap[x.vehicle_id]||{};const visits=earnings.filter(e=>e.sale_id&&false).length;return '<div class="ref"><div class="row"><div><b>'+esc(c.full_name||'Cliente')+'</b><div class="muted">📱 '+esc(c.phone||'Sin teléfono')+'</div></div>'+(v.plate?'<span class="plate">'+esc(v.plate)+'</span>':'<span class="badge">Sin placa</span>')+'</div><div class="muted" style="margin-top:6px">Registrado: '+new Date(x.created_at).toLocaleDateString('es-PE')+'</div></div>'}).join('')}load()</script></body></html>
