name: Build Club HAL icon
on:
  push:
    paths:
      - 'club-hal-garage/club-icon.svg'
      - '.github/workflows/build-club-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 club-hal-garage/club-icon.svg -o club-hal-garage/club-icon-192.png
          rsvg-convert -w 512 -h 512 club-hal-garage/club-icon.svg -o club-hal-garage/club-icon-512.png
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add club-hal-garage/club-icon-192.png club-hal-garage/club-icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'Build Club HAL raster icons'
          git push
